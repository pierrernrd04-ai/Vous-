<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prono · Analyse football</title>
  <meta name="description" content="Tous les matchs de football du monde, pronostics statistiques, scores en direct et alertes buts.">
  <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="bar-top">
      <div class="brand"><img src="icon.svg" alt="" width="26" height="26">Prono</div>
      <nav id="tabs"></nav>
      <div class="tools">
        <button id="refresh" aria-label="Actualiser" title="Actualiser">↻</button>
        <button id="bell" aria-label="Notifications" title="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
      </div>
    </div>
    <div id="days" class="days"></div>
    <div id="filters" class="filters"></div>
  </header>
  <main id="main"></main>
  <footer><span id="status">Chargement…</span></footer>
  <nav id="bottom" class="bottom" aria-label="Navigation"></nav>
  <div id="sheet" class="sheet" hidden><div class="sheet-in" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" hidden role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>

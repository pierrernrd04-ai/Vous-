# Déploie le tracker « Routine & Performance » (apps/tracker) sur Cloudflare Pages + D1.
# Secrets requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN  : jeton avec « Cloudflare Pages : Edit » et « D1 : Edit »
#   CLOUDFLARE_ACCOUNT_ID : identifiant du compte Cloudflare
name: Tracker

on:
  push:
    paths:
      - "apps/tracker/**"
      - ".github/workflows/tracker.yml"
  workflow_dispatch:

concurrency:
  group: tracker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/tracker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: routine-pierre
      DB_NAME: rp-tracker
      WRANGLER: npx --yes wrangler@4.20.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Construire la page
        run: node build.mjs
      - name: Vérifier les secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Ajoute les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID (voir apps/tracker/README.md)"
            exit 1
          fi
      - name: Base de données D1
        run: |
          set -euo pipefail
          find_id() { $WRANGLER d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const d=l.find(x=>x.name===process.env.DB_NAME);process.stdout.write(d?(d.uuid||d.database_id||''):'')})"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then $WRANGLER d1 create "$DB_NAME"; ID=$(find_id); fi
          test -n "$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          echo "Base D1 : $ID"
      - name: Projet Pages
        run: $WRANGLER pages project create "$PROJECT" --production-branch=main || echo "Le projet existe déjà."
      - name: Déployer
        run: |
          set -euo pipefail
          $WRANGLER pages deploy public --project-name="$PROJECT" --branch=main --commit-dirty=true | tee deploy.log
          echo "### Tracker en ligne" >> "$GITHUB_STEP_SUMMARY"
          grep -o 'https://[a-z0-9.-]*\.pages\.dev' deploy.log | tail -1 >> "$GITHUB_STEP_SUMMARY" || true

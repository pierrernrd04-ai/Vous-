<!doctype html>
<!-- Jar3D check: 4 rotations + turntable. node tools/snap.mjs tools/test/jar3d-check.html /tmp/j.png --t 0 --w 1920 --h 1080 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../brand/brand.css">
<script src="../../brand/brand.js"></script>
<script src="../lib/scene-kit.js"></script>
<script src="../lib/jar3d.js"></script>
</head><body>
<div id="stage" class="ak-stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script>
const ctx = document.getElementById('c').getContext('2d');
let jar;
SK.scene({ stage: '#stage', width: 1920, height: 1080, duration: 6,
  async ready() {
    // paths relative to this file (tools/test/), scenes in vN/ use AMBREL.assets.*
    const imgs = await SK.loadImages({ body: '../../brand/png/packshot-body-2400.png', lid: '../../brand/png/packshot-lid-2400.png', label: '../../brand/png/label-wrap-2x.png' });
    jar = new Jar3D(imgs);
  },
  seek(t) {
    ctx.fillStyle = '#F6EFE4'; ctx.fillRect(0, 0, 1920, 1080);
    const rots = [0, 0.6, -2.1, 2.1, t * 1.2];
    rots.forEach((r, i) => jar.draw(ctx, { x: 20 + i * 380, y: 160, scale: 0.62, rot: r, lidLift: i === 4 ? 60 * Math.sin(t) ** 2 : 0, light: i === 1 ? 0.45 : undefined }));
    ctx.fillStyle = '#211B16'; ctx.font = '700 28px Manrope';
    ['rot 0', 'rot 0.6 + sheen', 'rot -2.1 (composition)', 'rot +2.1 (conseils)', 'turntable t*1.2'].forEach((s, i) => ctx.fillText(s, 60 + i * 380, 120));
  } });
</script></body></html>

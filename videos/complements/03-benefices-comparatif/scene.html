-->

<body>

<script>
(function () {
  'use strict';
  const A = window.AMBREL, NB = A.NB, $ = (s) => document.querySelector(s);
  const { prog, seg, ease, kf, win, spring, set, lerp, clamp } = SK;
  const DUR = 20;
  const MC = SK.params.qs.get('mc') === '1'; // debug: match-cut overlay (title + jar at 50 %)
  const T = {
    cutB: 0.85, cutC: 1.70, hlA: 1.86, hlB: 2.42,
    pullA: 2.45, pullB: 3.02, pushA: 3.10, pushB: 3.52, xA: 3.44, xB: 3.64,
    mg: 3.74, ligL: 4.82, ligR: 4.98, bondL: 5.40, bondR: 5.58, gly: 6.22,
    s2out: 6.90, s3in: 6.94,
    c1: 7.14, c3: 7.90, c4: 8.50, c2: 9.10,
    s3out: 12.24, tblIn: 12.50, row0: 12.74, rowStep: 0.42,
    s4out: 15.42, legal: 15.74, logo: 16.24, cta: 17.60,
  };
  window.V3_TIMES = T;

  // ------------------------------------------------------------------ texts (all from brand.js)
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9%]/g, '');
  const VT = window.VO_TIMINGS || { cues: [] };
  const cue = (id) => VT.cues.find((c) => c.id === id);
  function wordsFor(id, text, a, b) { const c = cue(id); return c && c.words && c.words.length ? c.words : SK.estimateWords(text, a, b); }

  $('#badge').textContent = A.mentions.v3.badge;
  $('#disclosure').textContent = A.mentions.v3.open;

  // S2 title + definition (product fact, AMBREL.product.formExplained)
  $('#s2title').textContent = 'Bisglycinate';
  const fe = A.product.formExplained;
  const defText = '= ' + fe.charAt(0).toLowerCase() + fe.slice(1);
  const fw = wordsFor('forme', 'Bisglycinate : du magnésium lié à 2 molécules de glycine.', 2.95, 6.89);
  const defWords = defText.split(' ');
  const defTimes = []; { let j = 0, last = fw[fw.length - 1].start;
    defWords.forEach((w) => {
      if (w === '=') { const k = fw.findIndex((x) => norm(x.w) === 'du'); defTimes.push(k >= 0 ? fw[k].start : 3.95); return; }
      const n = norm(w); const k = fw.findIndex((x, i) => i >= j && norm(x.w) === n);
      if (k >= 0 && !/^\(/.test(w)) { defTimes.push(fw[k].start); j = k + 1; }
      else { last += 0.1; defTimes.push(last); }
    }); }
  let inParen = false;
  $('#s2def').innerHTML = defWords.map((w) => {
    if (/^\(/.test(w)) inParen = true;
    const cls = inParen ? 'soft' : (/^(magn|glycine)/.test(norm(w)) ? 'em' : '');
    return `<span class="${cls}">${w}</span>`;
  }).join(' ');
  const defSpans = Array.from($('#s2def').children);

  // S3 callouts
  const claim1 = A.claims.nerveux, claim2 = A.claims.muscle;
  const c1w = claim1.split(' ');
  $('#c1t').innerHTML = c1w.map((w, i) => `<span>${w}${i < c1w.length - 1 ? ' ' : ''}</span>`).join('');
  const c1spans = Array.from($('#c1t').children);
  const cw = wordsFor('claim', claim1, 7.0, 12.3);
  const c1times = c1w.map((w, i) => (cw.length === c1w.length ? cw[i] : SK.estimateWords(claim1, 7.0, 12.3)[i]));
  $('#c2t').textContent = claim2;
  const mgParts = A.product.mgShort.split(' · ');               // ['300 mg', '80 % VNR']
  $('#c3big').innerHTML = mgParts[0].replace(NB + 'mg', `<small>mg</small>`);
  $('#c3sub').textContent = mgParts[1];
  $('#c4sub').innerHTML = 'gélules<br>végétales<br>par jour';  // « 3 gélules végétales par jour »

  // S4 title (spoken line) + rows (facts on Ambrel only; right column = invitation to check)
  const cmpW = wordsFor('compare', 'Compare les étiquettes, ligne par ligne.', 12.55, 15.07);
  const cmpText = 'Compare les étiquettes, ligne par ligne.'.split(' ');
  $('#s4title').innerHTML = `<div>${cmpText.slice(0, 3).map((w) => `<span class="w">${w}</span>`).join(' ')}</div>` +
    `<div class="l2">${cmpText.slice(3).map((w) => `<span class="w">${w}</span>`).join(' ')}</div>`;
  const s4spans = Array.from($('#s4title').querySelectorAll('.w'));
  const s4times = cmpText.map((w, i) => (cmpW[i] ? cmpW[i].start : 12.6 + i * 0.3));
  const ROWS = [
    ['Forme du magnésium', 'Bisglycinate'],
    ['Magnésium par jour', `300${NB}mg (80${NB}% VNR)`],
    ['Vitamine B6 par jour', `1,4${NB}mg (100${NB}% VNR)`],
    ['Gélule', 'Végétale'],
    ['Arôme, édulcorant', 'Aucun'],
    ['Dose', A.product.dose],
  ];
  const ROW_Y0 = 652, ROW_H = 98;
  $('#rows').innerHTML = ROWS.map((r, i) => `
    <div class="row" style="top:${ROW_Y0 + i * ROW_H}px">
      <div class="sep"></div><div class="sepB"></div>
      <svg class="chk" viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#C46F28"/>
        <path d="M13.5 24.5 L21 32 L35 17" fill="none" stroke="#F6EFE4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></svg>
      <div class="txt"><div class="crit">${r[0]}</div><div class="val">${r[1]}</div></div>
      <div class="q">?</div>
    </div>`).join('');
  const rowEls = Array.from(document.querySelectorAll('.row')).map((el) => ({
    el, sep: el.querySelector('.sep'), sepB: el.querySelector('.sepB'), chk: el.querySelector('.chk'),
    path: el.querySelector('.chk path'), txt: el.querySelector('.txt'), q: el.querySelector('.q'),
  }));
  $('#hdrLogo').src = A.assets.logo;

  // S5
  $('#s5logo').src = A.assets.logo;
  $('#cta').textContent = A.cta.alt[1];                          // « Lis l’étiquette complète »
  $('#s5legal').innerHTML = `${A.legal.full}<span class="ak-fictive">${A.legal.fictive}</span>`;

  // hook captions (kinetic, word by word, from the measured timings)
  const hookCue = cue('hook') ? [cue('hook')] : [{ start: 0.1, end: 2.8, text: 'Avant d’acheter un magnésium, lis cette ligne.' }];
  const captions = new SK.Captions($('#captions'), hookCue, { maxWords: 3, maxChars: 20, emphasis: ['magnésium', 'ligne'] });

  // ------------------------------------------------------------------ helpers
  function show(el, o) { el.style.visibility = o > 0.002 ? 'visible' : 'hidden'; if (o > 0.002) el.style.opacity = clamp(o).toFixed(3); }
  const springP = (t, t0, f, d) => (t < t0 ? 0 : spring(t, t0, f, d));
  const R = 278; // jar radius (packshot units)

  // ------------------------------------------------------------------ dust (back) + bokeh (front), deterministic
  const dust = $('#dust').getContext('2d'), front = $('#front').getContext('2d');
  function sprite(r, rgb, a0) {
    const c = document.createElement('canvas'); c.width = c.height = r * 2; const x = c.getContext('2d');
    const g = x.createRadialGradient(r, r, 0, r, r, r);
    g.addColorStop(0, `rgba(${rgb},${a0})`); g.addColorStop(0.55, `rgba(${rgb},${a0 * 0.45})`); g.addColorStop(1, `rgba(${rgb},0)`);
    x.fillStyle = g; x.fillRect(0, 0, r * 2, r * 2); return c;
  }
  const spDust = sprite(16, '255,244,222', 1), spBok = sprite(120, '255,236,200', 0.9), spBokA = sprite(120, '237,180,103', 0.9);
  const RD = SK.rng(17);
  const dots = Array.from({ length: 46 }, () => ({ x: RD() * 1080, y: RD() * 1920, r: 3 + RD() * 9, s: 10 + RD() * 24, ph: RD() * 6.28, a: 0.25 + RD() * 0.45 }));
  const boks = Array.from({ length: 9 }, () => ({ x: RD() * 1080, y: RD() * 1920, r: 60 + RD() * 110, s: 26 + RD() * 40, ph: RD() * 6.28, a: 0.10 + RD() * 0.14, amb: RD() > 0.5 }));
  function drawDust(t, amt) {
    dust.clearRect(0, 0, 1080, 1920);
    if (amt <= 0) return;
    for (const d of dots) {
      const y = ((d.y - t * d.s) % 1920 + 1920) % 1920, x = d.x + Math.sin(t * 0.5 + d.ph) * 18;
      dust.globalAlpha = amt * d.a * (0.65 + 0.35 * Math.sin(t * 1.7 + d.ph));
      dust.drawImage(spDust, x - d.r, y - d.r, d.r * 2, d.r * 2);
    }
    dust.globalAlpha = 1;
  }
  // out-of-focus foreground props (capsules, mineral crystal): pre-blurred sprites, parallax drift
  const PROPS = [];
  function blurred(draw, w, h, blur) {
    const pad = Math.ceil(blur * 3) + 70, c = document.createElement('canvas'); c.width = w + 2 * pad; c.height = h + 2 * pad;
    const x = c.getContext('2d'); x.filter = `blur(${blur}px)`; x.translate(pad, pad); draw(x, w, h); return c;
  }
  function crystal(x, w, h) {
    const shards = [[0.30, 1.0, 0.18, 0.92, -0.10], [0.58, 1.0, 0.22, 0.70, 0.18], [0.80, 1.0, 0.14, 0.50, 0.32]];
    shards.forEach(([cx, by, hw, ht, lean]) => {
      const X = cx * w, B = by * h, top = [X + lean * w * 0.5, B - ht * h];
      const L = [X - hw * w, B], Rr = [X + hw * w, B], M = [X + lean * w * 0.15, B - ht * h * 0.35];
      const face = (pts, col) => { x.fillStyle = col; x.beginPath(); pts.forEach((p, i) => (i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]))); x.closePath(); x.fill(); };
      face([L, top, M], '#EEF2F5'); face([M, top, Rr], '#AFC0CC'); face([L, M, Rr], '#C7D2DA');
    });
  }
  function drawProps(t, amt) {
    for (const p of PROPS) {
      const y = p.y - t * 5 * p.d + Math.sin(t * 0.5 + p.ph) * 8 * p.d + p.shift(t);
      const x = p.x + Math.sin(t * 0.3 + p.ph) * 10 * p.d;
      front.save(); front.globalAlpha = amt * p.a; front.translate(x, y); front.rotate((p.r + Math.sin(t * 0.4 + p.ph) * 3) * Math.PI / 180);
      front.drawImage(p.c, -p.c.width / 2, -p.c.height / 2); front.restore();
    }
  }
  function drawFront(t, amt, dx) {
    front.clearRect(0, 0, 1080, 1920);
    if (t > T.xA) drawProps(t, prog(t, T.xA, T.xB + 0.5));
    if (amt <= 0) return;
    for (const b of boks) {
      const y = ((b.y - t * b.s) % 2300 + 2300) % 2300 - 190, x = b.x + Math.sin(t * 0.35 + b.ph) * 40 + (dx || 0) * (b.r / 120);
      front.globalAlpha = amt * b.a;
      front.drawImage(b.amb ? spBokA : spBok, x - b.r, y - b.r, b.r * 2, b.r * 2);
    }
    front.globalAlpha = 1;
  }

  // ------------------------------------------------------------------ jar
  const jc = $('#jarc').getContext('2d');
  let jarHi = null, jarLo = null;
  // honey highlighter on « bisglycinate de magnésium » (ingredients line), label units (1748 x 530)
  const HL = { u0: 161, u1: 334, v0: 276.5, v1: 299 };
  function drawHighlight(ctx, X0, Y0, s, rot, p) {
    if (p <= 0) return;
    const G = Jar3DT.GEOMETRY, Rr = (G.bx1 - G.bx0) / 2, CX = (G.bx0 + G.bx1) / 2, n = 36;
    const ue = lerp(HL.u0, HL.u1, p);
    const pt = (u, v) => {
      const th = 2 * Math.PI * (u / 1748 - 0.5) - rot, dx = Rr * Math.sin(th);

          cx = 540; cy = lerp(1560, 852, e) + fl * prog(t, 7.4, 8); s = 0.44;
          rot = lerp(-1.6, -0.28, ease.outCubic(prog(t, T.s3in, T.s3in + 0.8))) + 0.56 * ease.inOutSine(prog(t, 7.6, 12.2));
          light = prog(t, 10.2, 11.3); sh = prog(t, T.s3in + 0.15, T.s3in + 0.6);
          alpha = prog(t, T.s3in, T.s3in + 0.15);
        } else if (t < T.s4out) {
          const e = seg(t, T.s3out, T.s3out + 0.55, ease.inOutCubic);
          const lift = Math.sin(Math.PI * e) * -90;
          cx = lerp(540, 132, e); cy = lerp(852, 611, e) + lift; s = Math.exp(lerp(Math.log(0.44), Math.log(0.08), e));
          rot = lerp(0.28, 0, e); sh = 1 - prog(t, T.s3out, T.s3out + 0.3);
        } else {
          const e = springP(t, T.s4out, 1.0, 0.62);
          const ee = ease.outCubic(prog(t, T.s4out, T.s4out + 0.75));
          cx = lerp(132, 540, ee); cy = lerp(611, 682, ee) + fl * prog(t, 16.4, 17); s = Math.exp(lerp(Math.log(0.08), Math.log(0.40), clamp(e, 0, 1.08)));
          rot = -2 * Math.PI * (1 - ease.outCubic(prog(t, T.s4out, T.s4out + 1.0))) + 0.16 * Math.sin((t - 16.4) * 0.6) * prog(t, 16.4, 17.2);
          light = prog(t, 17.2, 18.4); sh = prog(t, T.s4out + 0.3, T.s4out + 0.8);
        }
        const X0 = cx - 500 * s, Y0 = cy - 606 * s;
        if (sh > 0) shadow(cx, Y0 + 1066 * s, s, sh);
        jc.globalAlpha = alpha;
        (s > 1.0 ? jarHi : jarLo).draw(jc, { x: X0, y: Y0, scale: s, rot, light });
        jc.globalAlpha = 1;
        J = { X0, Y0, s, rot };
      }

      // ---------------- S1 captions + mentions
      captions.update(t);
      if (t > 2.4) $('#captions').style.opacity = (parseFloat($('#captions').style.opacity || 1) * (1 - prog(t, 2.5, 2.64))).toFixed(3);
      show($('#disclosure'), win(t, 0, 2.2, 0.01, 0.3));
      set($('#badge'), { o: 1 });

      // ---------------- S2 : la forme
      const s2o = prog(t, T.xA, T.xB) * (1 - prog(t, T.s2out, T.s2out + 0.3));
      show($('#s2'), t < T.xA || t > T.s2out + 0.3 ? 0 : 1);
      if (t >= T.xA && t <= T.s2out + 0.3) {
        const out = seg(t, T.s2out, T.s2out + 0.3, ease.inCubic);
        set($('#s2title'), { y: -out * 90, s: wordDrift(t) + 0.04 * out, o: (MC ? 0.5 : prog(t, T.xA, T.xB)) * (1 - out) });
        set($('#s2kicker'), { y: (1 - seg(t, 3.7, 4.1, ease.outCubic)) * 18 - out * 90, o: prog(t, 3.7, 3.95) * (1 - out) });
        drawMolecule(t);
        set($('#mol'), { y: -out * 120, s: 1 - 0.25 * out, o: 1 - out });
        defSpans.forEach((sp, i) => {
          const a = defTimes[i] - 0.08, p = ease.outBack(prog(t, a, a + 0.22), 1.8);
          set(sp, { y: (1 - p) * 22 - out * 70, s: lerp(0.9, 1, p), o: prog(t, a, a + 0.1) * (1 - out) });
        });
      }

      // ---------------- S3 : bénéfices autour du produit
      const inS3 = t >= T.s3in && t < T.s3out + 0.5;
      show($('#s3'), inS3 ? 1 : 0);
      if (inS3 && J) {
        CONN.forEach((c, k) => {
          const exit = seg(t, T.s3out + k * 0.025, T.s3out + 0.16 + k * 0.025, ease.outQuad);
          const pd = springP(t, c.t0 - 0.3, 2.2, 0.5);
          const pl = seg(t, c.t0 - 0.26, c.t0 + 0.02, ease.inOutCubic) * (1 - exit);
          const pc = springP(t, c.t0, 1.9, 0.55);
          const B = feature(J, c.f[0], c.f[1], 0);
          const hh = SK.handheld(t, 3, 0.5, 11 + k); // cards float on their own plane (parallax vs jar)
          const cardDX = hh.x, cardDY = hh.y + (1 - Math.min(pc, 1)) * 26 - exit * 30;
          const Aa = anchorOf(c); const Ap = { x: Aa.x + cardDX, y: Aa.y + cardDY };
          const E = (c.anchor === 'left' || c.anchor === 'right') ? { x: lerp(Ap.x, B.x, 0.35), y: Ap.y } : { x: Ap.x, y: lerp(Ap.y, B.y, 0.4) };
          const L = Math.hypot(E.x - B.x, E.y - B.y) + Math.hypot(Ap.x - E.x, Ap.y - E.y);
          c.ln.setAttribute('points', `${B.x.toFixed(1)},${B.y.toFixed(1)} ${E.x.toFixed(1)},${E.y.toFixed(1)} ${Ap.x.toFixed(1)},${Ap.y.toFixed(1)}`);
          c.ln.style.strokeDasharray = `${L.toFixed(1)} ${(L + 10).toFixed(1)}`;
          c.ln.style.strokeDashoffset = (L * (1 - pl)).toFixed(1);
          const dv = clamp(pd) * (1 - exit) * clamp(B.vis * 3);
          c.dot.setAttribute('cx', B.x.toFixed(1)); c.dot.setAttribute('cy', B.y.toFixed(1)); c.dot.setAttribute('r', (10 * Math.max(0, pd)).toFixed(2));
          c.dot.style.opacity = dv.toFixed(3);
          const rq = (Math.max(0, t - c.t0 + 0.3) % 1.6) / 1.6;
          c.ring.setAttribute('cx', B.x.toFixed(1)); c.ring.setAttribute('cy', B.y.toFixed(1)); c.ring.setAttribute('r', (12 + 26 * rq).toFixed(1));
          c.ring.style.opacity = (t > c.t0 - 0.3 ? (1 - rq) * 0.8 * dv : 0).toFixed(3);
          c.anc.setAttribute('cx', Ap.x.toFixed(1)); c.anc.setAttribute('cy', Ap.y.toFixed(1)); c.anc.style.opacity = (prog(t, c.t0 - 0.05, c.t0 + 0.05) * (1 - exit)).toFixed(3);
          set(c.el, { x: cardDX, y: cardDY, s: lerp(0.88, 1, Math.min(pc, 1.04)) - exit * 0.05, o: prog(t, c.t0, c.t0 + 0.14) * (1 - exit) });
        });
        // claim 1: honey marker follows the voice word by word
        c1spans.forEach((sp, i) => {
          const w = c1times[i]; const p = w ? prog(t, w.start - 0.04, w.end) : 0;
          const v = (p * 100).toFixed(1) + '% 42%';
          if (sp._v !== v) { sp.style.backgroundSize = v; sp._v = v; }
        });
      }

      // ---------------- S4 : comparatif factuel
      const inS4 = t >= T.tblIn && t < T.s4out + 0.4;
      show($('#s4'), inS4 ? 1 : 0); show($('#s4back'), inS4 ? 1 : 0);
      if (inS4) {
        const out = seg(t, T.s4out, T.s4out + 0.32, ease.inCubic);
        s4spans.forEach((sp, i) => {
          const a = s4times[i] - 0.08, p = ease.outBack(prog(t, a, a + 0.24), 1.7);
          set(sp, { y: (1 - p) * 34, o: prog(t, a, a + 0.1) });
        });
        set($('#s4title'), { y: -out * 60, o: 1 - out });
        const tin = springP(t, T.tblIn, 1.4, 0.6);
        set($('#tbl'), { y: (1 - Math.min(tin, 1.05)) * 70 - out * 50, o: prog(t, T.tblIn, T.tblIn + 0.2) * (1 - out) });
        set($('#s4back'), { y: (1 - Math.min(tin, 1.05)) * 70 - out * 50, o: prog(t, T.tblIn, T.tblIn + 0.2) * (1 - out) });
        set($('#hdrB'), { o: prog(t, T.tblIn + 0.25, T.tblIn + 0.45) });
        set($('#hdrA'), { x: (1 - seg(t, T.tblIn + 0.45, T.tblIn + 0.8, ease.outCubic)) * -20, o: prog(t, T.tblIn + 0.45, T.tblIn + 0.7) });
        rowEls.forEach((r, i) => {
          const tr = T.row0 + i * T.rowStep;
          const p = seg(t, tr, tr + 0.3, ease.outCubic);
          set(r.txt, { x: (1 - p) * -34, o: prog(t, tr, tr + 0.16) });
          set(r.sep, { sx: p }); set(r.sepB, { sx: seg(t, tr + 0.1, tr + 0.4, ease.outCubic) });
          const pk = springP(t, tr + 0.04, 2.2, 0.5);
          set(r.chk, { s: Math.max(0, pk), o: prog(t, tr + 0.04, tr + 0.1) });
          r.path.style.strokeDashoffset = (1 - seg(t, tr + 0.12, tr + 0.34, ease.inOutCubic)).toFixed(3);
          const pq = springP(t, tr + 0.18, 2.0, 0.5);
          set(r.q, { s: Math.max(0, pq), r: (1 - Math.min(pq, 1)) * -25, o: prog(t, tr + 0.18, tr + 0.26) });
        });
      }

      // ---------------- S5 : carton final (legal block static once shown)
      const inS5 = t >= T.legal - 0.05;
      show($('#s5'), inS5 ? 1 : 0);
      if (inS5) {
        set($('#s5legal'), { o: prog(t, T.legal, T.legal + 0.2) });
        const pl = springP(t, T.logo, 1.6, 0.55);
        set($('#s5logo'), { y: (1 - Math.min(pl, 1.05)) * 30, s: lerp(0.94, 1, Math.min(pl, 1)), o: prog(t, T.logo, T.logo + 0.2) });
        const pc = springP(t, T.cta, 1.8, 0.5);
        set($('#s5cta'), { y: (1 - Math.min(pc, 1.05)) * 26, s: lerp(0.9, 1, Math.min(pc, 1.03)), o: prog(t, T.cta, T.cta + 0.14) });
      }
    },
  });
})();
</script>
</body>

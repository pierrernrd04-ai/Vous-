<!doctype html>
<!--
  Ambrel · V4 « Film cinématique » (16:9, 1920x1080, 23 s, 30 fps).
  6 plans retenus sur 10 (voir shots.md) : S1 Éveil · S3 Texture · S4 Geste · S7 Héros · S9 Détail lumière · S10 Signature.
  Images : WebGL2 (gl-shots.js : un shader par plan + post grain / bloom / fuites de lumière / letterbox 2,39:1),
  avant-plans dessinés en canvas 2D (fg.js : main stylisée, carafe, verre ; pot Jar3D), textes en DOM (brand.css).
  Textes réglementés copiés depuis brand/brand.js. Voix : audio/v4-timings.js (vo-build.mjs).
  Render : node tools/render.mjs 04-film-cinematique/scene.html out.mp4 --w 1920 --h 1080 --fps 30 --dur 23
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ambrel · V4 film cinématique</title>
<link rel="stylesheet" href="../brand/brand.css">
<script src="../brand/brand.js"></script>
<script src="../tools/lib/scene-kit.js"></script>
<script src="../tools/lib/jar3d.js"></script>
<script src="audio/v4-timings.js"></script>
<script src="gl-shots.js"></script>
<script src="fg.js"></script>
<style>
  #stage { background: #000; }
  #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .w { display: inline-block; white-space: pre; will-change: transform, opacity; }
  /* opening disclosure, in the lower letterbox bar */
  #disc { position: absolute; left: 0; width: 1920px; top: 966px; text-align: center; z-index: 50; }
  #disc span { display: inline-block; font: 700 28px/1.2 var(--font-ui); color: var(--cream); letter-spacing: 0.015em;
               padding: 10px 24px; border-radius: 14px; background: rgba(33, 27, 22, 0.72); }
  /* cinematic subtitles (VO L1, L2) in the lower letterbox bar */
  #sub { position: absolute; left: 96px; width: 1728px; top: 956px; height: 62px; text-align: center; z-index: 40;
         font: 500 52px/60px var(--font-display); font-variation-settings: 'opsz' 144; letter-spacing: -0.01em; color: var(--cream); }
  /* lower third (S7) */
  #lower { position: absolute; left: 116px; top: 676px; width: 600px; z-index: 40; }
  #lower .rule { width: 56px; height: 3px; background: var(--honey); border-radius: 2px; margin-bottom: 18px; transform-origin: 0 50%; }
  #lower .k { font: 800 22px/1 var(--font-ui); letter-spacing: 0.26em; text-transform: uppercase; color: var(--honey); margin-bottom: 14px; }
  #lower .n { font: 500 50px/1.1 var(--font-display); font-variation-settings: 'opsz' 144; letter-spacing: -0.012em; color: var(--cream);
              text-shadow: 0 2px 24px rgba(20, 10, 4, 0.55); }
  #lower .n i { font-style: italic; font-weight: 400; }
  /* claim (S9 -> stays on the end card) */
  #claim { position: absolute; left: 260px; width: 1400px; top: 452px; text-align: center; z-index: 40;
           font: 700 44px/1.3 var(--font-ui); letter-spacing: -0.005em; color: var(--cream);
           text-shadow: 0 2px 18px rgba(30, 12, 2, 0.55); }
  #claim .w { transform-origin: 50% 70%; }
  /* end card */
  #endLogo { position: absolute; left: 700px; top: 108px; width: 520px; z-index: 40; }
  #sig { position: absolute; left: 0; width: 1920px; top: 318px; text-align: center; z-index: 40;
         font: 400 60px/1.1 var(--font-display); font-style: italic; font-variation-settings: 'opsz' 144; color: var(--honey); letter-spacing: -0.01em; }
  #legal { position: absolute; left: 170px; width: 1580px; top: 708px; z-index: 40; text-align: left; }
</style>
</head>
<body>
<div id="stage" class="ak-stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="lower"><div class="rule"></div><div class="k"></div><div class="n"></div></div>
  <div id="claim"></div>
  <img id="endLogo" alt="">
  <div id="sig"></div>
  <div id="legal" class="ak-legal is-dark is-wide"></div>
  <div id="sub"></div>
  <div id="disc"><span></span></div>
  <div id="badge" class="ak-badge is-wide"></div>
</div>
<script>
(function () {
  'use strict';
  const A = window.AMBREL, $ = (s) => document.querySelector(s);
  const { prog, seg, ease, kf, win, lerp, clamp } = SK;
  const DUR = 23, W = 1920, H = 1080, BAR = 138;
  const COVER = SK.params.qs.get('cover') === '1';   // cover still: full lower third

  // ---------------------------------------------------------------- texts (exact wording from brand.js)
  $('#badge').textContent = A.mentions.v4.badge;
  $('#disc span').textContent = A.mentions.v4.open;
  $('#legal').innerHTML = `${A.legal.full}<span class="ak-fictive">${A.legal.fictive}</span>`;
  $('#endLogo').src = A.assets.logoLight;

  const VO = window.VO_TIMINGS;
  const cue = (id) => VO.cues.find((c) => c.id === id);
  const spans = (el, words) => {
    el.innerHTML = '';
    return words.map((w, i) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w;
      el.appendChild(s); if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
      return s;
    });
  };
  // subtitles L1, L2 (word timings from the voice track)
  const SUBS = ['eau', 'geste'].map((id) => { const c = cue(id); return { c, words: c.words }; });
  // lower third: « Ambrel » kicker + product name (A.product.name), words mapped onto the spoken words
  const prodCue = cue('produit');
  $('#lower .k').textContent = A.name;
  const nameTokens = A.product.name.split(' ');            // Magnésium bisglycinate + vitamine B6
  const nameEl = $('#lower .n');
  const nameSpans = nameTokens.map((w, i) => {
    const s = document.createElement('span'); s.className = 'w';
    if (/bisglycinate/i.test(w)) { const it = document.createElement('i'); it.textContent = w; s.appendChild(it); } else s.textContent = w;
    nameEl.appendChild(s);
    if (i === 1) nameEl.appendChild(document.createElement('br')); else if (i < nameTokens.length - 1) nameEl.appendChild(document.createTextNode(' '));
    return s;
  });
  // spoken: Ambrel. Magnésium bisglycinate et vitamine B6.  -> name token i <- spoken word i+1 (« + » <- « et »)
  const nameTimes = nameTokens.map((_, i) => prodCue.words[Math.min(i + 1, prodCue.words.length - 1)].start);
  // claim: two balanced lines, exact text of A.claims.fatigue
  const claimCue = cue('claim');
  const claimWords = A.claims.fatigue.split(' ');
  const claimEl = $('#claim');
  const claimSpans = claimWords.map((w, i) => {
    const s = document.createElement('span'); s.className = 'w'; s.textContent = w; claimEl.appendChild(s);
    if (w === 'B6') claimEl.appendChild(document.createElement('br')); else if (i < claimWords.length - 1) claimEl.appendChild(document.createTextNode(' '));
    return s;
  });
  const claimTimes = claimCue.words.map((w) => w.start);
  // signature « Tout est écrit. »
  const sigCue = cue('signature');
  const sigSpans = spans($('#sig'), A.tagline.split(' '));
  const subEl = $('#sub');

  // ---------------------------------------------------------------- shots and crossfades
  const ORDER = ['s1', 's3', 's4', 's7', 's9', 's10'];
  const BOUND = [3.8, 7.4, 11.0, 15.6, 18.2];
  const XF = [0.9, 0.8, 0.5, 0.8, 0.6];
  function shotsAt(t) {
    for (let k = 0; k < BOUND.length; k++) {
      const h = XF[k] / 2;
      if (t >= BOUND[k] - h && t < BOUND[k] + h) return { a: ORDER[k], b: ORDER[k + 1], m: ease.inOutSine(prog(t, BOUND[k] - h, BOUND[k] + h)) };
    }
    let i = 0; while (i < BOUND.length && t >= BOUND[i]) i++;
    return { a: ORDER[i], b: null, m: 0 };
  }
  const BLOOM = { s1: 0.45, s3: 0.65, s4: 0.75, s7: 0.30, s9: 0.55, s10: 0 };

  // S3 camera helpers (same constants as the shader)
  const PITCH = 0.42, SINP = Math.sin(PITCH), COSP = Math.cos(PITCH);
  const camS3 = (t) => { const k = seg(t, 3.3, 7.9, ease.inOutSine); return { x: lerp(-0.06, 0.06, k), z: lerp(-0.05, 0.20, k) }; };
  const depthS3 = (c, x, y, z) => (y - 1) * -SINP + (z - c.z) * COSP;
  const CAP = { x: 0.50, z: 1.98 };

  const setters = {
    s1(f, t) {
      f.u('uZoom', lerp(1.0, 1.075, seg(t, 0, 4.4, ease.inOutSine)));
      f.u('uDrift', lerp(-0.014, 0.016, prog(t, 0, 4.4)));
      f.u('uDawn', lerp(0.12, 0.5, prog(t, 0, 4.4)));
    },
    s3(f, t) {
      const c = camS3(t);
      f.u('uCamX', c.x); f.u('uCamZ', c.z);
      const dDrop = depthS3(c, 0, 0, 2.30), dCap = depthS3(c, CAP.x, 0, CAP.z);
      const focus = lerp(dDrop, dCap, seg(t, 5.75, 6.5, ease.inOutCubic));
      f.u('uFocus', focus);
      f.u('uWarm', lerp(0.0, 0.4, prog(t, 3.4, 7.8)));
      // drop: falls 4.28 -> 4.60
      const dh = t < 4.6 ? 1.6 * Math.pow((4.6 - t) / 0.36, 2) : -1;
      f.u('uDropH', t > 4.2 ? dh : -1); f.u('uStretch', 1.45);
      f.u('uJet', t > 4.6 ? t - 4.6 : -1);
      // capsule: falls 5.80 -> 6.20, small bounce, settles
      let h, r;
      if (t < 6.2) { const k = clamp((t - 5.8) / 0.4); h = 0.95 * (1 - k * k); r = lerp(-0.55, -0.16, k); }
      else { const u = t - 6.2; h = 0.045 * Math.exp(-u * 7) * Math.abs(Math.sin(u * 13)); r = -0.12 - 0.05 * Math.exp(-u * 5) * Math.cos(u * 11); }
      f.u('uCap', CAP.x, CAP.z, h, r);
      f.u('uCapA', t > 5.78 ? 1 : 0);
      const dc = depthS3(c, CAP.x, h + 0.08, CAP.z);
      const cocPx = Math.abs(1 / dc - 1 / focus) * 0.20 * 0.5 * H;
      const spritePx = 0.42 * 1.07 * 1.6 / dc * H;
      const motion = t > 5.8 && t < 6.2 ? 1.2 * prog(t, 5.8, 6.2) : 0;
      f.u('uCapLod', Math.log2(640 / spritePx) + Math.log2(1 + cocPx * 0.55) + motion);
      f.sampler('uCapTex', 2, f.texs.capsule);
    },
    s4(f, t) {
      const cam = camS4(t);
      FG.gesture(fg4, t, cam);
      f.texture('fg4', cv4);
      f.use('s4'); // texture() changed the binding, re-select program uniforms below
      f.u('uRes', W, H); f.u('uT', t);
      f.u('uWarm', cam.warm); f.u('uRoll', cam.roll); f.u('uZoom', cam.zoom); f.u('uPour', FG.pourState(t).fill);
      f.sampler('uFG', 2, f.texs.fg4);
    },
    s7(f, t) {
      const cam = camS7(t);
      FG.hero(fg7, t, cam, jar);
      f.texture('fg7', cv7);
      f.use('s7');
      f.u('uRes', W, H); f.u('uT', t);
      f.u('uOrbit', cam.rot); f.u('uZoom', cam.zoom); f.u('uBeam', cam.beam);
      f.u('uPed', (FG.HERO.cx - 960) / H, (540 - FG.HERO.topY) / H, FG.HERO.pedR / H);
      f.sampler('uFG', 2, f.texs.fg7);
    },
    s9(f, t) {
      f.u('uSlide', lerp(-0.07, 0.09, seg(t, 14.9, 18.6, ease.inOutSine)));
      f.u('uSweep', lerp(-1.15, 1.15, seg(t, 15.3, 18.3, ease.inOutSine)));
      f.u('uDim', seg(t, 15.75, 16.2, ease.inOutSine));
      f.u('uLight', 0.75 + 0.25 * Math.sin(t * 0.9));
    },
    s10() {},
  };
  function camS4(t) {
    return {
      warm: lerp(0.04, 1.0, seg(t, 7.3, 11.1, ease.inOutSine)),
      roll: kf(t, [[9.0, 0], [11.3, -0.024]], ease.inOutSine),
      zoom: kf(t, [[9.0, 1.0], [11.3, 1.035]], ease.inOutSine),
    };
  }
  function camS7(t) {
    const k = seg(t, 10.7, 15.9, ease.inOutSine);
    return { rot: lerp(0.27, -0.25, k), zoom: lerp(1.0, 1.045, k), beam: 0.35 + 0.65 * seg(t, 10.9, 12.1, ease.outCubic), sheen: lerp(0.08, 0.92, prog(t, 11.0, 15.6)) };
  }
  const gauss = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));

  // ---------------------------------------------------------------- canvases
  let film, jar, cv4, fg4, cv7, fg7;
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };

  SK.scene({
    stage: '#stage', width: W, height: H, duration: DUR, safePreset: '16:9',
    async ready() {
      film = new FILM.Film($('#gl'));
      const imgs = await SK.loadImages({ body: A.assets.jarBody, lid: A.assets.jarLid, label: A.assets.labelWrap, capsule: A.assets.capsulePng });
      jar = new Jar3D(imgs);
      film.texture('capsule', imgs.capsule);
      cv4 = mk(); fg4 = cv4.getContext('2d');
      cv7 = mk(); fg7 = cv7.getContext('2d');
    },
    seek(t, ctx) {
      // ---------------- images
      const s = shotsAt(t);
      const ids = s.b ? [s.a, s.b] : [s.a];
      ids.forEach((id, k) => film.shot(k, id, t, (f) => setters[id](f, t)));
      const bloom = s.b ? lerp(BLOOM[s.a], BLOOM[s.b], s.m) : BLOOM[s.a];
      const endK = seg(t, 17.95, 18.6, ease.inOutCubic);
      const leakBump = BOUND.reduce((a, b, i) => a + [0.22, 0.28, 0.30, 0.32, 0.12][i] * gauss(t, b, 0.42), 0);
      film.post(t, {
        mix: s.b ? s.m : 0, frame: Math.round(t * ctx.fps),
        grain: lerp(0.055, 0.032, endK), vig: lerp(0.62, 0.30, endK), bloom,
        bar: BAR * (1 - endK),
        flash: 0.26 * gauss(t, 11.0, 0.17),
        leakA: (0.04 + leakBump) * (1 - endK * 0.85),
        leakB: (0.03 + 0.10 * seg(t, 9, 12) + leakBump * 0.8) * (1 - endK * 0.9),
        leakX: lerp(-0.6, 0.7, prog(t, 0, 18)),
      });

      // ---------------- mentions
      SK.set($('#disc'), { o: t < 2.2 ? 1 : 1 - prog(t, 2.2, 2.5) });
      SK.set($('#badge'), { o: 1 });

      // ---------------- subtitles (L1, L2) word by word
      let active = null;
      for (const sb of SUBS) if (t >= sb.c.start - 0.2 && t < sb.c.end + 0.6) active = sb;
      if (active !== subEl._cur) { subEl._cur = active; subEl._spans = active ? spans(subEl, active.words.map((w) => w.w)) : []; }
      if (active) {
        const out = 1 - prog(t, active.c.end + 0.3, active.c.end + 0.6);
        subEl.style.opacity = out.toFixed(3);
        active.words.forEach((w, i) => {
          const p = ease.outCubic(prog(t, w.start - 0.12, w.start + 0.30));
          const sp = subEl._spans[i];
          const now = t >= w.start - 0.08 && t < (active.words[i + 1] ? active.words[i + 1].start - 0.08 : active.c.end + 0.1);
          sp.style.opacity = p.toFixed(3);
          sp.style.transform = `translateY(${((1 - p) * 14).toFixed(1)}px)`;
          sp.style.filter = p < 0.99 ? `blur(${((1 - p) * 5).toFixed(2)}px)` : 'none';
          sp.style.color = now ? 'var(--honey)' : 'var(--cream)';
        });
      } else subEl.style.opacity = '0';

      // ---------------- lower third (S7)
      const lowO = COVER ? 1 : win(t, 11.3, 15.85, 0.35, 0.3);
      $('#lower').style.opacity = lowO.toFixed(3);
      if (lowO > 0) {
        const kp = COVER ? 1 : ease.outCubic(prog(t, prodCue.words[0].start - 0.15, prodCue.words[0].start + 0.45));
        SK.set($('#lower .rule'), { sx: kp, o: kp });
        SK.set($('#lower .k'), { x: (1 - kp) * -16, o: kp });
        nameSpans.forEach((sp, i) => {
          const p = COVER ? 1 : ease.outCubic(prog(t, nameTimes[i] - 0.12, nameTimes[i] + 0.40));
          sp.style.opacity = p.toFixed(3);
          sp.style.transform = `translateY(${((1 - p) * 18).toFixed(1)}px)`;
          sp.style.filter = p < 0.99 ? `blur(${((1 - p) * 6).toFixed(2)}px)` : 'none';
        });
      }

      // ---------------- claim (S9, stays through the end card), current word in honey
      const cO = ease.inOutSine(prog(t, 15.85, 16.15));
      claimEl.style.opacity = cO.toFixed(3);
      if (cO > 0) {
        claimSpans.forEach((sp, i) => {
          const a = claimTimes[i] - 0.06, b = claimTimes[i + 1] !== undefined ? claimTimes[i + 1] - 0.06 : claimCue.end;
          const now = t >= a && t < b;
          sp.style.color = now ? 'var(--honey)' : 'var(--cream)';
          const q = now ? ease.outCubic(prog(t, a, a + 0.12)) : 0;
          sp.style.transform = q ? `scale(${(1 + 0.04 * q).toFixed(3)})` : 'none';
        });
      }

      // ---------------- end card: logo lands, legal (static once visible), signature on the voice
      const lp = ease.outCubic(prog(t, 18.3, 19.15));
      SK.set($('#endLogo'), { s: lerp(1.06, 1, lp), y: (1 - lp) * 10, o: prog(t, 18.3, 18.7), blur: (1 - lp) * 8 });
      SK.set($('#legal'), { o: prog(t, 18.22, 18.55) });
      sigSpans.forEach((sp, i) => {
        const w = sigCue.words[i];
        const p = ease.outCubic(prog(t, w.start - 0.12, w.start + 0.42));
        sp.style.opacity = p.toFixed(3);
        sp.style.transform = `translateY(${((1 - p) * 14).toFixed(1)}px)`;
        sp.style.filter = p < 0.99 ? `blur(${((1 - p) * 5).toFixed(2)}px)` : 'none';
      });
    },
  });
})();
</script>
</body>
</html>

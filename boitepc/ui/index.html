<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoitePC</title>
<style>
/* Layout : barre latérale des outils à gauche, détail de l'outil au centre, journal en direct dessous. */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF; --ink: #121A2B; --muted: #566179; --line: #D9DEE8;
  --accent: #1F4FD8; --accent-ink: #FFFFFF; --accent-soft: #E3EAFC;
  --ok: #0E7A5A; --bad: #B42318; --skip: #9A6700; --side: #E9EDF5;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0D1220; --surface: #151C2E; --ink: #E8ECF5; --muted: #9AA5BD; --line: #27304A;
  --accent: #6E93FF; --accent-ink: #0D1220; --accent-soft: #1D2A4F;
  --ok: #4FD1A5; --bad: #FF8A7A; --skip: #F0B94A; --side: #10172A; color-scheme: dark } }
* { box-sizing: border-box }
html, body { height: 100%; margin: 0 }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); display: grid; grid-template-columns: 270px 1fr; }
button { font: inherit; cursor: pointer }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

aside { background: var(--side); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto }
.brand { padding: 0 8px; display: grid; gap: 2px }
.brand b { font: 700 1.5rem/1.1 var(--display); letter-spacing: -0.01em }
.brand span { color: var(--muted); font-size: .85rem }
nav { display: grid; gap: 4px }
nav button { text-align: left; border: 0; background: transparent; color: var(--ink); border-radius: 9px; padding: 10px 12px; display: grid; gap: 1px }
nav button small { color: var(--muted); font-size: .8rem }
nav button:hover { background: var(--surface) }
nav button[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent) }
nav .sep { height: 1px; background: var(--line); margin: 6px 8px }
.pc { margin-top: auto; padding: 12px; border-radius: 10px; background: var(--surface); font-size: .82rem; color: var(--muted); display: grid; gap: 3px }
.pc b { color: var(--ink); font-weight: 600 }

main { display: grid; grid-template-rows: auto 1fr; min-width: 0; height: 100%; overflow: hidden }
.panel { padding: 28px 32px 20px; display: grid; gap: 16px; border-bottom: 1px solid var(--line); background: var(--surface); max-height: 58vh; overflow-y: auto }
.panel h1 { font: 700 1.9rem/1.15 var(--display); margin: 0 }
.panel .lead { color: var(--muted); margin: 0; max-width: 70ch }
.does { margin: 0; padding-left: 1.1em; display: grid; gap: 3px }
.opts { display: grid; gap: 8px }
.opts h2, .apps h2 { font: 600 .78rem/1 var(--font); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 6px 0 2px }
label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer }
label.opt input { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--accent); flex: none }
label.opt small { display: block; color: var(--muted) }
.apps .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px }
.apps label { display: flex; gap: 8px; align-items: center; font-size: .92rem; padding: 6px 8px; border-radius: 7px; cursor: pointer }
.apps label:hover { background: var(--accent-soft) }
.apps input { accent-color: var(--accent); width: 16px; height: 16px }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 13px 26px; font-weight: 600; font-size: 1rem }
.go:disabled { opacity: .45; cursor: not-allowed }
.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px }
.ghost:hover { border-color: var(--accent) }
.time { color: var(--muted); font-size: .9rem }

.live { display: grid; grid-template-rows: auto 1fr; min-height: 0; padding: 16px 32px 20px; gap: 12px }
.progress { display: grid; gap: 8px }
.progress-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .92rem }
.progress-top b { font-weight: 600 }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s }
.log { overflow-y: auto; min-height: 0; font-size: .9rem; display: grid; align-content: start; gap: 2px; padding-right: 6px }
.log .empty { color: var(--muted) }
.log div { display: grid; grid-template-columns: 22px 1fr; gap: 6px }
.log .tool { font: 700 1.05rem/1.3 var(--display); margin-top: 12px; grid-template-columns: 1fr }
.log .step { font-weight: 600; margin-top: 8px; grid-template-columns: 1fr }
.log .ok::before { content: "✓"; color: var(--ok); font-weight: 700 }
.log .bad::before { content: "!"; color: var(--bad); font-weight: 700; text-align: center }
.log .bad { color: var(--bad) }
.log .skip::before { content: "–"; color: var(--skip); text-align: center }
.log .info { color: var(--muted) }
.log .info::before { content: "" }
.done { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft) }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none } }
</style>
</head>
<body>
<aside>
  <div class="brand"><b>BoitePC</b><span>Entretien de Windows 11</span></div>
  <nav id="nav" aria-label="Outils"></nav>
  <div class="pc" id="pc">Lecture du PC…</div>
</aside>

<main>
  <section class="panel" id="panel" aria-live="polite"></section>
  <section class="live">
    <div class="progress" id="progress" hidden>
      <div class="progress-top"><span id="p-step">—</span><span id="p-count"></span></div>
      <div class="bar"><i id="p-bar"></i></div>
    </div>
    <div class="log" id="log"><p class="empty">Choisissez un outil à gauche, puis cliquez sur le bouton bleu. Le détail de chaque action s'affichera ici.</p></div>
  </section>
</main>

<script>
const token = new URLSearchParams(location.search).get('t');
async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Token': token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

const TOOLS = [
  { id: 'complet', name: 'Entretien complet', sub: 'Les 5 outils d\'un coup', time: '45 min à 1 h 30',
    lead: 'Lance les cinq outils à la suite avec les réglages recommandés. Vous n\'avez rien à faire : laissez le PC branché, vous pouvez continuer à l\'utiliser pour des choses simples.',
    does: ['Point de restauration « Avant BoitePC » (pour revenir en arrière)', 'AllegePC → MajPC → ReparePC → BouclierPC → TurboPC', 'Un résumé, puis un bouton pour redémarrer'],
    button: 'Lancer l\'entretien complet' },
  { id: 'turbo', name: 'TurboPC', sub: 'Accélérer Windows', time: 'environ 5 min',
    lead: 'Règle Windows pour qu\'il réagisse tout de suite à chaque clic, en coupant ce qui tourne pour rien.',
    does: ['Mode Hautes performances : le processeur ne ralentit plus sur secteur', 'Animations, transparence et ombres coupées', 'Applis en arrière-plan, Game DVR, pubs et télémétrie arrêtés', 'Fichiers temporaires supprimés, SSD optimisé'],
    options: [
      { key: 'indexation', def: true, label: 'Couper l\'indexation de la recherche', help: 'Elle scanne vos fichiers en continu, très lourd pour un Celeron. La recherche marche toujours.' },
      { key: 'nettoyageAuto', def: true, label: 'Nettoyer automatiquement chaque dimanche', help: 'Une tâche invisible supprime les fichiers temporaires une fois par semaine.' } ],
    button: 'Accélérer mon PC', after: 'startup' },
  { id: 'bouclier', name: 'BouclierPC', sub: 'Sécurité et antivirus', time: '10 à 20 min',
    lead: 'Renforce les protections déjà intégrées à Windows, puis donne un score de sécurité.',
    does: ['Defender bloque les logiciels indésirables et les sites piégés', 'Pare-feu, SmartScreen et contrôle de compte au bon niveau', 'Clés USB sans exécution automatique, extensions de fichiers visibles', 'Assistance à distance fermée contre les arnaques au faux support'],
    options: [
      { key: 'scanRapide', def: true, label: 'Analyse antivirus rapide', help: '5 à 15 minutes, vous pouvez utiliser le PC pendant ce temps.' },
      { key: 'dossiersProteges', def: false, label: 'Protection anti-rançongiciel (dossiers protégés)', help: 'Empêche un virus de chiffrer Documents, Images et Bureau. Peut bloquer certains logiciels qui y enregistrent (Windows prévient).' } ],
    button: 'Sécuriser mon PC',
    extra: [{ tool: 'audit', label: 'Bilan seulement (ne change rien)' }, { tool: 'scan-full', label: 'Analyse complète (30 min à 2 h)' }] },
  { id: 'maj', name: 'MajPC', sub: 'Tout mettre à jour', time: '10 à 40 min',
    lead: 'Installe toutes les mises à jour d\'un coup, sans passer par chaque menu.',
    does: ['Windows Update et pilotes', 'Toutes les applis : Chrome, Firefox, VLC, Zoom, 7-Zip…', 'Définitions de l\'antivirus'],
    options: [{ key: 'majAuto', def: true, label: 'Mettre à jour les applis automatiquement chaque mercredi', help: 'Si le PC est éteint ce jour-là, c\'est rattrapé au prochain allumage.' }],
    button: 'Tout mettre à jour' },
  { id: 'repare', name: 'ReparePC', sub: 'Diagnostic et réparation', time: '20 à 45 min',
    lead: 'Vérifie la santé du PC et répare les fichiers de Windows abîmés, cause classique des bugs et des plantages.',
    does: ['État du SSD, place libre, usure de la batterie, plantages récents', 'Réparation de Windows (DISM puis SFC)', 'Vérification du disque', 'Rapport batterie enregistré sur le Bureau'],
    options: [{ key: 'reseau', def: false, label: 'Réparer aussi Internet et le Wi-Fi', help: 'Seulement si vous avez des coupures. La connexion saute quelques secondes.' }],
    button: 'Réparer mon PC',
    extra: [{ tool: 'diagnostic', label: 'Diagnostic seulement (2 min)' }, { tool: 'network', label: 'Réparer Internet seulement' }] },
  { id: 'allege', name: 'AllegePC', sub: 'Supprimer l\'inutile', time: 'environ 5 min',
    lead: 'Retire les applis préinstallées que vous n\'utilisez pas et libère de la place. Tout se réinstalle depuis le Microsoft Store.',
    does: ['Applis cochées ci-dessous supprimées', 'Recherche Bing et recommandations retirées du menu Démarrer', 'Corbeille et fichiers temporaires vidés'],
    options: [
      { key: 'onedrive', def: false, label: 'Empêcher OneDrive de démarrer avec Windows', help: 'Seulement si vous ne l\'utilisez pas. Rien n\'est supprimé.' },
      { key: 'hibernation', def: false, label: 'Supprimer le fichier de veille prolongée', help: 'Libère 2 à 5 Go, mais l\'allumage devient un peu plus long.' } ],
    apps: true, button: 'Alléger mon PC' },
];
const NAV_ORDER = ['complet', 'sep', 'turbo', 'bouclier', 'maj', 'repare', 'allege', 'sep', 'undo'];
TOOLS.push({ id: 'undo', name: 'Tout annuler', sub: 'Remettre comme avant', time: '1 min',
  lead: 'Remet tous les réglages modifiés par BoitePC tels qu\'ils étaient, et supprime les tâches automatiques. Les applis supprimées se réinstallent depuis le Microsoft Store.',
  does: ['Registre, services et mode d\'alimentation rétablis', 'Tâches du dimanche et du mercredi supprimées'], button: 'Tout remettre comme avant' });

let current = 'complet', running = false, since = 0, lastTool = '', apps = null;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

function renderNav() {
  const nav = document.getElementById('nav'); nav.replaceChildren();
  for (const id of NAV_ORDER) {
    if (id === 'sep') { nav.append(el('div', { class: 'sep' })); continue; }
    const t = TOOLS.find(x => x.id === id);
    nav.append(el('button', { type: 'button', id: 'nav-' + id, 'aria-current': String(id === current), onclick: () => { current = id; renderNav(); renderPanel(); } },
      el('span', {}, t.name), el('small', {}, t.sub)));
  }
}

function renderPanel() {
  const t = TOOLS.find(x => x.id === current);
  const p = document.getElementById('panel'); p.replaceChildren();
  p.append(el('h1', {}, t.name), el('p', { class: 'lead' }, t.lead));
  p.append(el('ul', { class: 'does' }, ...t.does.map(d => el('li', {}, d))));
  if (t.options) {
    const box = el('div', { class: 'opts' }, el('h2', {}, 'Options'));
    for (const o of t.options) {
      box.append(el('label', { class: 'opt' }, el('input', Object.assign({ type: 'checkbox', id: 'o-' + o.key }, o.def ? { checked: '' } : {})),
        el('span', {}, o.label, el('small', {}, o.help))));
    }
    p.append(box);
  }
  if (t.apps) {
    const box = el('div', { class: 'apps' }, el('h2', {}, 'Applis trouvées sur ce PC (décochez celles à garder)'));
    const list = el('div', { class: 'list' });
    if (!apps) list.append('Recherche des applis…');
    else if (!apps.length) list.append('Aucune appli inutile trouvée : votre PC est déjà propre.');
    else for (const a of apps) list.append(el('label', {}, el('input', Object.assign({ type: 'checkbox', class: 'app', value: a.id, id: 'a-' + a.id.replace(/\W/g, '') }, a.checked ? { checked: '' } : {})), a.label));
    box.append(list); p.append(box);
  }
  const go = el('button', { class: 'go', type: 'button', id: 'go', onclick: () => start(t.id) }, t.button);
  go.disabled = running;
  const actions = el('div', { class: 'actions' }, go);
  for (const x of t.extra || []) {
    const b = el('button', { class: 'ghost', type: 'button', onclick: () => start(x.tool) }, x.label);
    b.disabled = running; actions.append(b);
  }
  actions.append(el('span', { class: 'time' }, 'Durée : ' + t.time));
  p.append(actions);
}

async function start(tool) {
  if (running) return;
  const options = {};
  document.querySelectorAll('.opts input').forEach(i => options[i.id.slice(2)] = i.checked);
  const body = { tool, options };
  if (tool === 'allege') body.apps = [...document.querySelectorAll('input.app:checked')].map(i => i.value);
  try {
    await api('/api/run', body);
    since = 0; lastTool = tool;
    document.getElementById('log').replaceChildren();
    running = true; renderPanel(); poll();
  } catch (e) { alertLine('Impossible de lancer : ' + e.message); }
}

function alertLine(text) {
  document.getElementById('log').append(el('div', { class: 'bad' }, el('span', {}, text)));
}

function fmt(s) { const m = Math.floor(s / 60); return m ? m + ' min ' + String(s % 60).padStart(2, '0') + ' s' : s + ' s'; }

let timer = null;
async function poll() {
  clearTimeout(timer);
  try {
    const st = await api('/api/status?since=' + since);
    const log = document.getElementById('log');
    for (const l of st.lines) {
      log.querySelector('.empty')?.remove();
      log.append(el('div', { class: l.kind }, el('span', {}, l.text)));
      since = l.n + 1;
      log.scrollTop = log.scrollHeight;
    }
    const prog = document.getElementById('progress');
    if (st.running && !running) { running = true; renderPanel(); }
    if (st.running) {
      prog.hidden = false;
      document.getElementById('p-step').replaceChildren(el('b', {}, st.step || 'Préparation…'), ' · ' + fmt(st.stepSeconds || 0));
      document.getElementById('p-count').textContent = 'Étape ' + st.stepIndex + ' sur ' + st.stepCount;
      document.getElementById('p-bar').style.width = (100 * Math.max(0, st.stepIndex - 1) / Math.max(1, st.stepCount)) + '%';
    } else if (running) {
      running = false; renderPanel();
      document.getElementById('p-bar').style.width = '100%';
      document.getElementById('p-step').replaceChildren(el('b', {}, 'Terminé'));
      document.getElementById('p-count').textContent = '';
      finished(st);
      loadInfo();
      if (lastTool === 'allege' || lastTool === 'complet') loadApps();
    }
  } catch (e) { /* l'appli redémarre ou se ferme */ }
  timer = setTimeout(poll, running ? 1000 : 4000);
}

function finished(st) {
  const box = el('div', { class: 'done' });
  box.append(el('span', {}, st.reboot || ['complet', 'turbo', 'bouclier', 'undo'].includes(lastTool)
    ? 'Terminé. Redémarrez le PC pour que tout prenne effet.' : 'Terminé.'));
  box.append(el('button', { class: 'go', type: 'button', onclick: () => api('/api/action', { name: 'reboot' }).then(() => box.replaceChildren('Redémarrage dans 10 secondes…')) }, 'Redémarrer maintenant'));
  if (lastTool === 'turbo' || lastTool === 'complet') {
    box.append(el('button', { class: 'ghost', type: 'button', onclick: () => api('/api/action', { name: 'startup' }) }, 'Voir les applis lancées au démarrage'));
  }
  document.getElementById('log').append(box);
  box.scrollIntoView({ block: 'end' });
}

async function loadInfo() {
  try {
    const i = await api('/api/info');
    document.getElementById('pc').replaceChildren(
      el('b', {}, i.os || 'Windows'), el('span', {}, i.cpu),
      el('span', {}, 'Mémoire : ' + i.memFree + ' Go libres sur ' + i.memTotal + ' Go'),
      el('span', {}, 'Disque : ' + i.diskFree + ' Go libres sur ' + i.diskTotal + ' Go'));
  } catch (e) {}
}
async function loadApps() {
  try { apps = await api('/api/apps'); } catch (e) { apps = []; }
  if (current === 'allege' && !running) renderPanel();
}

renderNav(); renderPanel(); loadInfo(); loadApps(); poll();
</script>
</body>
</html>

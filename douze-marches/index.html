<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Douze Marches</title>
<meta name="description" content="Le chemin des Douze Étapes au quotidien.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F1F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Douze Marches">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Shippori+Mincho:wght@500;700&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout : coque d’application centrée (46rem), identique à Kintsugi — en-tête collant + onglets défilants ;
   contenus en liste éditoriale séparée par des filets ; l’or est réservé aux « coutures » (progrès, jalons, sobriété). */
:root{
  --bg:#F1F3F0; --surface:#FAFBF9; --surface-2:#E6ECE8; --ink:#1C2320; --ink-2:#4A5651; --ink-3:#6F7A75; --line:#D3DBD6;
  --gold-ink:#86600F; --gold-a:#F2D47E; --gold-b:#C1902F; --gold-c:#8E6418;
  --warn:#8F5600; --ok:#2F6B4F; --glaze-s:34%; --glaze-l:43%; --glaze-soft:88%;
  --scrim:rgba(18,24,21,.42); --shadow:0 12px 32px rgba(28,35,32,.12);
  --crack:color-mix(in srgb,var(--ink) 30%,transparent);
  --font-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",ui-serif,Georgia,serif;
  --font-quote:"Newsreader",ui-serif,"New York",Georgia,"Times New Roman",serif;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --qsize:1.2rem; --gutter-l:max(16px, env(safe-area-inset-left, 0px)); --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14100D; --surface:#1C1713; --surface-2:#27201A; --ink:#F0E8DB; --ink-2:#C4B8A7; --ink-3:#958A7B; --line:#382F27;
    --gold-ink:#E7BF66; --gold-a:#F7DE90; --gold-b:#D6A645; --gold-c:#A77A27;
    --warn:#F0B35A; --ok:#7FC8A2; --glaze-s:38%; --glaze-l:66%; --glaze-soft:22%;
    --scrim:rgba(0,0,0,.62); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14100D; --surface:#1C1713; --surface-2:#27201A; --ink:#F0E8DB; --ink-2:#C4B8A7; --ink-3:#958A7B; --line:#382F27;
  --gold-ink:#E7BF66; --gold-a:#F7DE90; --gold-b:#D6A645; --gold-c:#A77A27;
  --warn:#F0B35A; --ok:#7FC8A2; --glaze-s:38%; --glaze-l:66%; --glaze-soft:22%;
  --scrim:rgba(0,0,0,.62); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
}
:root[data-size="s"]{--qsize:1.08rem}
:root[data-size="l"]{--qsize:1.38rem}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:7.5rem}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-b);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gold-defs{position:absolute;width:0;height:0;overflow:hidden}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:46rem;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:.55rem .1rem;display:flex;align-items:center;gap:.5rem}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0;flex:1;text-align:left}
.brand-mark{width:30px;height:30px;flex:none}
.brand-name{font:700 1.32rem/1 var(--font-display);letter-spacing:.02em;white-space:nowrap}
.brand-txt{min-width:0}
.brand-sub{display:block;font:500 .7rem/1.2 var(--font-ui);color:var(--ink-3);letter-spacing:.04em;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:999px;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:21px;height:21px}
.tabs{max-width:46rem;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;gap:.1rem;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;display:flex;align-items:center;gap:.4rem;padding:.65rem .7rem .7rem;font:500 .88rem/1 var(--font-ui);color:var(--ink-3);white-space:nowrap}
.tab .dot{width:7px;height:7px;border-radius:50%;background:hsl(var(--h) var(--glaze-s) var(--glaze-l))}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:.55rem;right:.55rem;bottom:0;height:2.5px;border-radius:2px;background:linear-gradient(90deg,var(--gold-c),var(--gold-a) 45%,var(--gold-b))}
.tab .count{font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* Coque */
.shell{max-width:46rem;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:0 7rem}
.view{animation:rise .35s ease-out}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font:700 .7rem/1.2 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);margin:0}
h2.sec{font:700 1.28rem/1.25 var(--font-display);margin:2.6rem 0 .3rem;text-wrap:balance}
h3.sub{font:700 1.02rem/1.3 var(--font-display);margin:1.6rem 0 .3rem}
.sec-lead{margin:0 0 1rem;color:var(--ink-3);font-size:.92rem;max-width:62ch}
.prose p{max-width:64ch;color:var(--ink-2);line-height:1.64;margin:.45rem 0}
.prose p.lead{font-size:1.04rem;color:var(--ink)}
.fine{font-size:.8rem;color:var(--ink-3);line-height:1.5;margin:.5rem 0 0}

/* Héros */
.hero{margin-top:1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.hero-seam{display:block;width:100%;height:64px}
.hero-body{padding:0 1.25rem 1.2rem}
.hero .q{border:0;padding-top:.4rem}
.install{margin-top:1rem;display:flex;gap:.75rem;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:.8rem .9rem;font-size:.88rem;color:var(--ink-2)}
.install p{margin:0;flex:1}

/* Compteur de sobriété */
.count{display:flex;align-items:baseline;gap:.55rem;margin:.5rem 0 0}
.count-n{font:700 clamp(3.4rem,15vw,4.8rem)/.95 var(--font-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--gold-c),var(--gold-b) 40%,var(--gold-ink));-webkit-background-clip:text;background-clip:text;color:transparent}
.count-u{font:700 1.3rem/1 var(--font-display);color:var(--ink)}
.count-sub{margin:.45rem 0 0;color:var(--ink-2);font-size:.95rem;font-variant-numeric:tabular-nums}
.next{margin-top:1rem}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold-c),var(--gold-a) 60%,var(--gold-b))}
.next p{margin:.45rem 0 0;font-size:.86rem;color:var(--ink-3)}
.next b{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin-top:1rem}
.stat{background:var(--surface-2);border-radius:14px;padding:.7rem .75rem;min-width:0}
.stat b{display:block;font:700 1.15rem/1.15 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{display:block;font-size:.74rem;color:var(--ink-3);margin-top:.15rem;line-height:1.25}
.engage{margin-top:1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.engage p{margin:0;flex:1 1 12rem;font-size:.88rem;color:var(--ink-2)}
.done-pill{display:inline-flex;align-items:center;gap:.45rem;border-radius:999px;padding:.6rem .95rem;font:600 .86rem/1 var(--font-ui);background:color-mix(in srgb,var(--gold-b) 16%,transparent);color:var(--gold-ink)}
.done-pill svg{width:16px;height:16px}
.welcome{font:700 clamp(1.5rem,6vw,2rem)/1.15 var(--font-display);margin:.45rem 0 .4rem;text-wrap:balance}

/* Formulaires */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.7rem;margin-top:.9rem}
.field{display:flex;flex-direction:column;gap:.35rem;min-width:0}
.field-l{font:600 .84rem/1.35 var(--font-ui);color:var(--ink)}
.field-h{font-size:.78rem;color:var(--ink-3);line-height:1.4;margin-top:-.15rem}
.inp,.field input,.field textarea,.field select{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.65rem .75rem;font:400 .98rem/1.45 var(--font-ui);color:var(--ink);outline:none;transition:border-color .15s ease}
.field textarea{resize:vertical;min-height:4.2rem}
.inp:focus,.field input:focus,.field textarea:focus{border-color:var(--gold-b)}
.field input[type="range"]{padding:0;border:0;background:none;accent-color:var(--gold-b);height:28px}
.hero .field input,.hero .field textarea{background:var(--bg)}
.saved{font:600 .72rem/1 var(--font-ui);color:var(--ink-3);letter-spacing:.04em;min-height:1em}
.saved.on{color:var(--ok)}
.range-row{display:flex;align-items:center;gap:.8rem}
.range-row input{flex:1}
.range-v{font:700 1.4rem/1 var(--font-ui);font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}

/* Tuiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.7rem}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.85rem .85rem .9rem;min-width:0;transition:transform .15s ease,border-color .15s ease}
.tile:hover{border-color:hsl(var(--h) var(--glaze-s) var(--glaze-l));transform:translateY(-1px)}
.tile .bowl{width:42px;height:42px;margin-bottom:.4rem}
.tile-k{font:700 .66rem/1.2 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tile-name{font:700 .98rem/1.2 var(--font-display);text-wrap:balance}
.tile-tag{font-size:.78rem;line-height:1.35;color:var(--ink-3)}
.tile-n{margin-top:.35rem;font:600 .72rem/1 var(--font-ui);letter-spacing:.04em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tile-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin-bottom:.4rem;background:color-mix(in srgb,hsl(var(--h) var(--glaze-s) var(--glaze-l)) 18%,transparent);color:hsl(var(--h) var(--glaze-s) var(--glaze-l))}
.tile-ico svg{width:21px;height:21px}
.st-pill{display:inline-flex;align-items:center;gap:.3rem;margin-top:.45rem;font:600 .68rem/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:.3rem .5rem;border:1px solid var(--line);color:var(--ink-3)}
.st-pill.on{border-color:color-mix(in srgb,var(--gold-b) 55%,transparent);color:var(--gold-ink)}
.st-pill.done{background:linear-gradient(90deg,var(--gold-c),var(--gold-b));border-color:transparent;color:#fff}

/* Bol (emblème) */
.bowl-body{fill:hsl(var(--h) var(--glaze-s) var(--glaze-l))}
.bowl-rim{fill:none;stroke:color-mix(in srgb,var(--ink) 18%,transparent);stroke-width:1}
.seam{fill:none;stroke:url(#kgold);stroke-linecap:round;stroke-linejoin:round}
.seam-faint{fill:none;stroke:color-mix(in srgb,#000 38%,transparent);stroke-linecap:round;stroke-linejoin:round}
.crack{fill:none;stroke:var(--crack);stroke-linecap:round;stroke-linejoin:round}

/* Actions du jour */
.today-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13.5rem,1fr));gap:.7rem}
.act-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .8rem;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.85rem .9rem;min-width:0}
.act-card:hover{border-color:hsl(var(--h) var(--glaze-s) var(--glaze-l))}
.act-card .tile-ico{grid-row:1/3;margin:0}
.act-t{font:700 .98rem/1.25 var(--font-display)}
.act-s{font-size:.8rem;color:var(--ink-3);line-height:1.35}
.act-card.is-done .act-s{color:var(--gold-ink);font-weight:600}

/* Jalons : le bol se répare */
.mend{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:1.2rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.1rem}
.mend-bowl{width:100%;max-width:13rem;aspect-ratio:1;margin:0 auto}
.ms{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3rem .8rem}
.ms li{display:flex;align-items:center;gap:.45rem;font-size:.84rem;color:var(--ink-3);min-width:0}
.ms li i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--crack);flex:none}
.ms li.on{color:var(--ink)}
.ms li.on i{border:0;background:linear-gradient(135deg,var(--gold-a),var(--gold-b))}
.ms li.next{color:var(--gold-ink);font-weight:600}
.ms li span{min-width:0;line-height:1.3}
.ms li{min-height:1.6rem}
.mend p{margin:.6rem 0 0;font-size:.86rem;color:var(--ink-2);line-height:1.5}

/* Prière / encart citation */
.prayer{margin-top:1rem;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.15rem}
.prayer p.pr{margin:.4rem 0 0;font:400 calc(var(--qsize) + .02rem)/1.5 var(--font-quote);color:var(--ink);text-wrap:pretty}
.prayer .fine{margin-top:.7rem}

/* En-tête de vue */
.cat-head{margin-top:1.6rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:start}
.cat-head .bowl{width:68px;height:68px}
.cat-head h1{font:700 clamp(1.6rem,6.4vw,2.25rem)/1.12 var(--font-display);margin:.1rem 0 .3rem;text-wrap:balance}
.cat-tag{color:var(--ink-3);font-size:.9rem;margin:0}
.cat-intro{grid-column:1/-1;margin:.2rem 0 0;color:var(--ink-2);font-size:1rem;line-height:1.62;max-width:64ch}
.cat-stats{grid-column:1/-1;margin:0;font:600 .75rem/1.2 var(--font-ui);letter-spacing:.05em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.help-strip{margin-top:1.1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;background:var(--surface-2);border-radius:14px;padding:.75rem .9rem;font-size:.86rem;color:var(--ink-2)}
.help-strip p{margin:0;flex:1 1 14rem;min-width:0}
.help-strip strong{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.link-btn{font:600 .84rem/1 var(--font-ui);color:var(--gold-ink);padding:.45rem .1rem;white-space:nowrap}

/* Progression des étapes */
.prog{margin-top:1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem}
.prog-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-top:.6rem}
.prog-row span{height:10px;border-radius:3px;background:var(--surface-2)}
.prog-row span.on{background:color-mix(in srgb,hsl(var(--h) var(--glaze-s) var(--glaze-l)) 55%,var(--surface-2))}
.prog-row span.done{background:linear-gradient(135deg,var(--gold-a),var(--gold-b))}
.prog p{margin:0;font-size:.86rem;color:var(--ink-2)}
.prog p b{font-variant-numeric:tabular-nums;color:var(--ink)}

/* Étape */
.step-text{margin:1.2rem 0 0;font:400 calc(var(--qsize) + .12rem)/1.45 var(--font-quote);color:var(--ink);text-wrap:pretty;padding-left:1rem;border-left:3px solid hsl(var(--h) var(--glaze-s) var(--glaze-l))}
.plain{margin-top:1rem;background:var(--surface-2);border-radius:14px;padding:.8rem .95rem}
.plain p{margin:0;font-weight:500;color:var(--ink);line-height:1.5}
.status-row{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.status-row .seg{flex:1 1 18rem;max-width:26rem}
.myths{list-style:none;padding:0;margin:.6rem 0 0;display:grid;gap:.5rem}
.myths li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.6rem;align-items:start;font-size:.95rem;color:var(--ink-2);line-height:1.55}
.myths li::before{content:"";width:14px;height:2px;margin-top:.7rem;background:hsl(var(--h) var(--glaze-s) var(--glaze-l));border-radius:2px}
.qs{margin:.6rem 0 0;padding:0;list-style:none;counter-reset:q;display:grid;gap:.55rem}
.qs li{counter-increment:q;display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:.4rem;color:var(--ink-2);line-height:1.55}
.qs li::before{content:counter(q);font:700 .95rem/1.55 var(--font-display);color:var(--gold-ink)}
.signs{list-style:none;padding:0;margin:.6rem 0 0;display:grid;gap:.45rem}
.signs li{display:grid;grid-template-columns:1.2rem minmax(0,1fr);gap:.5rem;color:var(--ink-2);line-height:1.5}
.signs li::before{content:"";width:9px;height:9px;margin-top:.45rem;border-radius:50%;background:linear-gradient(135deg,var(--gold-a),var(--gold-b))}
.time-note{margin-top:1.2rem;font-size:.9rem;color:var(--ink-2);background:var(--surface-2);border-radius:14px;padding:.75rem .9rem;line-height:1.5}
.step-nav{margin-top:2.4rem;display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.step-nav button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.75rem .85rem;min-width:0}
.step-nav button:last-child{text-align:right}
.step-nav small{display:block;font:600 .68rem/1.2 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.step-nav span{display:block;font:700 .95rem/1.3 var(--font-display);margin-top:.2rem}

/* Exercices */
.exs{display:grid;gap:.7rem;margin-top:.8rem}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ex-h{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .8rem;align-items:center;text-align:left;padding:.85rem 1rem}
.ex-t{font:700 1rem/1.3 var(--font-display)}
.ex-m{font:600 .72rem/1.2 var(--font-ui);letter-spacing:.05em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ex-m .gold{color:var(--gold-ink)}
.ex-h svg{width:18px;height:18px;color:var(--ink-3);grid-row:1/3;grid-column:2;transition:transform .2s ease}
.ex-h[aria-expanded="true"] svg{transform:rotate(180deg)}
.ex-b{padding:0 1rem 1rem;display:grid;gap:.85rem}
.ex-b .rule{display:block;width:calc(100% + 2rem);height:16px;margin:0 -1rem -.2rem}
.ex-i{margin:0;color:var(--ink-2);line-height:1.6;font-size:.95rem;max-width:66ch}

/* Lignes d’outils (inventaire, réparations…) */
.rows{display:grid;gap:.6rem}
.rowc{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:.8rem .85rem;display:grid;gap:.6rem}
.rowc-h{display:flex;align-items:center;gap:.5rem}
.rowc-h b{flex:1;font:700 .8rem/1.2 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.rowc-h .link-btn{color:var(--ink-3)}
.rowc-h .link-btn[data-confirm="1"]{color:var(--warn)}
.chips{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:.42rem .75rem;font:500 .8rem/1 var(--font-ui);color:var(--ink-2);background:transparent;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{opacity:.65;margin-left:.25rem}
.chip.add{border-style:dashed}
a.chip{text-decoration:none;color:var(--ink-2)}
.dom{display:grid;gap:.45rem;padding-block:.65rem;border-top:1px solid var(--line)}
.dom:first-child{border-top:0;padding-top:0}
.dom-h{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem}
.dom-h b{flex:1 1 9rem;font-weight:600;font-size:.92rem}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border-radius:999px;padding:.55rem .6rem;font:600 .82rem/1 var(--font-ui);color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{padding:.45rem .5rem;font-size:.76rem}
.seg.wrap{flex-wrap:wrap;border-radius:16px}
.summary{font:600 .8rem/1.4 var(--font-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink);border-radius:14px;padding:.75rem .9rem;font-size:.88rem;line-height:1.5}
.warnbox b{color:var(--warn)}

/* Citation (identique Kintsugi) */
.list{margin-top:.6rem}
.q{padding-block:1.35rem 1.1rem;border-top:1px solid var(--line)}
.list > .q:first-child{border-top:0}
.q-cat{display:inline-flex;align-items:center;gap:.4rem;font:600 .72rem/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.65rem;padding:.2rem 0}
.q-cat .dot{width:7px;height:7px;border-radius:50%;background:hsl(var(--h) var(--glaze-s) var(--glaze-l))}
.q-text{margin:0;font:400 var(--qsize)/1.46 var(--font-quote);font-optical-sizing:auto;color:var(--ink);text-wrap:pretty;hyphens:manual}
.q-text::before{content:"«\202F";color:var(--gold-b)}
.q-text::after{content:"\202F»";color:var(--gold-b)}
.hero .q-text{font-size:clamp(1.3rem,5vw,1.7rem);line-height:1.32}
.q-by{margin-top:.7rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.1rem .55rem}
.q-author{font:600 .92rem/1.3 var(--font-ui);color:var(--ink)}
.q-desc{font-size:.82rem;line-height:1.35;color:var(--ink-3)}
.q-meta{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.35rem}
.tag{font:600 .66rem/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:.3rem .5rem}
.tag-trad{border-style:dashed}
.q-actions{margin-top:.55rem;display:flex;align-items:center;gap:.1rem}
.q-actions .spacer{flex:1}
.q-open{display:inline-flex;align-items:center;gap:.3rem;font:600 .86rem/1 var(--font-ui);color:var(--gold-ink);padding:.6rem .15rem}
.q-open svg{width:15px;height:15px;transition:transform .2s ease}
.q-open[aria-expanded="true"] svg{transform:rotate(180deg)}
.q-actions .icon-btn{width:38px;height:38px;color:var(--ink-3)}
.q-actions .icon-btn svg{width:19px;height:19px}
.icon-btn[aria-pressed="true"]{color:var(--gold-b)}
.icon-btn[aria-pressed="true"] .heart{fill:currentColor}
.q-analysis{margin-top:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 1rem 1.05rem;overflow:hidden}
.hero .q-analysis{background:var(--bg)}
.q-analysis .rule{display:block;width:calc(100% + 2rem);height:18px;margin:0 -1rem .55rem}
.q-e{margin:0;font-size:.98rem;line-height:1.64;color:var(--ink-2);max-width:66ch}
.label{display:block;font:700 .66rem/1.2 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:.3rem}
.q-p{margin-top:1rem;padding-left:.85rem;border-left:2px solid hsl(var(--h) var(--glaze-s) var(--glaze-l))}
.q-p p{margin:0;font-weight:500;color:var(--ink);line-height:1.5}
.q-o,.q-s{margin:1rem 0 0;font-size:.88rem;line-height:1.5;color:var(--ink-3)}
.q-o span.txt{font:italic 400 1rem/1.5 var(--font-quote);color:var(--ink-2)}
.defi{margin-top:1rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.8rem;align-items:start;background:var(--surface-2);border-radius:14px;padding:.85rem .95rem}
.defi .tile-ico{width:34px;height:34px;margin:0}
.defi p{margin:0;font-weight:500;line-height:1.5}
.more{display:block;margin:1.2rem auto 0;border:1px solid var(--line);border-radius:999px;padding:.7rem 1.2rem;font:600 .86rem/1 var(--font-ui);color:var(--ink-2)}
.empty{margin:2.5rem 0;text-align:center;color:var(--ink-3)}
.empty .bowl{width:64px;height:64px;margin:0 auto 1rem;display:block}
.empty h3{font:700 1.15rem/1.3 var(--font-display);color:var(--ink);margin:0 0 .4rem}
.filters{margin-top:1.3rem;display:flex;flex-direction:column;gap:.55rem}
.row{display:flex;align-items:center;gap:.4rem}
.row .chips{flex:1 1 auto;min-width:0}
.result-n{font:600 .75rem/1 var(--font-ui);color:var(--ink-3);letter-spacing:.04em;font-variant-numeric:tabular-nums}

/* Accordéons (chapitres, FAQ) */
.acc{border-top:1px solid var(--line)}
.acc:last-child{border-bottom:1px solid var(--line)}
.acc-h{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.15rem .8rem;align-items:center;text-align:left;padding:.95rem 0}
.acc-h .num{font:700 .72rem/1.2 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);grid-column:2}
.acc-h .ttl{font:700 1.05rem/1.3 var(--font-display);grid-column:2}
.acc-h .ttl small{font:italic 400 .9rem/1.3 var(--font-quote);color:var(--ink-3);margin-left:.3rem}
.acc-h .mk{grid-row:1/3;grid-column:1;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--crack);display:grid;place-items:center}
.acc-h .mk.on{border:0;background:linear-gradient(135deg,var(--gold-a),var(--gold-b));color:#fff}
.acc-h .mk svg{width:13px;height:13px}
.acc-h > svg{grid-row:1/3;grid-column:3;width:18px;height:18px;color:var(--ink-3);transition:transform .2s ease}
.acc-h[aria-expanded="true"] > svg{transform:rotate(180deg)}
.acc-h.plain-h{grid-template-columns:minmax(0,1fr) auto}
.acc-h.plain-h .ttl{grid-column:1}
.acc-h.plain-h > svg{grid-column:2;grid-row:1}
.acc-b{padding:0 0 1.2rem 2.3rem;display:grid;gap:.7rem}
.acc-b.flush{padding-left:0}
.acc-b p{margin:0;color:var(--ink-2);line-height:1.62;max-width:64ch}
.keys{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.keys li{display:grid;grid-template-columns:1rem minmax(0,1fr);gap:.5rem;color:var(--ink-2);line-height:1.5;font-size:.95rem}
.keys li::before{content:"";width:6px;height:6px;margin-top:.55rem;border-radius:50%;background:var(--gold-b)}
.ask{font:italic 400 1.05rem/1.5 var(--font-quote);color:var(--ink);padding-left:.85rem;border-left:2px solid var(--gold-b)}
.mini-links{display:flex;flex-wrap:wrap;gap:.4rem}

/* Promesses, histoire, héritages */
.promises{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.1rem;counter-reset:p}
.promises li{counter-increment:p;display:grid;grid-template-columns:2.1rem minmax(0,1fr);gap:.4rem;padding-block:.55rem;border-top:1px solid var(--line);font:400 1.04rem/1.5 var(--font-quote);color:var(--ink)}
.promises li:first-child{border-top:0}
.promises li::before{content:counter(p);font:700 1rem/1.5 var(--font-display);color:var(--gold-ink)}
.tl{list-style:none;margin:.8rem 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:3.6rem;top:.4rem;bottom:.4rem;width:1.5px;background:linear-gradient(var(--gold-c),var(--gold-a),var(--gold-b))}
.tl li{display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:1.1rem;padding-block:.55rem}
.tl .y{font:700 .95rem/1.4 var(--font-display);color:var(--gold-ink);text-align:right;font-variant-numeric:tabular-nums}
.tl b{display:block;font-weight:600;font-size:.95rem}
.tl small{display:block;font-size:.76rem;color:var(--ink-3);letter-spacing:.03em}
.tl p{margin:.15rem 0 0;color:var(--ink-2);font-size:.92rem;line-height:1.55}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.7rem;margin-top:.8rem}
.leg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.9rem}
.leg .bowl{width:40px;height:40px}
.leg b{display:block;font:700 1.02rem/1.3 var(--font-display);margin-top:.4rem}
.leg p{margin:.25rem 0 0;font-size:.88rem;color:var(--ink-2);line-height:1.5}
.trads{list-style:none;padding:0;margin:.6rem 0 0}
.trads li{display:grid;grid-template-columns:2.1rem minmax(0,1fr);gap:.4rem;padding-block:.7rem;border-top:1px solid var(--line)}
.trads li:first-child{border-top:0}
.trads .n{font:700 1rem/1.4 var(--font-display);color:var(--gold-ink)}
.trads b{font-weight:600}
.trads p{margin:.2rem 0 0;color:var(--ink-2);font-size:.93rem;line-height:1.55}
.trads p.why{color:var(--ink-3);font-size:.86rem}
.steps-list{list-style:none;padding:0;margin:.6rem 0 0;display:grid;gap:.1rem}
.steps-list li{display:grid;grid-template-columns:2.1rem minmax(0,1fr);gap:.4rem;padding-block:.6rem;border-top:1px solid var(--line)}
.steps-list li:first-child{border-top:0}
.steps-list .n{font:700 1rem/1.4 var(--font-display);color:var(--gold-ink);font-variant-numeric:tabular-nums}
.steps-list b{font-weight:600}
.steps-list p{margin:.15rem 0 0;color:var(--ink-2);font-size:.93rem;line-height:1.55}
.gloss{display:grid;gap:0;margin-top:.6rem}
.gloss div{padding-block:.6rem;border-top:1px solid var(--line)}
.gloss div:first-child{border-top:0}
.gloss dt{font-weight:600}
.gloss dd{margin:.15rem 0 0;color:var(--ink-2);font-size:.92rem;line-height:1.55}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem}
.card + .card{margin-top:.7rem}
.card h3{font:700 1.02rem/1.3 var(--font-display);margin:0 0 .3rem}
.card p{margin:.3rem 0 0;color:var(--ink-2);line-height:1.55;font-size:.94rem}

/* Journal */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.9rem}
.cal-h{display:flex;align-items:center;gap:.4rem;margin-bottom:.6rem}
.cal-h b{flex:1;text-align:center;font:700 1.05rem/1.2 var(--font-display);text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-g .wd{font:600 .66rem/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding-bottom:.35rem}
.day{position:relative;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font:600 .82rem/1 var(--font-ui);color:var(--ink-3);font-variant-numeric:tabular-nums;background:transparent;max-width:100%}
.day.in{color:var(--ink-2);background:var(--surface-2)}
.day.sober{color:var(--ink);background:color-mix(in srgb,var(--gold-b) 20%,var(--surface))}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.future{opacity:.45;cursor:default}
.day .dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--gold-ink)}
.day .dots i.eng{background:var(--ink-2)}
.day.drank{background:var(--surface-2);color:var(--ink-3)}
.day.drank::after{content:"";position:absolute;left:22%;right:22%;top:50%;height:1.5px;background:var(--crack);transform:rotate(-24deg)}
.cal-l{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin-top:.7rem;font-size:.76rem;color:var(--ink-3)}
.cal-l span{display:inline-flex;align-items:center;gap:.35rem}
.cal-l i{width:12px;height:12px;border-radius:4px;background:color-mix(in srgb,var(--gold-b) 20%,var(--surface));border:1px solid var(--line)}
.cal-l i.dot{width:6px;height:6px;border-radius:50%;background:var(--gold-ink);border:0}
.cal-l i.eng{width:6px;height:6px;border-radius:50%;background:var(--ink-2);border:0}
.trend{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.9rem 1rem;margin-top:.7rem;position:relative}
.trend-h{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.trend-h b{font:700 .98rem/1.3 var(--font-display);flex:1}
.trend-h span{font:600 .78rem/1 var(--font-ui);color:var(--ink-3);font-variant-numeric:tabular-nums}
.spark{display:block;width:100%;height:110px;margin-top:.5rem;overflow:visible}
.spark .grid-l{stroke:var(--line);stroke-width:1}
.spark .ax{fill:var(--ink-3);font:500 10px var(--font-ui)}
.spark .ln{fill:none;stroke:var(--gold-b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:color-mix(in srgb,var(--gold-b) 16%,transparent)}
.spark .pt{fill:var(--gold-b);stroke:var(--surface);stroke-width:2}
.spark .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:.4rem .6rem;font:600 .76rem/1.3 var(--font-ui);white-space:nowrap;transform:translate(-50%,-110%);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.5rem;margin-top:.7rem}
.entries{margin-top:.6rem}
.entry{padding-block:1rem;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry-h{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.entry-h b{font:700 1rem/1.3 var(--font-display);text-transform:capitalize;flex:1}
.entry .tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem}
.entry p{margin:.45rem 0 0;color:var(--ink-2);font-size:.93rem;line-height:1.55;white-space:pre-wrap}
.entry .gr{font:italic 400 1rem/1.5 var(--font-quote);color:var(--ink)}

/* Outils (feuilles) */
.timer{display:grid;place-items:center;margin:1rem auto .4rem;width:min(15rem,70vw);aspect-ratio:1;position:relative}
.timer svg{position:absolute;inset:0;width:100%;height:100%}
.timer .trk{fill:none;stroke:var(--surface-2);stroke-width:6}
.timer .prg{fill:none;stroke:url(#kgold);stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.timer-c{text-align:center;position:relative}
.timer-c b{display:block;font:700 2.4rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.timer-c span{display:block;margin-top:.35rem;font:600 .8rem/1.2 var(--font-ui);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.breath{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gold-a) 55%,transparent),color-mix(in srgb,var(--gold-b) 22%,transparent) 70%);transform:scale(.62);transition:transform 5s ease-in-out}
.breath.in{transform:scale(1)}
.wave{display:block;width:100%;height:120px;margin-top:.4rem}
.cue{min-height:3.2em;text-align:center;font:400 1.08rem/1.5 var(--font-quote);color:var(--ink);margin:.6rem auto 0;max-width:34ch}
.sos-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem;margin-top:1rem}
.sos-btn{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.8rem .85rem;min-width:0}
.sos-btn .tile-ico{width:34px;height:34px;margin:0}
.sos-btn .tile-ico svg{width:18px;height:18px}
.sos-btn b{font:700 .95rem/1.25 var(--font-display)}
.sos-btn span{font-size:.76rem;color:var(--ink-3);line-height:1.35}
.reasons{white-space:pre-wrap;font:400 1.05rem/1.55 var(--font-quote);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;margin:0}
.audit-q{padding-block:.85rem;border-top:1px solid var(--line);display:grid;gap:.5rem}
.audit-q:first-of-type{border-top:0}
.audit-q b{font-weight:600;line-height:1.45;font-size:.95rem}
.audit-q b span{color:var(--gold-ink);margin-right:.35rem;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:.35rem}
.score{font:700 3rem/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.sort-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.7rem;margin-top:.8rem}
.sort-col{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.8rem .85rem;min-width:0}
.sort-col h4{margin:0 0 .5rem;font:700 .95rem/1.3 var(--font-display)}
.sort-col ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.sort-col li{display:grid;gap:.35rem;font-size:.92rem;color:var(--ink-2)}
.sort-col li .row{justify-content:space-between}

/* À propos */
.about p{max-width:64ch;color:var(--ink-2);line-height:1.62;margin:.4rem 0}
.disclaimer{margin-top:2rem;font-size:.82rem;color:var(--ink-3);line-height:1.55;max-width:64ch}

/* Bouton SOS */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:.5rem;background:var(--ink);color:var(--bg);border-radius:999px;padding:.85rem 1.1rem .85rem .95rem;font:600 .9rem/1 var(--font-ui);box-shadow:var(--shadow)}
.fab svg{width:20px;height:20px;color:var(--gold-a)}

/* Feuilles (modales) */
.backdrop{position:fixed;inset:0;z-index:50;background:var(--scrim);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:46rem;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:.6rem calc(1.5rem + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto .6rem}
.sheet-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.sheet-head h2{flex:1;margin:0;font:700 1.2rem/1.25 var(--font-display);text-wrap:balance}
.sheet .q{border:0;padding-top:.6rem}
.sheet-lead{margin:.2rem 0 0;color:var(--ink-2);font-size:.94rem;line-height:1.58}
.sheet .stack{display:grid;gap:.9rem;margin-top:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:999px;padding:.8rem 1.2rem;font:600 .9rem/1 var(--font-ui)}
.btn svg{width:17px;height:17px}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-line{border:1px solid var(--line);color:var(--ink-2)}
.btn-gold{background:linear-gradient(135deg,var(--gold-c),var(--gold-b));color:#fff}
.btn-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.lines{list-style:none;padding:0;margin:.8rem 0 0;display:grid;gap:.6rem}
.lines li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.8rem .9rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem .8rem;align-items:center}
.lines .who{font-weight:600;font-size:.92rem}
.lines .num{font:700 1.25rem/1.2 var(--font-ui);font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all;color:var(--ink)}
.lines .hrs{grid-column:1;font-size:.8rem;color:var(--ink-3)}
.lines .acts{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:.35rem}
.lines .acts a,.lines .acts button{font:600 .8rem/1 var(--font-ui);border-radius:999px;padding:.55rem .8rem;text-align:center;text-decoration:none}
.lines .acts a{background:var(--ink);color:var(--bg)}
.lines .acts button{border:1px solid var(--line);color:var(--ink-2)}
.lines li.mine{border-color:color-mix(in srgb,var(--gold-b) 50%,var(--line))}
.urgent{background:var(--surface-2);border-radius:14px;padding:.8rem .9rem;font-size:.9rem;color:var(--ink);margin-top:.8rem;line-height:1.5}
.set{margin-top:1.2rem}
.set > .label{margin-bottom:.5rem}
.set p{margin:.4rem 0 0;font-size:.86rem;color:var(--ink-3);line-height:1.5}
.sync{display:flex;align-items:center;gap:.5rem;font-size:.88rem;color:var(--ink-2)}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.sync.ok i{background:var(--ok)}
.sync.warn i{background:var(--warn)}

/* Recherche */
.search{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.search-bar{border-bottom:1px solid var(--line)}
.search-bar-in{max-width:46rem;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:.6rem;display:flex;gap:.5rem;align-items:center}
.search-field{flex:1;min-width:0;display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 .9rem}
.search-field svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.search-field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 1rem/1 var(--font-ui);padding:.75rem 0;outline:none}
.search-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.search-body .shell{padding-top:.8rem}
.hints{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.hit{display:block;width:100%;text-align:left;padding-block:.8rem;border-top:1px solid var(--line)}
.hit:first-child{border-top:0}
.hit b{display:block;font:700 1rem/1.3 var(--font-display)}
.hit span{display:block;font-size:.88rem;color:var(--ink-2);line-height:1.5;margin-top:.15rem}
.hit small{font:600 .68rem/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}

/* Essai et premium */
.trial{flex:none;display:inline-flex;align-items:center;border-radius:999px;padding:.45rem .7rem;font:600 .74rem/1 var(--font-ui);color:var(--gold-ink);background:color-mix(in srgb,var(--gold-b) 15%,transparent);white-space:nowrap;font-variant-numeric:tabular-nums}
.trial.end{background:linear-gradient(135deg,var(--gold-c),var(--gold-b));color:#fff}
.trial-strip{align-items:center}
.trial-strip .btn{flex:none;padding:.6rem .95rem}
.lock{margin-top:1.4rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.7rem .9rem;align-items:start;background:var(--surface);border:1px solid color-mix(in srgb,var(--gold-b) 45%,var(--line));border-radius:18px;padding:1.1rem}
.lock .tile-ico{margin:0}
.lock h3{margin:0;font:700 1.05rem/1.3 var(--font-display)}
.lock p{margin:.3rem 0 0;color:var(--ink-2);font-size:.92rem;line-height:1.5}
.lock .btn-row,.lock .fine{grid-column:1/-1}
.price{display:flex;align-items:baseline;gap:.7rem;margin-top:1rem}
.price b{font:700 2.8rem/1 var(--font-display);background:linear-gradient(135deg,var(--gold-c),var(--gold-b) 40%,var(--gold-ink));-webkit-background-clip:text;background-clip:text;color:transparent}
.price span{font-size:.86rem;color:var(--ink-3)}
.pp-box{margin-top:1.1rem;min-height:3rem;max-width:30rem}
.pay-steps{margin-top:0}
.alt-pay{margin-top:.8rem;max-width:30rem}
.alt-pay summary{cursor:pointer;font:600 .84rem/1.4 var(--font-ui);color:var(--gold-ink);padding:.4rem 0}
.alt-pay[open] summary{margin-bottom:.4rem}
.pay-steps a.btn{text-decoration:none}
.unlock-row{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
.unlock-row .inp{flex:1 1 12rem;min-width:0;font-variant-numeric:tabular-nums;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:26rem){
  .tp-l{display:none}
  .top-in .icon-btn{width:36px;height:36px}
  .brand-mark{width:26px;height:26px}
  .brand-name{font-size:1.1rem}
  .top-in{gap:.25rem}
}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);z-index:60;background:var(--ink);color:var(--bg);border-radius:999px;padding:.6rem 1rem;font:600 .84rem/1 var(--font-ui);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.draw-path{transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1)}
@media (max-width:30rem){
  .mend{grid-template-columns:1fr}
  .mend-bowl{max-width:11rem}
  .stats{gap:.4rem}
  .stat{padding:.6rem .6rem}
  .stat b{font-size:1rem}
  .acc-b{padding-left:0}
}
@media (min-width:44rem){
  .hero-body{padding:0 2rem 1.5rem}
  .q-analysis{padding:0 1.3rem 1.2rem}
  .q-analysis .rule{width:calc(100% + 2.6rem);margin:0 -1.3rem .6rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

  "intro": "La troisième étape est une décision, et rien de plus pour l’instant : ce sont les étapes 4 à 12 qui la mettent en pratique. Elle découle naturellement des deux premières : si ma volonté seule mène à l’impasse et qu’une aide plus grande est possible, je peux choisir de m’appuyer sur elle. Le Gros Livre situe la racine du problème dans l’égocentrisme : vouloir que tout et tout le monde se plie à son scénario, puis s’irriter ou boire quand la vie résiste. Confier sa volonté, ce n’est ni devenir passif ni renoncer à son jugement ; c’est changer de boussole, passer de « qu’est-ce que je veux tout de suite ? » à « quelle est la chose juste à faire ? ». En psychologie, on retrouve ce mouvement dans l’acceptation : cesser de lutter contre ce qui ne dépend pas de soi pour mettre son énergie dans ce qui en dépend. La décision se renouvelle chaque jour, et parfois chaque heure.",

  "plain": "Je regarde honnêtement, par écrit, mes rancunes, mes peurs et ma conduite, pour comprendre ce qui me poussait à boire et ce qui, en moi, me fait souffrir.",
  "intro": "Une fois la décision prise, il faut dégager ce qui bloque le chemin. L’inventaire ressemble à celui d’un commerce : on compte honnêtement ce qui est en rayon, le bon comme l’abîmé, pour savoir quoi garder et quoi écarter. Le Gros Livre désigne le ressentiment comme le premier ennemi de l’alcoolique : revivre sans cesse une blessure, ressentir à nouveau la colère, et chercher dans l’alcool un apaisement. La méthode en colonnes est d’une grande finesse psychologique. Elle part de la blessure telle qu’on la ressent, cherche ce qu’elle a menacé en nous (sécurité, estime de soi, relations), puis, seulement à la fin, la part que nous y avons prise. Ce dernier mouvement n’efface pas les torts subis ; il rend du pouvoir, car on ne peut changer que sa propre part. Si des traumatismes ou des violences apparaissent, l’inventaire n’en fait pas ta faute : parles-en à ton parrain ou à ta marraine, et à un ou une psychologue. Écrire, et pas seulement réfléchir, est essentiel : c’est l’écrit qui rend les schémas visibles.",

  "intro": "La neuvième étape est celle du courage en actes. Réparer ne se limite pas à s’excuser : c’est reconnaître précisément le tort, proposer de le corriger quand c’est possible (rembourser, rétablir la vérité, rendre du temps), puis changer durablement de conduite. Une excuse sans changement ressemble aux promesses de l’époque où l’on buvait ; c’est la constance qui donne son poids à la réparation. La démarche se fait sans attente de résultat : la personne peut accueillir, refuser, s’emporter ou ne pas répondre. Notre part est d’offrir la réparation, pas d’obtenir le pardon. La clause de prudence est essentielle : on ne révèle pas une infidélité pour soulager sa conscience aux dépens de l’autre, on ne se met pas en danger face à une personne violente, on n’engage pas sa famille sans réflexion. Dans le doute, on consulte son parrain ou sa marraine, voire un conseil juridique pour les dettes ou les questions de justice. Le Gros Livre associe cette étape aux célèbres Promesses : liberté, paix, disparition de la peur.",

  {id:"preface", n:"Ouverture", fr:"Préface et avant-propos", en:"Preface & Forewords", pages:"p. xi-xxiv",
   sum:"Les pages d’ouverture racontent la croissance de la fraternité d’une édition à l’autre. L’avant-propos de 1939 se présente ainsi, en traduction libre : « Nous, des Alcooliques anonymes, sommes plus de cent hommes et femmes qui se sont rétablis d’un état du corps et de l’esprit apparemment sans espoir. » Les avant-propos suivants (1955, 1976, 2001) décrivent l’extension mondiale du mouvement, l’arrivée de membres plus jeunes, de femmes et de personnes de tous horizons, puis l’apparition des Traditions. On y trouve déjà l’esprit des AA : l’anonymat, l’absence de cotisations, l’indépendance vis-à-vis de toute organisation.",
   keys:["Le livre est écrit au « nous » : c’est un témoignage collectif, pas la théorie d’un expert.","Le mot « rétablis » affirme qu’une sortie est possible, même d’un état jugé sans espoir.","Les éditions successives montrent que la méthode a traversé les époques, les pays et les profils."],
   ask:"Qu’est-ce qui te donne envie, ou au contraire te freine, à l’idée de rejoindre un « nous » ?", steps:[1,2]},
  {id:"doctor", n:"Avant le chapitre 1", fr:"L’opinion du médecin", en:"The Doctor’s Opinion", pages:"p. xxv-xxxii",
   sum:"Le Dr William D. Silkworth, médecin à l’hôpital Charles B. Towns de New York, a soigné des milliers d’alcooliques, dont Bill W. Il apporte la caution d’un médecin et une description clinique qui a marqué les AA : chez certaines personnes, l’alcool agit comme une « allergie », un premier verre déclenchant un besoin irrésistible d’en boire d’autres. Sans alcool, ces personnes se sentent agitées, irritables et mécontentes, et retournent boire pour retrouver un soulagement. Pour Silkworth, seul un changement psychique profond leur permet de se rétablir. Le mot « allergie » est une image de son époque : la médecine parle aujourd’hui de dépendance et de dérèglement des circuits de la récompense.",
   keys:["Deux mécanismes : l’envie impérieuse déclenchée par le premier verre, et l’obsession mentale qui y ramène.","« Agité, irritable et mécontent » : l’état qui précède souvent la rechute, même après des mois d’abstinence.","La volonté seule ne suffit pas ; il faut un changement profond, que le reste du livre décrit."],
   ask:"Te reconnais-tu dans l’agitation, l’irritabilité et le mécontentement quand tu ne bois pas ? Dans quelles situations précises ?", steps:[1]},
  {id:"ch1", n:"Chapitre 1", fr:"L’histoire de Bill", en:"Bill’s Story", pages:"p. 1-16",
   sum:"Bill W. raconte sa trajectoire : jeune officier pendant la Première Guerre mondiale, puis spéculateur ambitieux à Wall Street, il boit de plus en plus jusqu’à perdre son travail, sa santé et sa confiance. Malgré sa détermination et ses promesses à sa femme Lois, il rechute encore et encore, et le Dr Silkworth le juge perdu. En novembre 1934, un ancien camarade de collège, Ebby T., qui a cessé de boire grâce au Groupe d’Oxford, lui rend visite et lui parle d’une solution spirituelle. Quelques semaines plus tard, à l’hôpital Towns, Bill vit une expérience intense de libération. Il en tire une idée simple : aider d’autres alcooliques pour rester lui-même sobre.",
   keys:["La perte de contrôle progresse malgré l’intelligence, l’amour des proches et les bonnes résolutions.","La visite d’Ebby montre la force d’un alcoolique qui parle à un autre alcoolique.","Le rétablissement de Bill passe par l’honnêteté, l’abandon de l’orgueil et le service aux autres."],
   ask:"À quel moment de ton histoire as-tu, comme Bill, juré d’arrêter puis recommencé ? Qu’est-ce qui manquait alors ?", steps:[1,2,3,12]},
  {id:"ch2", n:"Chapitre 2", fr:"Il y a une solution", en:"There Is a Solution", pages:"p. 17-29",
   sum:"Les membres se décrivent comme les rescapés d’un naufrage, unis par un même danger traversé. Le chapitre distingue le buveur modéré, le gros buveur qui peut s’arrêter quand il a une bonne raison, et l’alcoolique véritable, qui perd le contrôle une fois qu’il a commencé et ne parvient pas à ne pas commencer. Le problème se situe d’abord dans l’esprit. Le chapitre évoque, sans le nommer, un homme d’affaires américain soigné par un célèbre psychiatre européen, en réalité Carl Jung, qui lui a dit que seule une expérience spirituelle profonde pouvait le sauver. La solution annoncée est là : un changement de l’intérieur, que les chapitres suivants détaillent.",
   keys:["Il existe plusieurs types de buveurs ; seul l’alcoolique perd le choix.","Le problème central est mental : l’obsession qui précède le premier verre.","Une expérience spirituelle, au sens large, a libéré ceux qui écrivent ce livre.","La fraternité naît d’un danger partagé, pas d’une morale commune."],
   ask:"D’après la description du chapitre, de quel type de buveur ton histoire se rapproche-t-elle le plus, en toute honnêteté ?", steps:[1,2]},
  {id:"ch3", n:"Chapitre 3", fr:"Encore à propos de l’alcoolisme", en:"More About Alcoholism", pages:"p. 30-43",
   sum:"Ce chapitre s’attaque à l’illusion la plus tenace : l’idée qu’un jour on pourra boire normalement. Les auteurs comparent l’alcoolique à une personne qui a perdu une jambe : elle ne repousse pas. Plusieurs récits illustrent la folie du premier verre, comme celui de Jim, vendeur de voitures qui reprend un whisky mélangé à du lait en pensant que ce mélange le protège, ou celui de Fred, comptable respecté qui rechute malgré sa lucidité. Le livre propose à qui doute encore de tenter un essai de consommation contrôlée ; la plupart d’entre nous l’avons déjà fait bien des fois, et notre passé suffit souvent comme réponse. Conclusion : à certains moments, l’alcoolique n’a aucune défense mentale efficace contre le premier verre.",
   keys:["L’illusion du contrôle est l’obsession commune à tous les alcooliques.","Une jambe perdue ne repousse pas : la perte de contrôle ne se répare pas avec le temps.","Le premier verre arrive souvent après une pensée absurde qui paraît raisonnable sur le moment.","La défense contre le premier verre doit venir d’une aide plus grande que soi."],
   ask:"Quelles stratégies de contrôle as-tu déjà essayées (bière seulement, pas avant 18 h, jamais seul) et combien de temps ont-elles tenu ?", steps:[1]},
  {id:"ch4", n:"Chapitre 4", fr:"Nous, les agnostiques", en:"We Agnostics", pages:"p. 44-57",
   sum:"Écrit pour celles et ceux qui ne croient pas, ce chapitre part d’un constat, en traduction libre : « Le manque de puissance, voilà notre dilemme. » Les auteurs, dont plusieurs avaient été athées ou agnostiques, expliquent qu’il suffit au départ d’être prêt à croire en une Puissance supérieure à soi, ou simplement de ne plus exclure qu’elle existe. Ils invitent à mettre de côté les préjugés sur la religion et à remarquer la confiance que l’on accorde chaque jour à des réalités que l’on ne comprend pas entièrement. Le chapitre reste marqué par la foi en Dieu de ses auteurs, mais il ouvre une porte : beaucoup de membres agnostiques choisissent le groupe, la nature ou leurs valeurs comme Puissance supérieure.",
   keys:["Le problème n’est pas un manque de volonté mais un manque de puissance.","Il suffit d’être prêt à croire, ou de ne plus exclure la possibilité d’une aide.","Les préjugés contre la religion ne doivent pas barrer l’accès au rétablissement.","Chacun définit sa Puissance supérieure ; le groupe peut en tenir lieu au début."],
   ask:"Qu’est-ce qui, dans ta vie, est déjà plus fort que toi et bienveillant à ton égard : une personne, un groupe, la nature, une valeur ?", steps:[2,3]},
  {id:"ch5", n:"Chapitre 5", fr:"Notre méthode", en:"How It Works", pages:"p. 58-71",
   sum:"C’est le cœur pratique du livre, souvent lu en ouverture des réunions. Il commence par une affirmation, en traduction libre : « Nous avons rarement vu échouer une personne qui a suivi notre chemin à fond. » Viennent ensuite les Douze Étapes, présentées comme le chemin suivi par les premiers membres, puis le rappel que les demi-mesures ne servent à rien. Le chapitre décrit la racine du problème, l’égocentrisme, à travers l’image d’un acteur qui veut diriger tout le spectacle. Il guide la Troisième Étape par une prière de décision, puis détaille la Quatrième : un inventaire écrit des ressentiments, en colonnes, puis des peurs et de la conduite sexuelle.",
   keys:["Les étapes sont des suggestions, mais ceux qui les ont suivies à fond se sont rétablis.","Les demi-mesures ne servent à rien : l’honnêteté doit être complète.","L’égocentrisme, la volonté propre qui déborde, est la racine des difficultés.","Le ressentiment est désigné comme le pire ennemi de l’alcoolique ; l’inventaire se fait par écrit."],
   ask:"Dans quel domaine de ta vie joues-tu encore l’acteur qui veut diriger tout le spectacle ?", steps:[3,4]},
  {id:"ch6", n:"Chapitre 6", fr:"Passons à l’action", en:"Into Action", pages:"p. 72-88",
   sum:"Après l’inventaire, l’action : partager ce que l’on a écrit avec une autre personne (Cinquième Étape), devenir prêt à être libéré de ses défauts puis le demander humblement (Sixième et Septième), dresser la liste des personnes lésées et réparer (Huitième et Neuvième), avec le souci de ne blesser personne au passage. C’est dans ce chapitre que se trouvent les Promesses, lues dans de nombreuses réunions. Il pose ensuite la Dixième Étape, la vigilance quotidienne face à l’égoïsme, à la malhonnêteté, au ressentiment et à la peur, et rappelle, en traduction libre : « Nous ne sommes pas guéris de l’alcoolisme. Ce que nous avons, c’est un sursis quotidien qui dépend de notre état spirituel. » Il se conclut par la Onzième Étape : revue du soir et méditation du matin.",
   keys:["Garder son inventaire pour soi expose à la rechute : il se partage avec une personne sûre.","Réparer ses torts sans en causer de nouveaux : une réparation ne doit pas blesser un tiers.","Les Promesses se réalisent parfois vite, parfois lentement, à condition d’y travailler.","Un sursis quotidien : la sobriété s’entretient chaque jour, soir et matin."],
   ask:"Quelle Promesse te paraît aujourd’hui la plus lointaine, et laquelle commence déjà à se réaliser ?", steps:[5,6,7,8,9,10,11]},
  {id:"ch7", n:"Chapitre 7", fr:"Travailler avec les autres", en:"Working With Others", pages:"p. 89-103",
   sum:"Ce chapitre décrit la Douzième Étape en pratique. Il s’ouvre sur ce constat, en traduction libre : « L’expérience pratique montre que rien ne protège autant de l’alcool qu’un travail intensif auprès d’autres alcooliques. » Il donne des conseils très concrets : approcher une personne quand elle est prête à entendre, parler de sa propre expérience plutôt que faire la morale, éviter les débats théologiques, laisser la personne libre de choisir, ne pas se décourager si elle refuse. Il aborde aussi l’aide aux familles et la question des lieux où l’on boit : on peut y aller si l’on a une bonne raison d’y être et une sobriété solide.",
   keys:["Aider un autre alcoolique protège sa propre sobriété.","On partage son histoire au lieu de donner des leçons.","On ne force personne : la décision appartient à celui ou celle qui souffre.","Un refus n’est pas un échec ; la graine peut germer plus tard."],
   ask:"Quelle part de ton histoire pourrait aujourd’hui être utile à une personne qui commence ?", steps:[12]},
  {id:"ch8", n:"Chapitre 8", fr:"Aux épouses", en:"To Wives", pages:"p. 104-121",
   sum:"Écrit en 1939 du point de vue des épouses, à une époque où presque tous les premiers membres étaient des hommes, ce chapitre s’adresse aux proches qui vivent avec une personne alcoolique. Il décrit la peur, la honte, l’isolement et la colère des familles, et conseille d’éviter les reproches, les sermons et le contrôle, qui renforcent souvent la consommation. Il invite les proches à prendre soin de leur propre vie intérieure et à ne pas attendre que la personne alcoolique change pour aller mieux. Aujourd’hui, on peut le lire en remplaçant « épouse » par « tout proche » ; les groupes familiaux Al-Anon, fondés en 1951, prolongent ce chapitre.",
   keys:["La maladie touche toute la famille, pas seulement la personne qui boit.","Reproches et contrôle aggravent souvent la situation ; patience et fermeté aident davantage.","Le proche a droit à son propre rétablissement, indépendamment de la personne alcoolique."],
   ask:"Si tu es un proche : quel geste de contrôle pourrais-tu lâcher cette semaine ? Si tu bois : qu’ont vécu les personnes qui t’aiment ?", steps:[8,9]},
  {id:"ch9", n:"Chapitre 9", fr:"La famille par la suite", en:"The Family Afterward", pages:"p. 122-135",
   sum:"La sobriété ne règle pas d’un coup les problèmes familiaux : rancunes accumulées, confiance à reconstruire, rôles à redéfinir. Le chapitre met en garde contre deux pièges : exiger de la famille qu’elle salue aussitôt le changement, et se plonger dans la spiritualité ou les réunions au point de négliger les siens. Il conseille de ne pas ressortir les vieux squelettes du placard pour accuser, mais de faire du passé une ressource pour aider d’autres familles. Il insiste enfin sur la joie : les auteurs refusent d’être un groupe morose et affirment, en traduction libre : « Nous tenons absolument à profiter de la vie. »",
   keys:["La confiance se reconstruit lentement ; la patience de chacun est nécessaire.","La spiritualité ne doit pas devenir une nouvelle façon de délaisser sa famille.","Le passé, même douloureux, peut devenir une richesse pour aider d’autres personnes.","Le rétablissement inclut le rire, le plaisir et la légèreté."],
   ask:"Qu’attendent de toi tes proches qu’un simple arrêt de l’alcool ne suffit pas à leur donner ?", steps:[9,10]},
  {id:"ch10", n:"Chapitre 10", fr:"Aux employeurs", en:"To Employers", pages:"p. 136-150",
   sum:"Écrit du point de vue d’un employeur qui a vu l’alcool abîmer des collaborateurs de valeur, ce chapitre explique comment aider un salarié alcoolique sans complaisance ni rejet. Il propose de distinguer la maladie de la mauvaise foi, d’aborder franchement le problème, d’offrir une chance réelle de soin et de rétablissement, de garder la confidentialité et de poser des limites claires. Lu aujourd’hui, il annonce les programmes d’aide aux salariés et la reconnaissance de l’alcoolisme comme une question de santé au travail.",
   keys:["L’alcoolisme est une maladie qui se traite, y compris quand elle touche le travail.","Aider ne veut pas dire tout excuser : des règles claires soutiennent le rétablissement.","La discrétion protège la dignité de la personne qui se soigne."],
   ask:"Comment ta consommation a-t-elle pesé sur ton travail, et que pourrais-tu réparer de ce côté-là ?", steps:[8,9]},
  {id:"ch11", n:"Chapitre 11", fr:"Une vision pour toi", en:"A Vision for You", pages:"p. 151-164",
   sum:"Le dernier chapitre de la première partie raconte la naissance concrète de la fraternité. En mai 1935, Bill W., seul à Akron après l’échec d’une affaire, hésite dans le hall de l’hôtel Mayflower entre le bar et l’annuaire téléphonique. Il cherche un alcoolique à qui parler et rencontre ainsi le Dr Bob. Ensemble, ils aident un avocat hospitalisé, Bill D., qui devient le troisième membre. Le chapitre décrit la croissance des premiers groupes et la vie nouvelle qu’ils offrent, puis se conclut par un appel, en traduction libre : « Abandonne-toi à Dieu tel que tu Le conçois. Admets tes fautes devant Lui et devant tes semblables. Déblaie les décombres de ton passé. Donne librement ce que tu trouves, et rejoins-nous. »",
   keys:["Le premier geste des AA est un coup de téléphone : un alcoolique qui en cherche un autre pour ne pas boire.","La fraternité naît de la rencontre de deux personnes qui se comprennent de l’intérieur.","La vie sobre est décrite comme une aventure joyeuse, pas comme une privation.","L’appel final résume tout le programme en quatre gestes."],
   ask:"Qui est la personne que tu pourrais appeler, comme Bill depuis le hall de l’hôtel, la prochaine fois que l’envie se présente ?", steps:[3,12]},
  {id:"drbob", n:"Histoires · 1", fr:"Le cauchemar du Dr Bob", en:"Doctor Bob’s Nightmare", pages:"p. 171-181",
   sum:"Première des histoires personnelles, celle du Dr Bob, chirurgien à Akron, originaire du Vermont. Il raconte une jeunesse très encadrée, des études de médecine déjà marquées par l’alcool, puis des années de consommation cachée, de sédatifs pour dormir et de promesses non tenues, malgré le soutien de sa femme Anne et sa fréquentation du Groupe d’Oxford. Tout change avec la rencontre de Bill W. : pour la première fois, quelqu’un lui parle de l’alcoolisme par expérience, sans le juger. Après une dernière rechute, il ne boit plus à partir du 10 juin 1935, date retenue pour la fondation des AA, et consacre le reste de sa vie à aider des milliers d’alcooliques.",
   keys:["Le savoir médical ne protège pas de l’alcoolisme.","Être compris par un pair produit ce que les conseils et les sermons n’avaient pas obtenu.","Le service auprès des autres a été le pilier de sa sobriété jusqu’à sa mort en 1950."],
   ask:"Qui, dans ta vie, t’a parlé de ton problème avec compréhension plutôt qu’avec jugement ? Qu’a changé cette conversation ?", steps:[1,12]},
  {id:"stories", n:"Deuxième partie", fr:"Les histoires personnelles", en:"Personal Stories", pages:"à partir de la p. 169",
   sum:"La seconde partie du livre rassemble des témoignages de membres, renouvelés à chaque édition. Dans la 4e édition anglaise (2001), ils sont regroupés en trois sections : les pionniers des AA, ceux qui se sont arrêtés à temps, et ceux qui ont presque tout perdu. On y rencontre des femmes et des hommes de tous âges, de toutes origines et de tous milieux, croyants ou non. Leur rôle est simple : te permettre de te reconnaître. Comme le dit le chapitre 5, chaque récit raconte ce que nous étions, ce qui est arrivé, et ce que nous sommes maintenant. Les éditions dans d’autres langues, dont le français, contiennent parfois des histoires différentes.",
   keys:["Cherche les ressemblances plutôt que les différences.","Il n’est pas nécessaire d’avoir tout perdu pour être alcoolique.","Chaque histoire suit la même trame : avant, ce qui est arrivé, maintenant."],
   ask:"Quelle histoire te ressemble le plus, et sur quel détail précis ?", steps:[1,2,12]},
  {id:"app2", n:"Appendice II", fr:"L’expérience spirituelle", en:"Spiritual Experience", pages:"p. 567-568",
   sum:"Ajouté après la première impression, cet appendice précise ce que le livre entend par « expérience spirituelle ». Beaucoup de lecteurs avaient compris qu’il fallait vivre un bouleversement soudain, comme celui de Bill W. Or la plupart des membres connaissent un changement progressif, de la variété « éducative » décrite par le psychologue William James : un changement de personnalité que les proches remarquent souvent avant la personne elle-même. L’appendice présente la bonne volonté, l’honnêteté et l’ouverture d’esprit comme les éléments essentiels du rétablissement. Il se termine par une phrase sur le mépris avant l’examen, attribuée dans le livre à Herbert Spencer, mais que les chercheurs font plutôt remonter au théologien William Paley.",
   keys:["L’expérience spirituelle est le plus souvent lente et progressive.","Les proches remarquent souvent le changement avant la personne elle-même.","Bonne volonté, honnêteté, ouverture d’esprit : trois dispositions suffisent pour commencer.","Rejeter une idée avant de l’avoir examinée est le véritable obstacle."],
   ask:"Quel changement les autres ont-ils remarqué chez toi depuis que tu cherches à arrêter, que tu n’avais pas vu toi-même ?", steps:[2,11,12]}
 ],
 promises: [
  "Nous allons connaître une liberté nouvelle et un bonheur nouveau.",
  "Nous ne regretterons pas le passé et ne voudrons pas non plus lui fermer la porte.",
  "Nous comprendrons le sens du mot sérénité.",
  "Nous connaîtrons la paix.",
  "Si bas que nous soyons descendus, nous verrons comment notre expérience peut profiter aux autres.",
  "Le sentiment d’inutilité et l’apitoiement sur soi disparaîtront.",
  "Nous perdrons tout intérêt pour ce qui est égoïste et nous nous intéresserons davantage aux autres.",
  "La recherche de nous-mêmes s’effacera.",
  "Notre attitude et notre regard sur la vie changeront entièrement.",
  "La peur des gens et de l’insécurité matérielle nous quittera.",
  "Nous saurons d’instinct faire face aux situations qui autrefois nous déroutaient.",
  "Nous comprendrons soudain que Dieu fait pour nous ce que nous ne pouvions pas faire seuls."
 ],
 promisesNote: "Traduction libre de l’édition de 1939 (p. 83-84). Le texte ajoute aussitôt : ces promesses sont-elles extravagantes ? Nous ne le pensons pas. Elles se réalisent parmi nous, parfois vite, parfois lentement. Elles se concrétiseront toujours si nous y travaillons.",
 history: [
  {y:"Années 1920-30", d:"", t:"Rowland H. chez Carl Jung", x:"Un homme d’affaires américain, Rowland Hazard, consulte le psychiatre Carl Jung à Zurich pour son alcoolisme. Après une rechute, Jung lui dit ne voir d’espoir que dans une expérience spirituelle profonde. La date exacte de ce séjour est discutée par les historiens."},
  {y:"Années 1930", d:"", t:"Le Groupe d’Oxford", x:"Rowland rejoint le Groupe d’Oxford, mouvement chrétien fondé par Frank Buchman, qui prône l’examen de soi, l’aveu, la réparation des torts et le service. Les AA en garderont ces pratiques, sans le cadre religieux du mouvement."},
  {y:"1934", d:"", t:"Ebby T. cesse de boire", x:"Ebby Thacher, ancien camarade de collège de Bill W., est menacé d’internement dans le Vermont à cause de l’alcool. Rowland et d’autres membres du Groupe d’Oxford le prennent en charge, et il arrête de boire."},
  {y:"1934", d:"Novembre", t:"La visite d’Ebby", x:"Sobre depuis peu, Ebby rend visite à Bill dans sa maison de Brooklyn. Bill, qui boit, l’écoute parler d’une solution spirituelle avec scepticisme, mais la conversation fait son chemin."},
  {y:"1934", d:"11 décembre", t:"Le dernier verre de Bill W.", x:"Bill entre une dernière fois à l’hôpital Towns de New York, où le soigne le Dr Silkworth. Il y vit une expérience spirituelle intense et ne boira plus jamais."},
  {y:"1935", d:"Mai", t:"Le hall de l’hôtel Mayflower", x:"Seul à Akron, dans l’Ohio, après l’échec d’une affaire, Bill W. est tenté par le bar de l’hôtel. Il comprend qu’il doit parler à un autre alcoolique et passe des coups de téléphone qui le mènent, par l’intermédiaire d’Henrietta Seiberling, au Dr Bob Smith."},
  {y:"1935", d:"12 mai", t:"Bill W. rencontre le Dr Bob", x:"Le Dr Bob, chirurgien, avait prévu de rester un quart d’heure ; l’entretien dure des heures. Pour la première fois, il parle avec quelqu’un qui comprend sa maladie de l’intérieur."},
  {y:"1935", d:"10 juin", t:"Fondation des AA", x:"Le Dr Bob boit son dernier verre. Cette date est retenue comme celle de la naissance des Alcooliques anonymes. Peu après, Bill D., avocat hospitalisé à Akron, devient le troisième membre."},
  {y:"1939", d:"Avril", t:"Parution du Gros Livre", x:"Le livre « Alcoholics Anonymous » paraît à New York. La fraternité prend le nom de son livre."},
  {y:"1941", d:"1er mars", t:"L’article du Saturday Evening Post", x:"Le journaliste Jack Alexander publie un long reportage sur les AA dans ce magazine très populaire. Les demandes d’aide affluent et le nombre de membres augmente fortement en quelques mois."},
  {y:"1946", d:"Avril", t:"Les Traditions sont proposées", x:"Bill W. publie dans le Grapevine, la revue des AA, une première version des Douze Traditions, tirée des difficultés rencontrées par les jeunes groupes."},
  {y:"1950", d:"Juillet", t:"Le congrès de Cleveland", x:"Lors du premier congrès international, à Cleveland, les membres adoptent les Douze Traditions. C’est la dernière intervention publique du Dr Bob."},
  {y:"1950", d:"16 novembre", t:"Mort du Dr Bob", x:"Le Dr Bob meurt à Akron, sobre depuis 1935. Avec sœur Ignatia, à l’hôpital Saint-Thomas, il a accompagné des milliers d’alcooliques."},
  {y:"1951", d:"", t:"Naissance d’Al-Anon", x:"Lois W., l’épouse de Bill, et Anne B. fondent les groupes familiaux Al-Anon pour les proches de personnes alcooliques."},
  {y:"1953", d:"", t:"Le « Douze et Douze »", x:"Bill W. publie « Les Douze Étapes et les Douze Traditions », un commentaire approfondi de chaque étape et de chaque tradition."},
  {y:"1955", d:"Juillet", t:"Les Trois Héritages", x:"Au congrès de Saint-Louis, pour les vingt ans de la fraternité, Bill W. et les anciens confient aux membres la responsabilité des AA : Rétablissement, Unité et Service."},
  {y:"1961", d:"30 janvier", t:"La lettre de Jung", x:"Répondant à une lettre de remerciements de Bill W., Carl Jung écrit que la soif d’alcool équivaut, à un niveau inférieur, à la soif spirituelle de plénitude, et la résume par la formule « spiritus contra spiritum ». Jung meurt quelques mois plus tard."},

var FAQ = [
 {q:"Suis-je alcoolique ?", a:"Personne d’autre que toi ne peut répondre à cette question : les AA ne posent pas de diagnostic. Quelques signes doivent t’alerter : boire plus ou plus longtemps que prévu, échouer à réduire, continuer malgré les dégâts, ressentir un besoin impérieux, avoir besoin de plus d’alcool pour le même effet, trembler ou transpirer quand tu arrêtes. Le test AUDIT de l’Organisation mondiale de la santé, dans les outils de l’application, donne un premier repère. Un médecin ou un addictologue peut faire une évaluation complète."},
 {q:"Je ne crois pas en Dieu. Les AA sont-ils pour moi ?", a:"Oui. La formule « Dieu tel que nous Le concevons » laisse chacun libre, et de nombreux membres sont athées ou agnostiques. Ta Puissance supérieure peut être le groupe, la nature, l’amour, la sagesse collective de ceux qui ont réussi à arrêter, ou simplement tout ce qui n’est pas ton ego. Le chapitre 4 du Gros Livre, « Nous, les agnostiques », a été écrit pour toi."},
 {q:"Et si je rechute ?", a:"La rechute est fréquente et ne fait pas de toi un échec : elle fait souvent partie du parcours. Le plus important est de ne pas la cacher. Parles-en le jour même à ton parrain, à ta marraine ou en réunion, et reviens. Ensuite, cherche ce qui l’a précédée : un état HALT, une situation à risque, un outil abandonné. Si tu as recommencé à boire beaucoup et tous les jours, vois un médecin avant d’arrêter à nouveau, car le sevrage peut être dangereux."},
 {q:"Dois-je arrêter pour toujours ?", a:"Les AA proposent l’abstinence complète, mais un jour à la fois : tu t’engages seulement pour aujourd’hui. « Pour toujours » est une durée que l’esprit ne peut pas porter ; vingt-quatre heures, si. Pour une personne dépendante, l’abstinence est en général la voie la plus sûre. Certaines personnes travaillent d’abord une réduction avec leur médecin : c’est une démarche médicale, à discuter avec un professionnel."},
 {q:"Les AA sont-ils une secte ou une religion ?", a:"Non. Il n’y a ni chef, ni cotisation, ni doctrine imposée, ni engagement écrit, et tu peux partir quand tu veux. Les AA ne sont affiliés à aucune religion ni à aucun mouvement politique (6e et 10e Traditions). Le programme est spirituel au sens large, pas religieux. Si un groupe exerce sur toi une pression qui te met mal à l’aise, change de groupe : chacun a sa propre culture."},
 {q:"Puis-je prendre un traitement médicamenteux ?", a:"Oui. Des médicaments aident à maintenir l’abstinence ou à réduire l’envie : acamprosate, naltrexone, nalméfène, baclofène, disulfirame. Ils sont prescrits et suivis par un médecin. Les AA n’ont pas d’avis sur les traitements, et les membres ne doivent pas jouer au docteur : un traitement prescrit est tout à fait compatible avec les réunions et les étapes."},
 {q:"Est-ce dangereux d’arrêter d’un coup ?", a:"Oui, quand on boit beaucoup et tous les jours depuis longtemps. Dans les heures ou les jours qui suivent l’arrêt peuvent apparaître tremblements, sueurs, anxiété, nausées, insomnie, et parfois des convulsions ou un delirium tremens, avec confusion, hallucinations et fièvre, potentiellement mortel sans soins. Avant d’arrêter, consulte un médecin : le sevrage peut se faire à domicile ou à l’hôpital, avec des médicaments et de la vitamine B1. En cas de confusion, d’hallucinations, de convulsions ou de forte fièvre, appelle le 15."},
 {q:"Combien ça coûte ?", a:"Rien. Il n’y a ni inscription, ni cotisation. Le chapeau qui circule en fin de réunion est facultatif et sert à payer la salle et le café."},
 {q:"Faut-il parler en réunion ?", a:"Non. Tu peux venir écouter pendant des semaines. Quand tu te sentiras prêt, tu pourras partager quelques mots. Personne ne te forcera à te présenter comme alcoolique."},
 {q:"Mes proches peuvent-ils venir ?", a:"Oui, aux réunions ouvertes. Pour eux-mêmes, les groupes familiaux Al-Anon, et Alateen pour les adolescents, offrent un lieu où parler de ce qu’ils vivent, que la personne alcoolique se soigne ou non."},
 {q:"Et la thérapie, l’addictologie ?", a:"Elles sont complémentaires des AA. En France, les CSAPA (centres de soins, d’accompagnement et de prévention en addictologie) proposent un suivi gratuit et confidentiel par des médecins, des psychologues et des travailleurs sociaux. Les thérapies cognitives et comportementales et l’entretien motivationnel ont fait leurs preuves. Bill W. lui-même a eu recours à une aide psychologique après des années de sobriété."},
 {q:"Combien de temps faut-il pour faire les étapes ?", a:"Cela varie. Les premiers membres les faisaient parfois en quelques jours ou quelques semaines ; aujourd’hui, beaucoup prennent plusieurs mois avec leur parrain ou leur marraine. Évite deux pièges : te précipiter pour en finir, ou repousser indéfiniment la Quatrième Étape. Les trois dernières étapes se vivent ensuite chaque jour, pour la vie."},
 {q:"Mon anonymat est-il protégé ?", a:"Oui. Aux AA, on se présente par son prénom, et ce qui se dit en réunion y reste. Tu es libre de dire à qui tu veux que tu fréquentes les AA, mais tu ne révèles jamais l’identité d’un autre membre."}
];

 {t:"Ça marche si tu le travailles", x:"Venir en réunion ne suffit pas toujours : ce sont les étapes vécues, les appels passés, le service rendu qui transforment.", use:"Quand tu as l’impression de stagner malgré les réunions."},
 {t:"Reviens", x:"Quoi qu’il se soit passé, même une rechute, la porte reste ouverte. Ceux qui reviennent finissent souvent par rester.", use:"Après une glissade, ou quand la honte te pousse à t’éloigner du groupe."},
 {t:"Le premier verre", x:"Pour une personne alcoolique, c’est le premier verre qui enclenche tout le reste. La vigilance porte sur celui-là seulement.", use:"Quand une petite voix te dit qu’un seul verre ne compte pas."},
 {t:"HALT", x:"Faim, colère, solitude, fatigue : quatre états qui fragilisent et se font passer pour une envie de boire. On commence par répondre au besoin réel.", use:"Dès qu’une envie surgit : vérifie d’abord ces quatre besoins."},
 {t:"Progrès, pas perfection", x:"Le Gros Livre parle de progrès spirituel plutôt que de perfection spirituelle. Personne ne fait les étapes parfaitement ; l’important est d’avancer.", use:"Quand ton perfectionnisme te fait croire que tu as tout raté."}
];

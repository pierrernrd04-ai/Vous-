var QRAW=[["12np0og",0,"Vous voyez, l’alcool se dit en latin spiritus, et l’on emploie le même mot pour la plus haute expérience religieuse comme pour le poison le plus dépravant. La formule qui aide est donc : spiritus contra spiritum.","You see, alcohol in Latin is spiritus and you use the same word for the highest religious experience as well as for the most depraving poison. The helpful formula therefore is: spiritus contra spiritum.","Carl Gustav Jung","Psychiatre, psychologie analytique, Suisse, XXe s.","Lettre à Bill Wilson, 30 janvier 1961",0,"Jung répond à Bill W. quelques mois avant sa mort et livre l’intuition qui irrigue les Douze Étapes : l’alcool occupe la place d’une soif plus haute. Ce n’est pas une exhortation religieuse au sens étroit ; « esprit » désigne ici tout ce qui donne sens, lien et transcendance. Seule une expérience de cet ordre lui semble assez puissante pour remplacer celle que procurait le produit.","Note ce que l’alcool t’apportait vraiment (apaisement, élan, appartenance) et cherche une source sobre pour chacun.",[]],["dnb1n9",0,"Son besoin d’alcool était l’équivalent, à un niveau inférieur, de la soif spirituelle de notre être pour la plénitude ; exprimée en langage médiéval : l’union avec Dieu.","His craving for alcohol was the equivalent, on a low level, of the spiritual thirst of our being for wholeness, expressed in medieval language: the union with God.","Carl Gustav Jung","Psychiatre, psychologie analytique, Suisse, XXe s.","Lettre à Bill Wilson, 30 janvier 1961",0,"Jung parle de Rowland H., un patient qu’il jugeait sans issue médicale, et recadre radicalement le craving : non un vice, mais une aspiration légitime qui s’est trompée d’objet. Ce déplacement allège la honte, car il reconnaît la noblesse du manque derrière la consommation. Il fixe aussi une tâche positive : il ne suffit pas d’ôter le verre, il faut nourrir la soif qu’il imitait.","Quand l’envie monte, demande-toi : « De quoi ai-je soif, au fond, à cet instant ? »",[3,5,8]],["1t14s7d",0,"Nous avons admis que nous étions impuissants devant l’alcool, que nous avions perdu la maîtrise de notre vie.","We admitted we were powerless over alcohol—that our lives had become unmanageable.","Alcooliques anonymes","Fraternité d’entraide fondée en 1935, États-Unis","Les Douze Étapes, Première Étape (Alcoholics Anonymous, 1939)",1,"Paradoxe fondateur des Douze Étapes : la reconnaissance d’une impuissance ouvre la voie à une puissance d’agir nouvelle. L’aveu ne porte pas sur la valeur de la personne mais sur un fait d’expérience, l’échec répété du contrôle par la seule volonté. En cessant de mener une bataille perdue d’avance, on libère l’énergie nécessaire pour demander de l’aide et changer de stratégie.","Écris trois tentatives passées de « boire raisonnablement » et ce qu’elles t’ont appris sur les limites du contrôle.",[1,2,6]],["1a8w5p8",0,"La seule condition pour être membre des AA est le désir d’arrêter de boire.","The only requirement for A.A. membership is a desire to stop drinking.","Alcooliques anonymes","Fraternité d’entraide fondée en 1935, États-Unis","Les Douze Traditions, Troisième Tradition",1,"Le texte n’exige ni abstinence acquise, ni foi, ni cotisation, ni diagnostic : un simple désir suffit, même fragile, même ambivalent. Cette porte basse est un choix psychologique lucide, car la honte pousse à attendre d’être « prêt » pour demander de l’aide. On rejoint ce que l’entretien motivationnel enseigne : l’ambivalence est le point de départ normal du changement, non un obstacle à vaincre avant de commencer.","Si tu hésites, formule ton désir tel qu’il est, même tiède : « Une part de moi voudrait arrêter. »",[2,5,6]],["d5ia2l",0,"Un jour à la fois.","One day at a time.","Alcooliques anonymes","Slogan des fraternités d’entraide","",1,"Ce slogan minuscule est un outil cognitif redoutable : « pour toujours » est une durée que l’esprit ne peut porter, vingt-quatre heures en est une. Il découpe une tâche écrasante en unités tenables, comme le font les thérapies comportementales avec les objectifs. Il ne nie pas l’avenir ; il refuse seulement de faire peser dès aujourd’hui sur les épaules le poids de tous les jours à venir.","Ce matin, engage-toi seulement pour aujourd’hui, à voix haute ou par écrit. Demain, tu décideras à nouveau.",[2,10,12]],["3kwme8",0,"Voici comment c’est arrivé : je suis tombée amoureuse, puis, parce que cet amour ruinait ma vie, il a fallu que je m’en détache.","It happened this way: I fell in love and then, because the love was ruining my life, I had to fall out.","Caroline Knapp","Journaliste et essayiste, États-Unis, XXe s.","Drinking: A Love Story, 1996",0,"Knapp ouvre son récit par une métaphore amoureuse qui choque d’abord, puis éclaire : on ne quitte pas une simple substance, on quitte une relation, avec ses rituels, sa fidélité et ses promesses. D’où le deuil réel qui accompagne les premiers mois, souvent sous-estimé par l’entourage. Nommer cette perte comme une rupture autorise à la pleurer sans y voir un signe d’échec ou de rechute imminente.","Écris une lettre de rupture à l’alcool : ce qu’il t’a donné, ce qu’il t’a pris, pourquoi tu pars.",[]],["oel87e",0,"L’alcool ne console en rien, il ne meuble pas les espaces psychologiques de l’individu, il ne remplace que le manque de Dieu.","","Marguerite Duras","Écrivaine et cinéaste, France, XXe s.","La Vie matérielle, 1987",0,"Duras, qui a traversé plusieurs cures de désintoxication, refuse l’image de l’alcool consolateur : il ne remplit rien, il se contente d’occuper la place d’un manque plus vaste. Elle rejoint l’intuition de Jung sur la soif spirituelle déplacée. La phrase invite à distinguer anesthésie et consolation : la première éteint la douleur un moment, la seconde transforme durablement le rapport qu’on entretient avec elle.","Liste ce qui te console réellement, sans effet de rebond le lendemain, et garde cette liste sur toi.",[3,6,8]],["179dvfk",0,"Non pas : pourquoi l’addiction ? mais : pourquoi la douleur ?","Not why the addiction, but why the pain.","Gabor Maté","Médecin spécialiste des addictions, Canada","In the Realm of Hungry Ghosts, 2008",0,"Médecin à Vancouver auprès de personnes en grande précarité, Maté déplace le regard du comportement vers sa fonction : l’addiction est une tentative de solution à une souffrance, souvent ancienne. Ce renversement réduit la honte et oriente le soin vers la cause. Nuance utile : comprendre l’origine ne dispense pas d’arrêter la consommation, mais rend l’arrêt plus durable en traitant ce qu’elle soulageait.","Demande-toi quelle douleur précise ton dernier craving cherchait à faire taire, et nomme-la en un mot.",[4,5]],["12zye51",0,"Le contraire de l’addiction n’est pas la sobriété. Le contraire de l’addiction, c’est le lien.","The opposite of addiction is not sobriety. The opposite of addiction is connection.","Johann Hari","Journaliste et essayiste, Royaume-Uni","Conférence TED « Everything you think you know about addiction is wrong », 2015",0,"Hari s’appuie notamment sur les expériences de Bruce Alexander, le « Rat Park », où des rats entourés de congénères délaissent l’eau droguée que des rats isolés consomment compulsivement. La formule rappelle que l’isolement est un terrain d’addiction autant qu’une conséquence. Limite à garder en tête : le lien ne remplace pas le soin médical, notamment pour le sevrage alcoolique, qui peut nécessiter un encadrement.","Cette semaine, fixe un contact sobre régulier : un appel, une réunion, un café hebdomadaire avec la même personne.",[]],["e2divr",0,"La drogue et l’alcool ne sont pas mon problème : mon problème, c’est la réalité ; la drogue et l’alcool sont ma solution.","Drugs and alcohol are not my problem, reality is my problem, drugs and alcohol are my solution.","Russell Brand","Humoriste et auteur, Royaume-Uni","« My life without drugs », The Guardian, mars 2013",0,"Brand formule avec humour ce que la clinique appelle l’hypothèse d’automédication : la substance sert d’abord à rendre supportable une réalité intérieure ou extérieure. Arrêter retire donc une solution sans régler le problème, ce qui explique la fragilité des premiers mois. Le rétablissement consiste à construire d’autres réponses face à cette même réalité, pas à attendre qu’elle devienne enfin facile.","Repère une situation qui te pèse et teste cette semaine une réponse sobre : parler, marcher, écrire, dormir.",[5,12]],["1ukc2hl",0,"L’ivresse n’est rien d’autre qu’une folie volontaire.","Nihil aliud esse ebrietatem quam voluntariam insaniam.","Sénèque","Philosophe stoïcien, Rome, Ier s.","Lettres à Lucilius, 83",0,"Sénèque reprend une définition qu’il attribue à la tradition stoïcienne pour démonter l’idée que l’ivresse serait un état anodin. Son observation est fine : ce qui est volontaire, c’est l’entrée, non la suite, puisque l’homme ivre perd précisément la maîtrise qu’il croyait garder. Pour qui sort de la dépendance, le mot « volontaire » mérite nuance : la compulsion réduit la liberté, d’où l’intérêt de décider avant le premier verre.","Décide à froid, le matin, de ta réponse aux situations à risque du jour, quand ta liberté est entière.",[1,2]],["12czdss",0,"J’observe le précepte de m’abstenir des boissons fermentées et distillées qui sont cause d’inattention.","","Tradition bouddhiste","Cinquième précepte, bouddhisme ancien","Cinquième des cinq préceptes (pañcasīla)",1,"Le précepte ne condamne pas l’alcool comme impur : il le désigne par sa conséquence, pamāda, l’inattention, la négligence de soi. La faute visée est moins morale qu’attentionnelle, ce qui rend la règle compatible avec la bienveillance envers soi. Formulé comme un engagement que l’on « prend » et que l’on peut reprendre, il se prête bien à la logique du recommencement après un écart.","Reformule ton engagement selon ce que tu protèges : « Je choisis la clarté » plutôt que « J’ai l’interdiction ».",[6,8]],["tvh1a9",0,"Chez l’homme qui vit dans l’inattention, la soif croît comme une liane.","","Le Bouddha (Dhammapada)","Paroles attribuées au Bouddha, Inde ancienne","Dhammapada, verset 334",1,"La liane étouffe l’arbre qui la porte en poussant sans bruit : l’image décrit une soif (taṇhā) qui progresse par accoutumance plutôt que par décisions spectaculaires. Le remède proposé n’est pas l’effort brutal mais l’attention, appamāda, qui permet de voir pousser la tige tant qu’elle est fine. Les approches de pleine conscience appliquées aux addictions reposent sur la même idée : observer l’envie avant qu’elle ne gouverne.","Ce soir, note en une ligne chaque envie de boire du jour : heure, lieu, émotion. Rien d’autre.",[3,10]],["hjkzcp",0,"Ce n’est pas le vin qui enivre l’homme, c’est l’homme qui s’enivre lui-même.","","Proverbe chinois","Sagesse populaire, Chine","",1,"Le proverbe déplace l’attention du produit vers la personne qui s’y abandonne. Bien compris, il ne culpabilise pas : il rend du pouvoir, puisque ce qui dépend de soi peut changer. Il éclaire aussi le rôle des émotions, car on s’enivre souvent de chagrin ou de colère avant même le premier verre. La neurobiologie de la dépendance invite toutefois à ne pas en faire une simple affaire de caractère.","Avant une soirée, demande-toi de quoi tu risques de t’enivrer d’abord : fatigue, colère, ennui ?",[2,3,4]],["1i5gply",0,"Je tire mon sabre pour trancher l’eau, et l’eau coule de plus belle ; je lève ma coupe pour noyer mon chagrin, et le chagrin redouble.","","Li Bai","Poète, Chine, dynastie Tang, VIIIe s.","« Banquet d’adieu au pavillon de Xie Tiao, à Xuanzhou »",0,"Le plus célèbre poète buveur de Chine livre ici un aveu d’échec : l’alcool ne dissout pas la peine, il l’aggrave, comme on fait jaillir l’eau en la frappant. L’image est d’une précision clinique, car l’alcool, dépresseur du système nerveux, intensifie souvent tristesse et anxiété au fil des heures et des lendemains. Que l’aveu vienne d’un poète réputé pour célébrer le vin lui donne un poids singulier.","Quand tu es triste, choisis un geste qui laisse couler la peine sans la frapper : pleurer, marcher, appeler.",[]],["11r7kbs",0,"Halte : ne te laisse pas avoir trop faim, ni trop en colère, ni trop seul, ni trop fatigué.","","Alcooliques anonymes","Slogan des fraternités d’entraide","",1,"L’acronyme anglais HALT, « stop », regroupe quatre états physiologiques et émotionnels qui abaissent la vigilance et se déguisent volontiers en envie de boire. Sa force est de rendre le craving lisible : avant d’y voir une rechute imminente, on vérifie des besoins de base. Les approches de prévention de la rechute insistent de même sur les états internes comme déclencheurs, souvent davantage que les lieux ou les personnes.","À la prochaine envie, fais le point HALT : mange, souffle, appelle quelqu’un ou dors avant toute décision.",[3,4,10]],["c315q7",0,"C’est le premier verre qui enivre.","","Alcooliques anonymes","Formule des fraternités d’entraide","",1,"La formule paraît absurde à qui raisonne en quantités, et c’est précisément sa force : pour une personne dépendante, le premier verre ne produit pas l’ivresse, il déclenche la mécanique qui y mène. Elle déplace la vigilance du « combien » vers le « si ». Les sciences de l’addiction décrivent ce phénomène d’amorçage, où une seule prise relance l’envie au lieu de l’apaiser.","Remplace la question « combien vais-je boire ? » par « vais-je prendre le premier ? », et réponds-y d’avance.",[2,10]],["x0ty1h",0,"Un dépendant seul est en mauvaise compagnie.","","Narcotiques anonymes","Fraternité d’entraide fondée en 1953, États-Unis","",1,"L’humour de la formule recouvre une observation clinique : l’esprit en manque, laissé à lui-même, produit ses propres arguments en faveur de la consommation. Ce dialogue intérieur, que les fraternités appellent parfois « la maladie qui parle », perd de sa force dès qu’il est dit à voix haute à quelqu’un. La solitude n’est donc pas un simple inconfort : c’est un facteur de risque à traiter comme tel.","Quand une pensée te pousse à consommer, dis-la mot pour mot à quelqu’un de confiance avant d’y obéir.",[2,3]],["1uqf8f8",0,"Tu ne l’as pas causé, tu ne peux pas le contrôler, tu ne peux pas le guérir.","","Al-Anon","Groupes familiaux pour proches d’alcooliques","",1,"Les « trois C » des groupes familiaux Al-Anon s’adressent aux proches, enfants comme conjoints, qui portent souvent une culpabilité diffuse et l’illusion qu’un effort de plus suffirait. Les trois négations ne prônent pas l’indifférence : elles rendent à chacun sa responsabilité et libèrent une énergie engloutie dans la surveillance. Elles ouvrent la seule question utile pour le proche : que puis-je faire pour moi ?","Si tu aimes une personne dépendante, nomme un geste par lequel tu tentes de la contrôler, et essaie de t’en abstenir.",[1]],["f8ieh0",0,"Déroule la cassette jusqu’au bout.","","Alcooliques anonymes","Formule des groupes d’entraide anglophones","",1,"Le craving présente toujours le film en avant-première : le premier verre, la détente, la chaleur. Le slogan invite à regarder la suite que la mémoire euphorique coupe au montage : la soirée, la nuit, le réveil, les messages à relire. C’est une forme de projection temporelle proche des techniques cognitives de prise de recul : on ne combat pas l’envie, on la complète.","Écris la fin réaliste de ta dernière consommation et relis-la quand l’envie ne raconte que le début.",[4,8,10]],["127uz6o",0,"On est aussi malade que ses secrets.","","Alcooliques anonymes","Dicton des fraternités d’entraide","",1,"Le dicton ne réclame pas une confession publique ; il désigne la mécanique du secret, qui oblige à mentir, à surveiller, à s’isoler, et entretient la honte qui pousse à consommer. Les travaux sur la honte montrent qu’elle se nourrit de silence et s’atténue face à l’empathie. Nuance importante : partager se fait avec discernement, auprès d’une personne sûre, pas devant n’importe qui.","Choisis une personne sûre et confie-lui un seul secret lié à ta consommation, même petit.",[5,11,12]],["1f0rs4j",0,"Nous allons connaître une liberté nouvelle et un bonheur nouveau.","","Alcooliques anonymes","Fraternité d’entraide fondée en 1935, États-Unis","Alcoholics Anonymous (le Gros Livre), chap. 6, 1939",1,"Le passage dit « des Promesses » est lu à la fin de nombreuses réunions, et il tranche avec l’image d’une sobriété faite de privation. Le mot choisi est liberté : liberté vis-à-vis de l’obsession, de la peur du lendemain, du calcul permanent. Le texte précise que ces promesses se réalisent « parfois vite, parfois lentement », mise en garde utile contre l’attente d’un bonheur immédiat.","Note chaque soir une petite liberté gagnée par la sobriété : un matin clair, une promesse tenue, un trajet serein.",[2,4,10]],["hi8sxh",0,"Je crois que beaucoup d’anciens, qui ont soumis notre « cure anti-alcool » à des épreuves sévères mais réussies, constatent encore souvent qu’il leur manque la sobriété émotionnelle.","","Bill W. (William Wilson)","Cofondateur des Alcooliques anonymes, États-Unis","« The Next Frontier: Emotional Sobriety », AA Grapevine, janvier 1958",0,"Plus de vingt ans après son dernier verre, Bill W. évoque une longue dépression et popularise une notion devenue centrale : l’arrêt de l’alcool n’est qu’un premier étage. La sobriété émotionnelle désigne la capacité à traverser ses émotions sans dépendre des autres ni des circonstances pour se sentir en sécurité. Elle légitime aussi le recours à une aide psychologique au-delà de l’abstinence.","Repère une situation où ton humeur dépend entièrement d’autrui, et cherche ce que tu peux t’offrir toi-même.",[12]],["1v9i6lx",0,"Souviens-toi, Bill, ne gâchons pas tout ça. Restons simples !","","Dr Bob Smith","Médecin, cofondateur des Alcooliques anonymes, États-Unis","Dernières paroles adressées à Bill W., 1950",0,"Ces mots, prononcés peu avant sa mort, condensent une sagesse pratique souvent sous-estimée : la complexité est une alliée de la rechute. Plus un plan est sophistiqué, plus il offre d’exceptions et de négociations possibles. Rester simple revient à réduire la charge mentale dans les moments de fragilité, principe que les thérapies comportementales appliquent aussi en préférant des règles claires aux analyses interminables.","Résume ton plan de sobriété du jour en une seule phrase, assez simple pour la dire épuisé.",[2,5,7]],["uarv5i",0,"Le principe du mal qui règne en ce monde conduit le besoin spirituel méconnu à la perdition, s’il n’est pas contrebalancé soit par une véritable intuition religieuse, soit par le rempart protecteur de la communauté humaine.","","Carl Gustav Jung","Psychiatre, psychologie analytique, Suisse, XXe s.","Lettre à Bill Wilson, 30 janvier 1961",0,"La phrase est souvent éclipsée par « spiritus contra spiritum », alors qu’elle ouvre une seconde voie, laïque celle-là : la communauté. Jung met sur le même plan l’expérience spirituelle et l’appartenance à un groupe protecteur. C’est exactement ce que proposent les fraternités, mais aussi les groupes de parole non confessionnels : un lien assez solide pour contenir la soif, quelle que soit la croyance de chacun.","Identifie ton rempart : trois personnes ou un groupe que tu peux joindre quand l’envie devient forte.",[5]],["10f1rsd",0,"L’alcoolisme est une maladie, et l’alcoolique un malade ; l’alcoolique peut être aidé et mérite de l’être.","","Marty Mann","Militante de la santé publique, États-Unis, XXe s.","Principes du National Committee for Education on Alcoholism, 1944",0,"Parmi les premières femmes à s’être rétablies durablement aux AA, Marty Mann a consacré sa vie à faire passer l’alcoolisme du registre moral au registre sanitaire. Sa formule visait la stigmatisation, qui retarde la demande d’aide. Le modèle de la maladie a depuis été discuté et enrichi, mais son effet principal demeure précieux : on ne soigne pas une honte, on soigne une personne.","Cette semaine, parle de ta consommation comme d’un problème de santé, pas d’un défaut moral, au moins une fois.",[2,4,5]],["1u3n2so",0,"J’ai un problème qui met ma vie en danger et qui, autrefois, me tenait.","","Jean Kirkpatrick","Sociologue, fondatrice de Women for Sobriety, États-Unis","Women for Sobriety, énoncé d’acceptation n° 1",0,"Fondé en 1976 par une sociologue qui ne se reconnaissait pas dans le langage de l’impuissance, Women for Sobriety propose treize énoncés positifs. Le premier tient ensemble deux vérités : la gravité du problème et le fait qu’il appartient au passé. Le temps grammatical devient un outil : il installe une identité nouvelle tout en reconnaissant le danger, sans le minimiser.","Écris ton problème au passé : « Il me tenait. » Puis ajoute ce qui te tient debout aujourd’hui.",[1,10,2]],["1cqbcdn",0,"Le bonheur est une habitude que je développe.","","Jean Kirkpatrick","Sociologue, fondatrice de Women for Sobriety, États-Unis","Women for Sobriety, énoncé d’acceptation n° 3",0,"Kirkpatrick constatait que beaucoup de femmes buvaient pour échapper à une dévalorisation profonde ; elle a donc placé la construction active du bien-être au cœur de son programme. L’énoncé traite le bonheur comme une compétence qui s’exerce, idée proche de l’activation comportementale. Nuance : il ne s’agit pas de s’imposer la gaieté, mais de multiplier les occasions de plaisir sobre.","Programme aujourd’hui un plaisir sobre de quinze minutes, et note le soir ce qu’il t’a apporté.",[10]],["11maxvt",0,"Je suis responsable de moi-même et de mes actes.","","Jean Kirkpatrick","Sociologue, fondatrice de Women for Sobriety, États-Unis","Women for Sobriety, énoncé d’acceptation n° 13",0,"Dernier des treize énoncés, il clôt une démarche qui commence par la reconnaissance du problème. La responsabilité est ici une reprise de pouvoir, non une accusation : on n’a pas choisi de devenir dépendante, mais on choisit ce qu’on fait désormais. Cette distinction entre faute et responsabilité aide à sortir de la honte paralysante sans tomber dans la déresponsabilisation.","Distingue par écrit ce dont tu n’es pas coupable et ce dont tu choisis d’être responsable aujourd’hui.",[10,5,8]],["gvpt0e",0,"La vie peut être ordinaire, ou elle peut être grande.","","Jean Kirkpatrick","Sociologue, fondatrice de Women for Sobriety, États-Unis","Women for Sobriety, énoncé d’acceptation n° 6",0,"Contre la crainte, fréquente au début, d’une sobriété grise et ennuyeuse, Kirkpatrick affirme que la vie sobre peut être un choix d’intensité. L’énoncé répond à la croyance que l’alcool serait la source de la fête, de l’audace ou de la créativité. Il ne promet pas un quotidien exaltant ; il rappelle que la grandeur se construit, avec le temps, l’argent et la lucidité retrouvés.","Note une chose que tu remettais à plus tard à cause de l’alcool, et fais-en aujourd’hui le premier pas.",[10]],["1o9i6ki",0,"J’ai découvert que je suis dépendante non seulement des médicaments que je prenais pour mon arthrite, mais aussi de l’alcool.","","Betty Ford","Ancienne Première dame des États-Unis","Déclaration publique, avril 1978",0,"En rendant publique sa dépendance peu après avoir quitté la Maison-Blanche, Betty Ford a fait reculer la stigmatisation des femmes alcooliques plus que bien des campagnes. Le verbe « découvrir » est juste : la dépendance s’installe souvent à l’insu de la personne, surtout lorsqu’elle se mêle à des médicaments prescrits. Elle fonda ensuite le centre de soins qui porte son nom.","Écris à la première personne une phrase vraie sur ta consommation, sans adjectif honteux ni excuse.",[5,9]],["ehlef6",0,"Je suis devenue une alcoolique dès que j’ai commencé à boire.","","Marguerite Duras","Écrivaine et cinéaste, France, XXe s.","La Vie matérielle, 1987",0,"Duras décrit une bascule immédiate que beaucoup reconnaissent : la relation à l’alcool n’a jamais été tranquille, elle a été d’emblée excessive. La phrase contredit le récit rassurant d’une dérive lente que l’on aurait pu enrayer en se surveillant mieux. Elle aide aussi à renoncer au projet de « boire normalement » lorsque l’histoire personnelle montre que ce temps-là n’a jamais existé.","Remonte à tes premiers rapports avec l’alcool et demande-toi honnêtement s’ils ont jamais été modérés.",[1,6,10]],["1bn1b60",0,"Je ne comprends rien au mystère de la grâce, sinon qu’elle nous rejoint là où nous sommes, mais ne nous laisse pas là où elle nous a trouvés.","","Anne Lamott","Romancière et essayiste, États-Unis","Traveling Mercies, 1999",0,"Sobre depuis 1986, Lamott raconte un rétablissement sans héroïsme, fait de tempêtes intérieures, d’humour et de gratitude. La phrase tient un équilibre précieux : on est accueilli sans condition préalable, mais cet accueil met en mouvement. Pour qui croit devoir se réparer avant de mériter de l’aide, elle renverse l’ordre : l’aide vient d’abord, le changement suit, et le premier ne dépend pas du second.","Demande de l’aide aujourd’hui tel que tu es, sans attendre un premier progrès pour la mériter.",[9,10]],["1efmham",0,"Vous ne pouvez sauver, réparer ni secourir aucun d’entre eux, ni rendre aucun d’entre eux sobre.","","Anne Lamott","Romancière et essayiste, États-Unis","Conférence TED « 12 truths I learned from life and writing », 2017",0,"Lamott s’adresse ici aux proches et à la tentation de faire du rétablissement d’autrui son propre projet. La phrase ne décourage pas l’amour ; elle le distingue de la prise en charge, qui épuise l’aidant et prive la personne dépendante de sa propre décision. On retrouve l’esprit des groupes familiaux : aider, c’est rester présent et poser des limites, non porter à la place.","Si tu soutiens quelqu’un, remplace un geste de contrôle par une phrase simple : « Je suis là quand tu voudras. »",[12,1,3]],["1ec0m9s",0,"L’aide est la face ensoleillée du contrôle.","","Anne Lamott","Romancière et essayiste, États-Unis","Conférence TED « 12 truths I learned from life and writing », 2017",0,"Formule ironique : derrière le désir d’aider se cache souvent un besoin de maîtriser l’autre et une angoisse qu’on ne supporte pas. Lamott, qui a connu les deux côtés, invite à examiner ses motivations sans s’en accabler. Pour la personne en rétablissement, la phrase vaut aussi à l’envers : vouloir tout contrôler chez soi peut devenir une nouvelle forme de compulsion.","Avant d’aider quelqu’un, demande-toi : est-ce pour son bien, ou pour calmer mon inquiétude ?",[1,4,11]],["u799ok",0,"Les addictions naissent toujours de la douleur, qu’elle soit ressentie ouvertement ou cachée dans l’inconscient.","","Gabor Maté","Médecin spécialiste des addictions, Canada","In the Realm of Hungry Ghosts, 2008",0,"Maté fonde cette affirmation sur des décennies de pratique auprès de patients dont l’histoire comportait presque toujours des blessures précoces. Le mot « toujours » est discuté par d’autres chercheurs, qui soulignent aussi la génétique, l’accès au produit ou le contexte social. Retenue avec cette nuance, l’idée reste féconde : elle invite à soigner la douleur sous-jacente, pas seulement le symptôme.","Envisage d’en parler à un thérapeute : nommer la douleur sous la consommation est un vrai travail, pas un luxe.",[5,12]],["1vmx2ue",0,"La tentative d’échapper à la douleur est ce qui crée davantage de douleur.","","Gabor Maté","Médecin spécialiste des addictions, Canada","",0,"Le cycle décrit est bien connu des cliniciens : la substance apaise un instant, puis ajoute ses propres souffrances, manque, honte, conflits, qui appellent une nouvelle prise. L’évitement expérientiel, notion centrale de la thérapie d’acceptation et d’engagement, fonctionne de la même façon : plus on fuit une émotion, plus elle gagne de terrain. Accueillir la douleur sobre est d’abord plus dur, ensuite plus léger.","Quand une émotion pénible monte, reste avec elle trois minutes en respirant, sans rien faire pour la chasser.",[11,5]],["1tdp8qc",0,"Depuis cent ans, nous chantons des chants de guerre sur les personnes dépendantes ; je crois que nous aurions dû, depuis toujours, leur chanter des chansons d’amour.","","Johann Hari","Journaliste et essayiste, Royaume-Uni","Conférence TED « Everything you think you know about addiction is wrong », 2015",0,"Hari conclut ainsi sa critique de la « guerre contre la drogue », qui selon lui a aggravé l’isolement et la honte des usagers. Le registre musical n’est pas une coquetterie : il oppose la logique de la punition à celle de l’attachement. À l’échelle personnelle, la phrase interroge la manière dont on se parle pendant le rétablissement : sur le ton de la guerre ou sur celui du soin.","Relis la façon dont tu te parles après un écart, et réécris-la sur le ton qu’on emploie avec un ami.",[5]],["14v46x3",0,"La honte a besoin de trois choses pour croître de façon exponentielle dans nos vies : le secret, le silence et le jugement.","","Brené Brown","Chercheuse en travail social, États-Unis","Daring Greatly, 2012",0,"Brown, elle-même sobre depuis les années 1990, décrit la honte comme une émotion qui prospère dans l’ombre et perd sa force quand elle est nommée devant une personne empathique. Dans l’addiction, la honte est à la fois cause et conséquence : on boit pour l’oublier, puis on a honte d’avoir bu. Retirer un seul des trois ingrédients suffit souvent à enrayer ce cercle.","Choisis lequel des trois, secret, silence ou jugement, tu peux désamorcer cette semaine, et comment.",[5,2,11]],["1r9xerb",0,"On ne peut pas anesthésier sélectivement les émotions : quand on engourdit les émotions douloureuses, on engourdit aussi les émotions positives.","","Brené Brown","Chercheuse en travail social, États-Unis","The Gifts of Imperfection, 2010",0,"Brown y voit le coût caché de toute stratégie d’engourdissement, alcool compris : la même vanne règle la douleur et la joie. Beaucoup de personnes sobres décrivent d’ailleurs, passé les premières semaines difficiles, le retour de sensations fines qu’elles avaient oubliées. Le rétablissement suppose donc d’apprendre à tolérer l’inconfort, condition pour retrouver aussi l’intensité des moments heureux.","Note aujourd’hui une émotion agréable ressentie pleinement, et l’instant précis où elle est apparue.",[10,11]],["1hhktue",0,"« Pour oublier que j’ai honte », avoua le buveur en baissant la tête. « Honte de quoi ? » s’informa le petit prince qui désirait le secourir. « Honte de boire ! »","","Antoine de Saint-Exupéry","Écrivain et aviateur, France, XXe s.","Le Petit Prince, chap. XII, 1943",0,"En quelques répliques, Saint-Exupéry dessine le cercle le mieux connu des cliniciens : la honte pousse à boire, et boire nourrit la honte. Le détail décisif est ailleurs : le petit prince « désirait le secourir », et le buveur s’enferme dans le silence. La honte isole précisément au moment où le lien pourrait rompre la boucle ; c’est pourquoi une parole sans jugement en est le premier antidote.","Quand la honte monte, interromps le cercle par le geste inverse : un message honnête à quelqu’un qui te veut du bien.",[1,5,11]],["10lannt",0,"Le récit unique crée des stéréotypes, et le problème des stéréotypes n’est pas qu’ils sont faux, mais qu’ils sont incomplets.","","Chimamanda Ngozi Adichie","Romancière, Nigeria","Conférence TED « The danger of a single story », 2009",0,"Adichie parle des récits sur l’Afrique, mais son analyse éclaire la stigmatisation des personnes dépendantes, réduites à l’image de l’ivrogne ou du toxicomane. Le stéréotype n’est pas mensonger, il est amputé : il efface l’histoire, les ressources, les liens, le rétablissement possible. Se raconter autrement que par ce récit unique est une étape discrète mais décisive pour sortir de la honte.","Écris trois phrases sur toi qui n’ont rien à voir avec l’alcool, et relis-les quand l’étiquette prend toute la place.",[2,5]],["1pat3q0",0,"À mon sens, ceux d’entre nous qui n’en ont jamais été victimes ont été épargnés davantage par l’absence d’appétit que par une quelconque supériorité intellectuelle ou morale sur ceux qui l’ont été.","In my judgment, such of us as have never fallen victims, have been spared more from the absence of appetite, than from any mental or moral superiority over those who have.","Abraham Lincoln","Avocat puis président des États-Unis, XIXe s.","Discours à la Washington Temperance Society, Springfield, 22 février 1842",0,"Jeune avocat, Lincoln s’adresse à une société de tempérance fondée par d’anciens buveurs et critique les sermons qui accablent les « ivrognes ». Son argument devance la science : la vulnérabilité à l’alcool est très inégalement répartie, et ceux qui n’en souffrent pas n’en tirent guère de mérite. Ce rappel désamorce le jugement des autres, et aussi celui qu’on porte sur soi en se croyant plus faible qu’autrui.","Quand tu te compares à ceux qui « savent boire », rappelle-toi que vous ne partez pas du même terrain.",[5,9,12]],["ge9i6c",0,"Il est temps de changer notre regard sur l’addiction : non pas comme un échec moral, mais comme une maladie chronique que nous devons aborder avec compétence, urgence et compassion.","","Vivek Murthy","Médecin, Surgeon General des États-Unis","Rapport Facing Addiction in America, 2016",0,"Le premier rapport fédéral américain consacré aux addictions adopte le langage de la santé publique : une maladie chronique, avec des rechutes possibles, comme pour l’asthme ou le diabète. Ce cadre change la lecture de la rechute, qui devient le signal d’ajuster le traitement plutôt qu’une preuve d’échec personnel. Il ne retire rien à l’engagement de la personne ; il retire la culpabilité qui l’empêche de demander de l’aide.","Si tu as rechuté, raisonne comme un soignant : qu’est-ce qui doit être ajusté dans mon plan ?",[2,4,6]],["nw62l7",0,"L’alcoolisme, c’est la perte de la liberté de s’abstenir de l’alcool.","","Pierre Fouquet","Médecin, pionnier de l’alcoologie, France, XXe s.","",0,"Pionnier français de l’alcoologie, Fouquet propose une définition qui ne repose ni sur les quantités ni sur l’ivresse, mais sur la liberté. On peut boire peu et l’avoir perdue, boire beaucoup un soir et la posséder encore. Cette approche fait de la sobriété une reconquête plutôt qu’une privation, et fournit un critère intime et honnête : suis-je libre de ne pas boire ce soir ?","Choisis une occasion habituelle de boire et observe sincèrement ce que t’inspire l’idée de t’abstenir.",[1,10]],["14538c2",0,"L’habitude de l’ivresse est une maladie de l’esprit.","The habit of drunkenness is a disease of the mind.","Thomas Trotter","Médecin de la Royal Navy, Écosse, XIXe s.","An Essay, Medical, Philosophical, and Chemical, on Drunkenness, 1804",0,"Médecin de marine confronté aux ravages du rhum à bord, Trotter est l’un des premiers à décrire l’ivrognerie habituelle comme une affection médicale plutôt qu’un vice. Le mot « habitude » est remarquable : il anticipe l’idée moderne d’un apprentissage qui s’inscrit dans le cerveau. Deux siècles avant les neurosciences, il ouvre la voie à un soin fondé sur la compréhension plutôt que sur le blâme.","Remplace aujourd’hui le mot « faiblesse » par « habitude apprise », et demande-toi quelle habitude nouvelle pourrait s’apprendre.",[8,10]],["17u6pg3",0,"La toxicomanie, c’est la rencontre d’un produit, d’une personnalité et d’un moment socioculturel.","","Claude Olievenstein","Psychiatre, fondateur du centre Marmottan, France","",0,"Le fondateur du centre Marmottan résume ainsi le modèle qui inspire encore l’addictologie : aucune des trois composantes ne suffit seule. Le produit n’explique pas tout, la personnalité non plus, et le contexte pèse autant que les deux. Cette triade a un intérêt pratique immédiat : si l’on ne change pas d’un coup sa personnalité, on peut agir sur l’accès au produit et sur le moment de vie.","Pour chacun des trois pôles, produit, toi, contexte, note un levier concret à actionner cette semaine.",[]],["1nq85qa",0,"La vie, telle qu’elle nous est imposée, est trop lourde pour nous ; elle nous apporte trop de douleurs, de déceptions, de tâches insolubles. Pour la supporter, nous ne pouvons nous passer de remèdes palliatifs.","","Sigmund Freud","Neurologue, fondateur de la psychanalyse, Autriche","Malaise dans la civilisation, chap. II, 1930",0,"Freud énumère ensuite ces palliatifs : les diversions, les satisfactions substitutives et les substances enivrantes. Son constat n’a rien de moralisateur : chacun a besoin d’adoucir le poids de l’existence. La question n’est donc pas de vivre sans aucun palliatif, mais de choisir ceux qui allègent sans asservir. C’est le travail concret des premiers mois sobres : reconstruire une palette de soulagements qui ne se retournent pas contre soi.","Dresse ta liste de palliatifs sobres pour les soirs lourds : bain, musique, série, appel, marche. Garde-la visible.",[12,8,10]],["1txlr1c",0,"L’avidité est un puits sans fond qui épuise la personne dans un effort sans fin pour satisfaire le besoin sans jamais atteindre la satisfaction.","","Erich Fromm","Psychanalyste et philosophe, Allemagne et États-Unis","La Peur de la liberté (Escape from Freedom), 1941",0,"Fromm décrit une logique que l’addictologie retrouve dans la tolérance : plus on obtient, moins l’objet satisfait, et plus il en faut. Le puits sans fond n’est pas un défaut de volonté ; c’est la structure même du désir compulsif, qui promet une satiété qu’il ne peut tenir. Comprendre ce mécanisme libère d’une illusion tenace : celle qu’une dernière dose, enfin, suffira.","Quand tu penses « juste un dernier », demande-toi quand le précédent « dernier » t’a vraiment rassasié.",[6,3,4]],["mwnbwr",0,"Après vingt ans passés à écouter les aspirations du cœur humain, je suis convaincu que tous les êtres humains ont un désir inné de Dieu.","","Gerald G. May","Psychiatre et auteur spirituel, États-Unis","Addiction and Grace, 1988",0,"Psychiatre, May prolonge l’intuition de Jung : l’addiction capte un désir fondamental et le fixe sur un objet incapable de le combler. Le mot « Dieu » peut se lire largement, comme désir de plénitude, de sens ou d’amour inconditionnel. Cette lecture évite deux pièges : réduire la dépendance à une faiblesse, ou croire que la volonté seule fera taire un désir aussi profond.","Demande-toi ce que tu désirais au plus profond le soir où tu as le plus bu : repos, amour, oubli ?",[3,1,2]],["mktnql",0,"Le smartphone est l’aiguille hypodermique des temps modernes, qui distribue de la dopamine numérique jour et nuit à une génération connectée.","","Anna Lembke","Psychiatre, spécialiste des addictions, États-Unis","Dopamine Nation, 2021",0,"Lembke élargit le regard : l’alcool n’est qu’un des produits d’une économie de la récompense immédiate. Après l’arrêt, beaucoup reportent la compulsion sur l’écran, le sucre ou les achats, sans voir le transfert. Son image n’accuse pas l’objet en soi ; elle rappelle que le circuit de la récompense ne distingue guère les sources de plaisir rapide, et que la sobriété gagne à être pensée globalement.","Observe si une autre compulsion a pris la place de l’alcool, et fixe-lui dès aujourd’hui une limite douce.",[4,10]],["1ktzv2",0,"La gratification instantanée prend trop de temps.","","Carrie Fisher","Actrice et écrivaine, États-Unis","Bons baisers d’Hollywood (Postcards from the Edge), 1987",0,"Fisher, qui a parlé sans fard de ses addictions et de son trouble bipolaire, condense en une boutade la temporalité du craving : même l’immédiat paraît trop lent. L’humour a ici une fonction thérapeutique, car rire de son impatience crée une distance avec elle. On y lit aussi l’enjeu du rétablissement : réapprendre à supporter le délai, là où l’envie exige tout, tout de suite.","La prochaine fois que l’envie presse, impose-toi vingt minutes de délai et observe ce qu’elle devient.",[2,11,12]],["19knxez",0,"Le mot tibétain est shenpa ; on le traduit d’ordinaire par « attachement », mais « être accroché » en serait une traduction plus parlante.","","Pema Chödrön","Nonne bouddhiste tibétaine, États-Unis","",0,"Pema Chödrön décrit ce moment presque physique où quelque chose nous saisit, avant même la pensée : une crispation, un besoin d’échapper. Cette description fine du craving est précieuse, car elle situe le point d’intervention très tôt, dans la sensation, bien avant le geste. Reconnaître l’hameçon sans le juger permet de ne pas mordre, ce que les approches de pleine conscience entraînent explicitement.","Quand tu sens l’hameçon, nomme-le à voix basse : « accroché ». Puis respire trois fois avant de bouger.",[2,8,10]],["1wioclv",0,"Quand être amoureuse signifie souffrir, c’est que nous aimons trop.","","Robin Norwood","Thérapeute conjugale et familiale, États-Unis","Ces femmes qui aiment trop (Women Who Love Too Much), 1985",0,"Thérapeute auprès de familles touchées par l’alcool, Norwood a remarqué que beaucoup de femmes ayant grandi près d’un parent alcoolique reproduisaient le même attachement douloureux dans leur couple. Elle décrit cette relation comme une dépendance à part entière, avec ses espoirs, ses rechutes et son déni. La phrase rappelle que sortir de l’alcool interroge souvent aussi nos liens, pas seulement le verre.","Repère une relation où l’attente de souffrir te semble normale, et parles-en à une personne neutre.",[2]],["njhd7p",0,"Le détachement ne consiste pas à se détacher de la personne qui nous est chère, mais de l’angoisse de l’implication.","","Melody Beattie","Autrice, figure de la codépendance, États-Unis","Vaincre la codépendance (Codependent No More), 1986",0,"Beattie, elle-même passée par l’alcool et la drogue, a popularisé la notion de codépendance pour décrire l’épuisement des proches. Le détachement qu’elle propose n’est pas un retrait affectif : c’est cesser de faire dépendre son propre équilibre des choix de l’autre. Pour le proche comme pour la personne en rétablissement, il permet d’aimer sans être englouti par la peur.","Choisis une inquiétude au sujet d’un proche dépendant et accorde-toi chaque jour une heure sans la ressasser.",[4,10]],["1brlji8",0,"Ne parle pas, ne fais pas confiance, ne ressens pas.","","Claudia Black","Psychologue, spécialiste des familles d’alcooliques, États-Unis","It Will Never Happen to Me, 1981",0,"Claudia Black résume ainsi les règles implicites des familles marquées par l’alcool : taire ce qui se passe, ne compter sur personne, éteindre ses émotions. Ces règles protègent l’enfant sur le moment, puis deviennent des pièges à l’âge adulte et préparent parfois sa propre dépendance. Les nommer aide à voir qu’elles ne sont pas des traits de caractère, mais des stratégies de survie apprises.","Laquelle des trois règles suis-tu encore ? Enfreins-la doucement cette semaine, une fois, avec une personne sûre.",[2,3,9]],["1b8c44z",0,"Les enfants adultes d’alcooliques devinent ce qu’est un comportement normal.","","Janet G. Woititz","Psychologue, États-Unis, XXe s.","Adult Children of Alcoholics, 1983",0,"Première des treize caractéristiques décrites par Woititz, la phrase a bouleversé des milliers de lecteurs qui se croyaient simplement maladroits. Grandir dans l’imprévisibilité prive de modèles stables : on improvise la normalité en observant les autres, avec un sentiment diffus d’imposture. Comprendre l’origine de ce tâtonnement permet de cesser de s’en vouloir et d’apprendre explicitement ce qui n’a pas été transmis.","Note une situation où tu « devines » comment te comporter, et demande à quelqu’un de confiance comment il la vit.",[12,3]],["9nyt33",0,"L’idée que l’effort créateur et les substances qui altèrent l’esprit sont liés est l’un des grands mythes pseudo-intellectuels de notre époque.","","Stephen King","Romancier, États-Unis","Écriture : mémoires d’un métier (On Writing), 2000",0,"King, qui a écrit plusieurs romans sous l’emprise de l’alcool et de la cocaïne avant de devenir sobre à la fin des années 1980, démonte une croyance qui retient beaucoup d’artistes : sans le produit, l’inspiration disparaîtrait. Il a continué à publier abondamment après l’arrêt. La crainte de perdre sa créativité est fréquente au début ; elle mérite d’être mise à l’épreuve plutôt que crue sur parole.","Si tu crains de perdre ta créativité, offre-lui trente minutes sobres cette semaine et observe ce qui vient.",[]],["o1v1eq",0,"Il finit par apparaître que plus le cliché des AA est niais, plus les crocs de la vérité qu’il recouvre sont acérés.","","David Foster Wallace","Romancier et essayiste, États-Unis","L’Infinie Comédie (Infinite Jest), 1996",0,"Wallace, qui a fréquenté les fraternités, décrit l’agacement des esprits cultivés face aux slogans : « un jour à la fois » sonne comme une carte postale. Son personnage découvre que la banalité de la formule est justement ce qui la rend utilisable en pleine crise, quand l’intelligence brillante devient l’alliée de la rechute. La complexité peut servir le déni ; la simplicité, parfois, le désarme.","Choisis le slogan qui t’agace le plus et applique-le à la lettre pendant une journée, pour voir.",[1,2,12]],["1n5410v",0,"Je suis plus fier d’avoir arrêté de boire que de n’importe quoi d’autre dans ma vie.","","Raymond Carver","Nouvelliste et poète, États-Unis, XXe s.","Entretien, The Paris Review, 1983",0,"Carver, maître de la nouvelle américaine, a cessé de boire en 1977 après des années de dérive, et a écrit ensuite une grande partie de son œuvre la plus reconnue. Qu’un écrivain place sa sobriété au-dessus de ses livres dit beaucoup de ce qu’elle lui a coûté et rendu. La phrase autorise aussi une fierté légitime, que la honte refuse souvent aux personnes en rétablissement.","Écris ce dont tu es fier dans ta sobriété, même si elle ne compte encore que quelques jours.",[5]],["1mnoh1e",0,"La meilleure chose chez moi, c’est que si un alcoolique vient me demander de l’aider à arrêter de boire, je peux lui répondre : « Oui, je sais comment faire. »","","Matthew Perry","Acteur, Canada et États-Unis","",0,"Perry, connu dans le monde entier pour une série comique, plaçait au-dessus de sa célébrité sa capacité à aider d’autres personnes dépendantes. L’idée rejoint la Douzième Étape et le principe dit de l’aidant-aidé : soutenir quelqu’un consolide aussi celui qui soutient. Son parcours, fait de longues luttes, rappelle que cette compétence se transmet même quand on reste soi-même vulnérable.","Partage une chose qui t’aide dans ta sobriété avec quelqu’un qui commence : ton expérience a de la valeur.",[12,5,7]],["1ee6xnv",0,"Il peut bien ne pas la compter, et un Ciel bienveillant peut ne pas la compter non plus ; elle n’en est pas moins comptée.","He may not count it, and a kind Heaven may not count it; but it is being counted none the less.","William James","Psychologue et philosophe, États-Unis, XIXe s.","Principes de psychologie, chap. IV « L’habitude », 1890",0,"James commente le personnage de Rip Van Winkle, qui excuse chaque nouveau verre d’un « cette fois, je ne compte pas ». Le psychologue rappelle que le système nerveux, lui, enregistre tout : chaque répétition creuse le sillon. La leçon vaut dans les deux sens, ce qu’on oublie souvent : chaque soirée sobre est elle aussi comptée, et c’est leur accumulation qui dessine une habitude nouvelle.","Méfie-toi de la phrase « ça ne compte pas » ; et compte, toi, chaque jour sobre comme un sillon nouveau.",[10,2,9]],["l2llhp",0,"Je pense que la cigarette a une saveur plus intense quand c’est la dernière.","","Italo Svevo","Romancier, Trieste, Italie, XXe s.","La Conscience de Zeno, 1923",0,"Le héros de Svevo couvre murs et livres de dates de « dernière cigarette », et chaque résolution devient le prétexte d’une nouvelle cérémonie. Le romancier saisit avec ironie un piège bien connu : la promesse d’arrêter demain rend le produit d’aujourd’hui plus désirable. La dernière fois sacralisée entretient la dépendance ; un arrêt banal, sans adieu solennel, la nourrit moins.","Ne prépare pas de « dernier verre » d’adieu : choisis une date d’arrêt ordinaire et tiens-la sans cérémonie.",[2,3,6]],["1qbwoql",0,"Chaque jour le seau descend au puits ; un jour, le fond lâchera.","","Proverbe jamaïcain","Sagesse populaire, Jamaïque","",1,"Le proverbe parle des prises de risque répétées qui semblent sans conséquence parce qu’elles n’en ont pas encore eu. C’est l’illusion que crée chaque soirée « qui s’est bien passée » : l’absence d’accident passé est prise pour une sécurité future. En addictologie, cette lecture sélective du passé alimente le déni, alors que le risque s’accumule silencieusement à chaque descente.","Liste les fois où « ça aurait pu mal tourner » : elles comptent autant que celles qui ont mal tourné.",[10,2,3]],["14mcrf",0,"Ce qu’on veut, on ne l’obtient pas ; ce qu’on obtient, on n’en veut plus.","","Proverbe jamaïcain","Sagesse populaire, Jamaïque","",1,"Sous sa forme chantante en créole, le proverbe décrit une structure que la recherche sur le désir a précisée : vouloir et apprécier ne relèvent pas exactement des mêmes circuits cérébraux. Dans l’addiction, l’envie s’emballe pendant que le plaisir réel diminue ; on désire intensément ce qui, obtenu, déçoit. Repérer cet écart entre l’attente et le vécu affaiblit peu à peu la promesse du produit.","Après une envie, note sur 10 combien tu la désirais, puis combien tu as réellement apprécié ce que tu as fait.",[]],["1nv0h6r",0,"Ne crois pas que celui qui porte une cicatrice est guéri.","","Proverbe swahili","Sagesse populaire, Afrique de l’Est","",1,"Le proverbe met en garde contre une guérison jugée sur les apparences : la peau refermée peut cacher une sensibilité intacte. Pour la sobriété, il dit deux choses. Aux proches, que des mois d’abstinence n’effacent pas la vulnérabilité, ce qui appelle du tact plutôt que la tentation. À soi-même, que se sentir solide n’autorise pas à baisser toute garde : la cicatrice demande encore des égards.","Même après des mois sobres, garde une règle de prudence simple, comme quitter une soirée dès qu’elle te pèse.",[5,10]],["lh2bg",0,"Le bâton qui est loin ne tue pas le serpent.","","Proverbe swahili","Sagesse populaire, Afrique de l’Est","",1,"Le proverbe rappelle qu’une ressource inaccessible au moment critique ne sert à rien. Le craving dure souvent quelques minutes intenses, pendant lesquelles on n’a ni le temps ni la clarté de chercher de l’aide : elle doit déjà être à portée de main. Les plans de prévention de la rechute reposent sur ce principe : numéros enregistrés, stratégies écrites, lieux sûrs repérés d’avance.","Mets aujourd’hui ton « bâton » à portée de main : un numéro en favori, une liste d’actions dans ton téléphone.",[8,10]],["3kswve",0,"Une fois passé la gorge, on oublie la brûlure.","","Proverbe japonais","Sagesse populaire, Japon","",1,"Le proverbe japonais décrit l’oubli rapide d’une souffrance dès qu’elle a cessé, comme la boisson brûlante qu’on ne sent plus une fois avalée. En sobriété, ce mécanisme est un piège classique : quelques mois après l’arrêt, la mémoire adoucit les lendemains et ravive les bons moments. Garder une trace concrète de ce qu’on a vécu protège de cette amnésie confortable.","Écris aujourd’hui, à chaud, trois souvenirs précis qui t’ont décidé à arrêter, et range-les où tu les retrouveras.",[2,10]],["mkg2mb",0,"Demande à celui qui a l’expérience, et non à celui qui a la sagesse.","","Proverbe arabe","Sagesse populaire, monde arabe","",1,"Le proverbe valorise le savoir vécu plus que le savoir théorique, intuition au cœur des groupes d’entraide et de la pair-aidance. Celui qui a traversé le sevrage, les premières fêtes sobres ou une rechute sait des choses qu’aucun manuel n’enseigne. Nuance utile : l’expérience d’un pair complète l’avis médical sans le remplacer, notamment pour tout ce qui touche au sevrage.","Trouve une personne sobre depuis plus longtemps que toi et pose-lui une question précise sur ce que tu traverses.",[12]],["440gmm",0,"Même si tu sais mille choses, consulte celui qui en sait une.","","Proverbe turc","Sagesse populaire, Turquie","",1,"Le proverbe turc vise un orgueil subtil, celui des esprits compétents qui croient pouvoir tout résoudre seuls. Les personnes dépendantes brillantes sont souvent celles qui tardent le plus à demander de l’aide, persuadées de trouver un jour la solution par elles-mêmes. Consulter n’est pas avouer son ignorance : c’est reconnaître qu’on ne voit jamais bien sa propre situation de l’intérieur.","Choisis une question sur ta sobriété que tu ressasses seul, et pose-la cette semaine à un soignant ou à un pair.",[7,5,8]],["qdx25h",0,"Dis-moi qui tu fréquentes, je te dirai qui tu es.","Dime con quién andas y te diré quién eres.","Proverbe espagnol","Sagesse populaire, monde hispanique","",1,"Le proverbe, connu dans tout le monde hispanique, n’est pas qu’un avertissement moral : il décrit l’influence réelle de l’entourage sur les habitudes. Une sobriété naissante supporte mal les cercles où l’alcool sert de ciment principal. Il ne s’agit pas de renier ses amis, mais d’observer quelles relations survivent sans le verre, et d’en construire de nouvelles où la sobriété va de soi.","Classe tes relations en trois colonnes : soutiennent ma sobriété, neutres, la fragilisent. Vois plus souvent la première.",[]],["1khwm9",0,"La miséricorde appartient à Dieu, l’action appartient à l’homme.","Nasa Diyos ang awa, nasa tao ang gawa.","Proverbe philippin","Sagesse populaire tagalog, Philippines","",1,"Le proverbe tagalog articule confiance et responsabilité, dans un esprit proche de la Troisième Étape des AA. On peut espérer une aide qui nous dépasse, spirituelle, médicale ou humaine, tout en sachant qu’elle ne dispense pas des gestes quotidiens. Cette double posture protège à la fois de l’orgueil de tout porter seul et de la passivité de celui qui attend d’être sauvé.","Écris une chose que tu confies à plus grand que toi, et une action concrète que tu accomplis toi-même aujourd’hui.",[3,10,2]],["1yeix3k",0,"La merveilleuse vérité, c’est qu’il n’y a rien à abandonner.","","Allen Carr","Spécialiste du sevrage tabagique, Royaume-Uni","La Méthode simple pour en finir avec la cigarette, 1985",0,"Carr a bâti sa méthode sur un recadrage : le produit ne procure pas un plaisir que l’on sacrifie, il soulage surtout le manque qu’il a lui-même créé. Si l’on ne renonce à rien, il n’y a pas de deuil héroïque à porter, seulement une illusion à dissiper. L’idée parle à beaucoup ; elle ne doit pas faire oublier que, pour l’alcool, le sevrage physique peut exiger un suivi médical.","Note ce que tu crois « perdre » en arrêtant, puis vérifie pour chaque point si l’alcool te le donnait vraiment.",[12,1,3]],["g48hqn",0,"Nous avons transformé le monde, d’un lieu de pénurie en un lieu d’abondance écrasante.","","Anna Lembke","Psychiatre, spécialiste des addictions, États-Unis","Dopamine Nation, 2021",0,"Lembke rappelle que notre cerveau s’est formé dans un environnement où la récompense était rare et coûteuse. L’offre permanente de produits, d’écrans et de sollicitations le déséquilibre, et chacun devient plus vulnérable aux compulsions. Cette lecture déculpabilise sans déresponsabiliser : la difficulté à s’arrêter n’est pas une tare individuelle, mais elle appelle des stratégies délibérées, comme limiter l’accès.","Réduis l’abondance autour de toi : pas d’alcool à la maison, des trajets qui évitent tes points de vente habituels.",[5,6]],["o9ot5l",0,"L’addiction est une adaptation. Ce n’est pas toi, c’est ta cage.","","Johann Hari","Journaliste et essayiste, Royaume-Uni","Conférence TED « Everything you think you know about addiction is wrong », 2015",0,"Hari tire cette formule des expériences du « Rat Park » : enfermés seuls, les rats consomment l’eau droguée ; dans un environnement riche et social, ils la délaissent. La phrase déplace le regard de la faute vers le contexte, ce qui soulage la honte. Elle a sa limite : chez l’humain, changer de cage ne suffit pas toujours, et l’on reste acteur de sa sortie, même quand le décor pèse lourd.","Identifie un barreau de ta « cage » (isolement, ennui, stress) et un petit geste pour l’écarter cette semaine.",[2,4,5]],["14og5jy",0,"L’addiction, c’est tout comportement dont une personne a un besoin impérieux, où elle trouve un soulagement ou un plaisir passager, mais qui entraîne des conséquences négatives et qu’elle a pourtant du mal à abandonner.","","Gabor Maté","Médecin spécialiste des addictions, Canada","In the Realm of Hungry Ghosts, 2008",0,"La définition de Maté a deux mérites. Elle ne se limite pas aux substances et reconnaît les addictions au travail, aux écrans ou aux achats, que l’on développe parfois après l’arrêt de l’alcool. Surtout, elle place au centre la difficulté à renoncer malgré les dommages, plutôt que la quantité ou la fréquence : un critère utile pour s’évaluer sans se comparer aux autres.","Passe un comportement actuel au crible des quatre critères : besoin, soulagement, conséquences, difficulté à arrêter.",[12,2,3]],["13lggo3",0,"Mon défaut fondamental avait toujours été la dépendance, une dépendance presque absolue, envers les gens ou les circonstances pour m’apporter prestige, sécurité et le reste.","","Bill W. (William Wilson)","Cofondateur des Alcooliques anonymes, États-Unis","« The Next Frontier: Emotional Sobriety », AA Grapevine, janvier 1958",0,"Bill W. découvre, bien après son dernier verre, que l’alcool n’était que la forme la plus visible d’une dépendance plus large : attendre des autres et des événements qu’ils garantissent sa valeur et sa sécurité. Ce diagnostic rejoint ce que décrivent aujourd’hui les approches centrées sur l’estime de soi et l’attachement. La sobriété durable passe aussi par une sécurité intérieure moins suspendue au dehors.","Repère une attente que tu fais peser sur quelqu’un pour te sentir en sécurité, et cherche à y répondre toi-même.",[12,4,6]],["ruab74",0,"Le message fondamental et premier des Alcooliques anonymes à leurs membres est qu’ils ne sont pas infinis, pas absolus, pas Dieu.","","Ernest Kurtz","Historien des Alcooliques anonymes, États-Unis","Not-God: A History of Alcoholics Anonymous, 1979",0,"L’historien Ernest Kurtz voit dans l’acceptation de la finitude le cœur du programme : on cesse de vouloir tout contrôler, y compris son propre esprit. Cette humilité n’a rien d’humiliant ; elle soulage d’une exigence de toute-puissance épuisante, que l’alcool servait souvent à soutenir ou à anesthésier. Reconnaître ses limites devient la condition pour demander de l’aide et la recevoir.","Liste trois choses que tu cherches à contrôler et qui ne dépendent pas de toi, puis lâches-en une aujourd’hui.",[7,8,10]],["1y84nfg",0,"Toute chose est difficile au commencement.","","Proverbe chinois","Sagesse populaire, Chine","",1,"Le proverbe chinois rassure autant qu’il prévient : la difficulté des premiers jours n’est pas un indice d’échec, mais la caractéristique même du début. Pour l’alcool, ce début cumule inconfort physique, habitudes privées de leur support et émotions qui reviennent à vif. Savoir que l’effort est maximal au départ aide à ne pas étendre la pénibilité d’aujourd’hui à toute la vie sobre.","Chaque soir de la première semaine, répète-toi : « C’est le début, donc c’est dur. Ce ne sera pas toujours ainsi. »",[10]],["1b1l91x",0,"Celui qui pose des questions ne perd jamais son chemin.","","Proverbe igbo","Sagesse populaire, Nigeria","",1,"Dans la culture igbo, poser des questions est une marque d’intelligence plutôt que d’ignorance. Le proverbe s’applique directement à la sobriété débutante, où l’on hésite à interroger soignants et pairs par peur de paraître faible ou de déranger. Chaque question posée réduit l’incertitude ; or l’incertitude, source d’anxiété, figure parmi les déclencheurs fréquents de l’envie de boire.","Écris trois questions que tu n’oses pas poser sur ton rétablissement, et pose la première cette semaine.",[4,5]],["1vio1vz",0,"Le grand point, dans toute éducation, est de faire de notre système nerveux notre allié plutôt que notre ennemi.","The great thing, then, in all education, is to make our nervous system our ally instead of our enemy.","William James","Psychologue et philosophe, États-Unis, XIXe s.","Principes de psychologie, chap. IV « L’habitude », 1890",0,"James considère l’habitude comme une économie : ce que l’on répète finit par se faire sans effort, pour le meilleur comme pour le pire. Le cerveau qui réclamait l’alcool peut, avec le temps, automatiser d’autres routines du soir. Cette perspective donne un sens aux semaines difficiles : chaque répétition sobre rend la suivante moins coûteuse, jusqu’à ce que le système nerveux change de camp.","Choisis une routine de remplacement pour ton heure à risque et répète-la chaque jour, à l’identique, pendant un mois.",[10,12]],["ara17n",0,"Si vous voulez gagner un homme à votre cause, convainquez-le d’abord que vous êtes son ami sincère.","If you would win a man to your cause, first convince him that you are his sincere friend.","Abraham Lincoln","Avocat puis président des États-Unis, XIXe s.","Discours à la Washington Temperance Society, Springfield, 22 février 1842",0,"Dans ce même discours, Lincoln reproche aux militants de la tempérance leurs sermons accusateurs, qui braquent ceux qu’ils prétendent sauver. Son conseil devance de plus d’un siècle l’entretien motivationnel, selon lequel la confrontation renforce la résistance au changement. Pour les proches, la leçon est nette : la relation de confiance précède toute parole utile sur la consommation.","Si tu t’inquiètes pour un proche, commence par une conversation sans reproche, centrée sur ce que tu ressens pour lui.",[3,6]],["lvn7ud",0,"Aucune tâche n’est trop lourde quand on la porte ensemble.","ʻAʻohe hana nui ke alu ʻia.","Proverbe hawaïen","Sagesse populaire, Hawaï","Recueilli par Mary Kawena Pukui, ʻŌlelo Noʻeau, 1983",1,"Le proverbe, recueilli par l’ethnologue hawaïenne Mary Kawena Pukui, exprime une éthique communautaire où l’effort partagé change la nature même de la tâche. La sobriété tenue seule ressemble souvent à un poids insoutenable ; la même abstinence, vécue en groupe ou en binôme, devient une entreprise commune. Ce n’est pas la difficulté qui diminue, c’est la manière de la porter.","Propose à une personne de confiance un rendez-vous de soutien fixe, même bref, pour les trois prochains mois.",[12,3]],["sjurdc",0,"Ce qu’on aurait pu arrêter avec une houe, on finit par devoir l’arrêter avec une bêche.","","Proverbe coréen","Sagesse populaire, Corée","",1,"Le proverbe coréen évoque un filet d’eau qu’un coup de houe suffit à détourner et qui, négligé, exige plus tard une bêche et bien plus d’efforts. Appliqué à la sobriété, il plaide pour une réponse rapide aux premiers signaux : un verre isolé, des pensées qui reviennent, des routines qui se relâchent. Agir tôt n’est pas dramatiser ; c’est choisir le plus petit effort possible.","Définis à l’avance tes petits signaux d’alerte, et l’action simple que chacun doit déclencher.",[2]],["yfcnvz",0,"La marmite qui doit cuire le piment aura le fond brûlant.","","Proverbe yoruba","Sagesse populaire, Nigeria et Bénin","",1,"Le proverbe yoruba rappelle que toute transformation a un coût d’inconfort, comme la marmite qui chauffe pour que le plat existe. Les premières semaines sobres apportent souvent sommeil perturbé, irritabilité et émotions à vif : ce n’est pas le signe que la sobriété ne convient pas, mais celui d’un organisme qui se réajuste. Cet inconfort se surveille, avec un médecin si besoin, sans se confondre avec l’échec.","Note chaque soir un inconfort de l’arrêt et un signe d’amélioration, même minime, pour voir la courbe se dessiner.",[6,10]],["1xhs1t5",0,"Quand un homme s’est enivré, il est conduit par un jeune enfant ; il trébuche, ne sait plus où il va, car il a l’âme humide.","","Héraclite","Philosophe présocratique, Éphèse, VIe-Ve s. av. J.-C.","Fragment B 117 (Diels-Kranz)",0,"Pour Héraclite, l’âme la plus sage est « sèche », lumineuse comme le feu ; l’ivresse la détrempe et éteint ce qui guide. L’image est cruelle mais exacte : l’adulte perd jusqu’à sa direction et doit être reconduit par un enfant, renversement de l’ordre ordinaire. Le fragment ne juge pas la personne, il décrit une perte de gouvernail, ce que l’on rattache aujourd’hui à la mise hors jeu des fonctions exécutives.","Avant une soirée à risque, décide toi-même de ton heure et de ton moyen de retour, tant que tu tiens la barre.",[10,5]],["gdqmig",0,"La vigne porte trois grappes : la première de plaisir, la deuxième d’ivresse, la troisième de dégoût.","","Anacharsis","Sage scythe, VIe s. av. J.-C.","Rapporté par Diogène Laërce, Vies et doctrines des philosophes illustres, I, 103",0,"Selon Diogène Laërce, ce prince venu des steppes, observateur étranger des banquets grecs, résumait ainsi la courbe d’une soirée. La première grappe tient sa promesse, la deuxième la dépasse, la troisième la trahit. Le psychologue Richard Solomon a décrit une dynamique voisine, le processus opposant : à chaque effet agréable répond une contre-réaction pénible, qui s’amplifie avec la répétition. Le piège consiste à ne se souvenir que de la première grappe.","Raconte-toi ta dernière consommation jusqu’à la troisième grappe : le lendemain, l’humeur, ce que tu aurais voulu éviter.",[7,10]],["1vcozf7",0,"La partie de l’âme des insensés où logent les désirs, ce qu’elle a d’intempérant et de non étanche, il l’a comparée à une jarre percée, à cause de son insatiabilité.","","Platon","Philosophe, Athènes, Ve-IVe s. av. J.-C.","Gorgias, 493a-b",0,"Socrate rapporte l’image d’un sage pour répondre à Calliclès, qui fait l’éloge des désirs sans frein. La jarre percée dit l’essentiel de la tolérance : plus on verse, moins il en reste, et l’effort pour remplir devient le travail même de la vie. Platon ne reproche pas d’avoir soif ; il invite à réparer le récipient, c’est-à-dire à bâtir un rapport au désir qui permette enfin de garder ce que l’on reçoit.","Compare ce qui te reste le lendemain d’une soirée arrosée et ce qui te reste d’une journée sobre réussie.",[5,9,10]],["1rkh2z7",0,"L’incontinent ressemble à une cité qui vote tous les décrets qu’il faut et possède de bonnes lois, mais qui ne s’en sert en rien.","","Aristote","Philosophe, Grèce, IVe s. av. J.-C.","Éthique à Nicomaque, VII, 10, 1152a",0,"Aristote distingue l’akrasia, la faiblesse de la volonté, du vice : l’incontinent sait ce qui est bon et le veut, mais l’impulsion l’emporte au moment d’agir. La comparaison politique est déculpabilisante : le problème n’est pas l’absence de bonnes résolutions, c’est leur application. D’où l’intérêt des intentions de mise en œuvre, formulées en « si… alors… », qui transforment une loi votée en geste presque automatique.","Change une résolution en règle : « Si l’envie arrive le soir, alors je sors marcher ou j’appelle quelqu’un. »",[6,2,3]],["1syxfkh",0,"Chez l’insensé, le désir de l’agréable est insatiable et surgit de partout ; et l’exercice du désir accroît la force qui lui est innée.","","Aristote","Philosophe, Grèce, IVe s. av. J.-C.","Éthique à Nicomaque, III, 12, 1119b",0,"Aristote formule en une phrase ce que la théorie de la sensibilisation décrit aujourd’hui : chaque passage à l’acte renforce l’élan qui y mène, et les déclencheurs se multiplient, « de partout ». La conséquence est double. Céder ne soulage pas durablement, cela entraîne ; mais chaque envie traversée sans réponse affaiblit un peu le circuit. L’habitude que l’on nourrit grandit, celle que l’on prive finit par s’étioler.","Chaque fois qu’une envie passe sans que tu y cèdes, trace un trait : c’est un exercice dans l’autre sens.",[2,10]],["1r525gl",0,"Ce ne sont pas les beuveries et les fêtes ininterrompues […] qui engendrent la vie agréable, mais le raisonnement sobre, qui recherche les causes de tout choix et de tout refus.","","Épicure","Philosophe, Athènes, IVe-IIIe s. av. J.-C.","Lettre à Ménécée, 132",0,"On fait souvent d’Épicure un apôtre de la fête ; il affirme l’inverse. Le maître du plaisir place le bonheur dans un « raisonnement sobre », nêphôn logismos, littéralement une pensée à jeun. Le plaisir véritable est pour lui l’absence de trouble du corps et de l’âme, et chaque désir doit passer par un examen lucide de ses suites. La sobriété n’y est pas une privation : c’est la condition pour jouir vraiment.","Avant d’accepter une sortie, demande-toi : « Qu’est-ce qui, ce soir, rendrait vraiment ma vie agréable ? »",[10,2]],["10umb0r",0,"À tout désir il faut poser cette question : que m’arrivera-t-il si s’accomplit ce que je cherche par le désir, et que m’arrivera-t-il s’il ne s’accomplit pas ?","","Épicure","Philosophe, Athènes, IVe-IIIe s. av. J.-C.","Sentences vaticanes, 71",0,"Épicure propose un outil plutôt qu’une morale : interroger le désir au lieu de lui obéir ou de le combattre. La première question oblige à dérouler la scène au-delà de l’instant, ce que les soignants en addictologie appellent « dérouler le film » jusqu’au bout. La seconde évalue l’autre branche : souvent, ne pas satisfaire l’envie coûte bien moins qu’elle ne le prétend. Questionné, le désir perd une part de son urgence.","Quand l’envie surgit, écris les deux réponses d’Épicure côte à côte avant de décider quoi que ce soit.",[6,11]],["h3qc8y",0,"Lorsque tu reçois l’image d’un plaisir, garde-toi, comme pour les autres représentations, de te laisser emporter par elle ; que la chose t’attende, et accorde-toi quelque délai.","","Épictète","Philosophe stoïcien, ancien esclave, Ier-IIe s.","Manuel, 34",0,"Le stoïcien ne demande pas d’effacer l’image du plaisir, mais de ne pas s’y laisser « emporter » : entre la représentation et l’assentiment, il glisse un délai. La suite du passage invite à se figurer deux moments, la jouissance puis le regret. C’est l’intuition de la technique dite du surf sur l’envie, popularisée par Alan Marlatt : une envie monte, culmine puis reflue si l’on ne la nourrit pas. Le temps travaille pour qui attend.","Quand l’envie arrive, règle un minuteur sur vingt minutes et ne décide qu’à la sonnerie.",[12,3,11]],["19yeaud",0,"Ce n’est pas en comblant ses désirs qu’on se procure la liberté, mais en démontant le désir.","","Épictète","Philosophe stoïcien, ancien esclave, Ier-IIe s.","Entretiens, IV, 1, 175",0,"Le premier chapitre du livre IV des Entretiens est un long traité sur la liberté, prononcé par un homme qui avait été esclave. Épictète y renverse l’idée commune : celui qui obtient tout ce qu’il veut dépend de chaque objet convoité, il n’est donc pas libre. Le mot grec, anaskeuê, évoque un démontage plutôt qu’une répression : comprendre pièce à pièce ce qui fabrique l’envie, jusqu’à ce qu’elle ne tienne plus debout.","Démonte une envie récente : déclencheur, pensée, promesse, résultat réel. Quel rouage peux-tu retirer cette semaine ?",[]],["1cjmzn8",0,"L’ivresse ne crée pas les vices, elle les met au jour.","Non facit ebrietas vitia, sed protrahit.","Sénèque","Philosophe stoïcien, Rome, Ier s.","Lettres à Lucilius, 83, 19",0,"Dans la lettre 83, Sénèque démonte l’excuse « ce n’était pas moi, c’était l’alcool ». L’ivresse ne fabrique ni la colère, ni la tristesse, ni le besoin d’être aimé : elle lève le couvercle. La phrase a deux tranchants. Elle responsabilise, mais surtout elle renseigne : ce qui sort quand on boit indique ce qui attend, à jeun, d’être entendu et soigné autrement.","Liste ce qui sortait de toi quand tu buvais (colère, larmes, tendresse) et choisis un lieu sobre pour l’exprimer.",[4,8,9]],["1d4qgqv",0,"Ils servent leurs plaisirs, ils n’en jouissent pas ; et, ce qui est le comble du malheur, ils aiment même leurs maux.","Serviunt ergo voluptatibus, non fruuntur, et mala sua, quod malorum ultimum est, et amant.","Sénèque","Philosophe stoïcien, Rome, Ier s.","Lettres à Lucilius, 39, 6",0,"Sénèque parle de ceux pour qui le superflu est devenu nécessaire : le plaisir s’est mué en service. Les neurosciences de l’addiction disent à peu près la même chose en distinguant « vouloir » et « aimer », selon les travaux de Kent Berridge : avec la répétition, l’envie peut grandir pendant que le plaisir s’use. Aimer ses maux n’est pas une faute morale, c’est un attachement à ce qui blesse, à regarder sans mépris pour s’en défaire.","Note de 0 à 10 l’envie avant de consommer, puis le plaisir vraiment ressenti. Compare les deux colonnes sur une semaine.",[8,4,12]],["vvgsjl",0,"Ce Falerne n’est qu’un peu de jus de raisin, et cette robe de pourpre, des poils de brebis trempés dans le sang d’un coquillage.","","Marc Aurèle","Empereur romain, philosophe stoïcien, IIe s.","Pensées, VI, 13",0,"Marc Aurèle pratique ce que les stoïciens appelaient la définition physique : décrire une chose dans sa matière nue pour la dépouiller du prestige qu’on lui prête. Le grand cru de Campanie redevient du jus fermenté, la pourpre impériale de la laine teinte. L’exercice ne nie pas le goût ; il défait le halo social, publicitaire ou nostalgique qui transforme une boisson en promesse. Une envie faiblit quand on cesse de l’enjoliver.","Décris ta boisson favorite en termes purement matériels, sans un seul adjectif flatteur, et observe ce que devient l’envie.",[6]],["1wao5ku",0,"Efface la représentation ; arrête l’élan ; éteins le désir ; garde en ton pouvoir ta faculté directrice.","","Marc Aurèle","Empereur romain, philosophe stoïcien, IIe s.","Pensées, IX, 7",0,"Quatre verbes, quatre temps d’une même séquence que les thérapies cognitives décrivent à leur manière : l’image qui surgit, l’élan qui pousse, le désir qui s’installe, puis l’instance qui décide. Marc Aurèle suggère qu’on peut intervenir à chaque étape et que l’effort est moindre quand on agit tôt. L’hêgemonikon, la « faculté directrice », n’est pas une volonté de fer : c’est la part de soi qui choisit, et qu’on peut toujours reprendre.","La prochaine fois, repère à quelle étape tu te trouves (image, élan, désir) et agis précisément à celle-là.",[2,3,5]],["zrb67b",0,"Résiste dès le début : le remède arrive trop tard quand le mal s’est fortifié par de longs délais.","Principiis obsta; sero medicina paratur, cum mala per longas convaluere moras.","Ovide","Poète latin, Rome, Ier s. av.-Ier s.","Les Remèdes à l’amour, v. 91-92",0,"Ovide écrit un manuel pour se déprendre d’une passion amoureuse, et ses conseils valent pour toute dépendance. L’idée est mécanique : une envie se combat d’autant mieux qu’elle est jeune, avant que l’habitude n’ait creusé son lit. Elle ne signifie pas qu’il soit trop tard ensuite ; le poète consacre d’ailleurs tout son livre à ceux qui sont déjà pris. Elle indique seulement où l’effort rapporte le plus.","Identifie le tout premier signe de ton envie (une heure, une pensée, un lieu) et prépare une réponse pour lui.",[9]],["102d4m0",0,"De la volonté pervertie est né le désir ; en servant le désir, l’habitude ; et l’habitude à laquelle on ne résiste pas est devenue nécessité.","Quippe ex voluntate perversa facta est libido, et dum servitur libidini, facta est consuetudo, et dum consuetudini non resistitur, facta est necessitas.","Augustin d’Hippone","Évêque et philosophe, Afrique romaine, IVe-Ve s.","Confessions, VIII, 5, 10",0,"Né à Thagaste, dans l’actuelle Algérie, Augustin décrit son propre enchaînement avec une précision clinique : désir, habitude, nécessité, trois maillons qu’il appelle lui-même une « chaîne ». La force du passage tient à ce qu’il est écrit de l’intérieur, par quelqu’un qui voulait changer et n’y parvenait pas. Il montre aussi que la nécessité n’est pas un point de départ : elle s’est construite, et ce qui s’est construit peut se défaire, maillon par maillon.","Dessine ta propre chaîne et cherche quel maillon, aujourd’hui, est encore assez léger pour être soulevé.",[6,2,3]],["sp2m9c",0,"Ne regarde pas le vin qui paraît d’un beau rouge, qui fait des perles dans la coupe, et qui coule aisément. Il finit par mordre comme un serpent, et par piquer comme un basilic.","","Livre des Proverbes","Sagesse biblique, Israël antique","Proverbes 23, 31-32 (trad. Segond)",1,"Le sage biblique ne s’attarde pas sur l’ivresse elle-même mais sur le regard : la couleur, les perles, la fluidité, tout ce qui précède la première gorgée. C’est une description étonnamment moderne de la réactivité aux indices, ces signaux qui déclenchent l’envie avant toute consommation. La morsure arrive plus tard, différée, ce qui explique pourquoi l’attrait gagne si souvent : il est immédiat, alors que la douleur se fait attendre.","Repère trois indices visuels qui réveillent ton envie (étiquette, terrasse, verre à pied) et retire-en un de ton quotidien.",[4,10]],["a2vqh7",0,"On m’a frappé, je n’ai point de mal ! On m’a battu, je ne sens rien ! Quand me réveillerai-je ? J’en veux encore.","","Livre des Proverbes","Sagesse biblique, Israël antique","Proverbes 23, 35 (trad. Segond)",1,"Il y a plus de deux mille ans, un sage d’Israël a saisi la perte de contrôle mieux que bien des traités : à peine éveillé, déjà la demande de recommencer. Le verset décrit l’anesthésie, puis la contradiction intime de celui qui veut se réveiller et réclame pourtant la suite. Aucune leçon de morale, seulement une voix intérieure rendue audible. S’y reconnaître n’a rien d’humiliant : c’est souvent le début de la lucidité.","Écris ta propre version de ce verset, avec tes mots, et relis-la au prochain réveil difficile.",[1,7,8]],["1i5szni",0,"Ne vous enivrez pas de vin, où l’on se perd ; soyez plutôt remplis de l’Esprit.","","Épître aux Éphésiens","Lettre du Nouveau Testament, Ier s.","Éphésiens 5, 18",1,"Le mot grec asôtia désigne littéralement l’état de « celui qui ne se sauve pas », qui se dilapide. Le verset oppose deux façons d’être rempli : par un produit qui disperse, ou par un souffle qui rassemble. Jung reprendra l’intuition dans sa formule spiritus contra spiritum. On peut l’entendre sans adhésion religieuse : sortir d’une dépendance suppose rarement de vivre dans le vide, mais de trouver une autre plénitude, faite de lien, de sens et de présence.","Cherche ce qui, cette semaine, t’a rempli sans rien te coûter le lendemain, et prévois-en une seconde dose.",[11]],["yz5vra",0,"Le mauvais penchant ressemble d’abord à un fil d’araignée, et à la fin à des cordes de charrette.","","Talmud de Babylone","Tradition rabbinique, Mésopotamie, IIIe-VIe s.","Soukka 52a (enseignement de Rav Assi)",1,"Rav Assi commente un verset d’Isaïe et résume en une image la progression de toute dépendance : au début, le lien est si fin qu’on ne le sent pas, et c’est justement ce qui le rend dangereux. La tradition juive ne fait pas du yetser hara un démon extérieur, mais une pulsion humaine à canaliser. L’image contient aussi un espoir discret : ce qui s’est tressé fil après fil peut se détresser de la même façon.","Nomme un « fil d’araignée » actuel, une petite habitude qui semble anodine, et coupe-le dès aujourd’hui.",[2,10]],["vv7qgn",0,"Mon fils, si ce misérable te rencontre, entraîne-le à la maison d’étude.","","Talmud de Babylone","Tradition rabbinique, Mésopotamie, IIIe-VIe s.","Kiddouchin 30b (école de rabbi Ishmaël)",1,"Le « misérable », c’est le penchant qui pousse à mal faire. Le conseil ne dit ni de le nier ni de le combattre seul, mais de l’emmener ailleurs : dans un lieu d’étude, de parole et de communauté. La stratégie est d’une grande finesse psychologique. On ne vainc pas une envie à mains nues ; on change le contexte dans lequel elle se présente, et l’on s’entoure de ceux qui aident à penser.","Choisis dès maintenant ta « maison d’étude » : un lieu ou un groupe où emmener l’envie quand elle se présente.",[11]],["148rwym",0,"Cours vers le plus petit commandement comme vers le plus grand, et fuis la faute ; car une bonne action en entraîne une autre, et une faute en entraîne une autre.","","Ben Azzaï","Sage de la Mishna, Judée, IIe s.","Pirké Avot 4, 2",0,"Ben Azzaï décrit l’élan propre à chaque direction : les actes ne restent pas isolés, ils attirent leurs semblables. Le principe vaut dans les deux sens, ce qui le rend précieux en rétablissement. Une action sobre, même minuscule, prépare la suivante ; un écart tend à en appeler d’autres, raison de plus pour l’interrompre vite plutôt que de laisser filer la journée. Le verbe « courir » dit l’urgence douce de commencer petit.","Accomplis maintenant une toute petite action sobre (boire de l’eau, sortir, écrire à quelqu’un) pou

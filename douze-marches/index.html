ce que tu sais faire aujourd’hui et que tu ignorais au début.",[10,2,6]],["hnokl2",8,"Je ne crois pas que la souffrance seule enseigne. Si elle suffisait, le monde entier serait sage, puisque tout le monde souffre.","I do not believe that sheer suffering teaches. If suffering alone taught, all the world would be wise, since everyone suffers.","Anne Morrow Lindbergh","Écrivaine et aviatrice américaine, XXe s.","Hour of Gold, Hour of Lead (1973)",0,"Ces lignes figurent dans ses journaux, marqués par l’enlèvement et la mort de son premier enfant en 1932. Lindbergh précise aussitôt : à la souffrance doivent s’ajouter le deuil, la compréhension, la patience, l’amour, l’ouverture et la volonté de rester vulnérable. C’est l’une des meilleures réponses au cliché de la souffrance formatrice : ce n’est pas la douleur qui transforme, c’est ce qu’on lui adjoint.","Pour ta peine actuelle, choisis un ingrédient de Lindbergh, patience, ouverture ou amour, et cultive-le aujourd’hui.",[6,3,5]],["1kiwo4t",8,"Tout ce que tu touches, tu le changes. Tout ce que tu changes te change.","All that you touch / You Change. / All that you Change / Changes you.","Octavia E. Butler","Romancière américaine de science-fiction, XXe s.","La Parabole du semeur (Parable of the Sower), 1993",0,"Ces versets ouvrent le roman, où Lauren Olamina fonde une philosophie nommée Earthseed au milieu d’une Amérique en effondrement. Pour Butler, le changement est la seule vérité durable, et grandir consiste à le façonner plutôt qu’à le subir. La réciprocité est la clé : on ne transforme pas sa vie sans être transformé en retour, ce qui suppose d’accepter une part d’inconnu sur la personne que l’on deviendra.","Choisis un petit changement à introduire et note d’avance ce qu’il pourrait changer en toi.",[6,1,2]],["enu5vf",8,"Brisez un vase, et l’amour qui en rassemble les fragments est plus fort que celui qui tenait sa symétrie pour acquise quand il était intact.","Break a vase, and the love that reassembles the fragments is stronger than that love which took its symmetry for granted when it was whole.","Derek Walcott","Poète saint-lucien, Nobel 1992, XXe s.","Discours du Nobel, « The Antilles: Fragments of Epic Memory », 1992",0,"Walcott parle de la culture caribéenne, faite de fragments arrachés à l’Afrique, à l’Inde, à l’Europe, et recollés en une identité neuve. Son image est celle du kintsugi appliquée à l’histoire : la réparation n’est pas un pis-aller mais une forme d’amour plus consciente. Transposée à la vie intime, elle suggère qu’une identité reconstruite après une cassure peut être davantage aimée, parce qu’elle a été choisie.","Choisis un fragment de ton histoire que tu cachais, et écris comment il s’intègre aujourd’hui à l’ensemble.",[9,10,12]],["1y1tqna",8,"Tout ce qui nous arrive, y compris nos humiliations, nos malheurs, nos hontes, tout nous est donné comme une matière première, comme de l’argile, pour que nous puissions façonner notre art.","","Jorge Luis Borges","Écrivain argentin, XXe s.","",0,"Borges, devenu presque aveugle vers cinquante-cinq ans, parlait d’abord de l’écrivain, puis de toute personne : chaque expérience, même honteuse, est un matériau. L’idée ne relève pas de l’optimisme ; elle décrit une posture d’artisan face à sa propre vie. On n’a pas à trouver bonne une humiliation pour en faire quelque chose : un récit, une compréhension, une compassion pour d’autres. L’argile ne demande pas d’être aimée, seulement travaillée.","Prends une expérience honteuse et décris-la en dix lignes, comme un artisan décrit sa matière, sans juger.",[5,7,12]],["viebm8",8,"Le meilleur moyen d’en sortir, c’est toujours de passer à travers.","","Robert Frost","Poète américain, XXe s.","« A Servant to Servants », North of Boston (1914)",0,"La phrase est prononcée, dans un monologue, par une femme épuisée de tâches domestiques et inquiète pour sa propre santé mentale. Elle n’a donc rien d’un slogan héroïque : c’est le constat las de quelqu’un qui sait que l’évitement ne mène nulle part. Les thérapies de l’anxiété partagent cette intuition : contourner une peur la renforce, la traverser par étapes l’affaiblit. Encore faut-il ne pas traverser seul.","Choisis une petite situation que tu évites, et traverse-la aujourd’hui à dose réduite, accompagné si possible.",[2,4,10]],["js5az9",8,"D’abord vient la chute, puis le relèvement après la chute, et l’un et l’autre sont miséricorde.","","Julienne de Norwich","Mystique anglaise, XIVe-XVe s.","Révélations de l’amour divin, chap. 61",0,"Julienne, recluse de Norwich et première femme connue à écrire un livre en anglais, médite sur nos chutes avec une douceur rare pour son époque. Elle ne voit pas l’échec comme une simple faute à punir, mais comme l’étape d’un mouvement dont le relèvement fait partie. Sans partager sa foi, on peut retenir l’idée : tomber n’annule pas le chemin, c’est souvent là qu’on apprend à se relever.","Après une chute récente, regarde-la comme la première moitié d’un mouvement, et cherche la seconde.",[2,4,8]],["162t1qw",8,"Le chemin se demande à ceux qui sont passés devant.","Indlela ibuzwa kwabaphambili.","Proverbe zoulou","Sagesse populaire, Afrique australe","",1,"Le proverbe zoulou valorise l’expérience de ceux qui ont déjà traversé ce que l’on traverse. En pleine épreuve, on croit souvent être le premier à vivre cela ; demander le chemin rompt cet isolement. Les groupes de pairs, en santé mentale comme en addictologie, reposent sur cette sagesse : qui est passé devant peut éclairer la route. Demander n’est pas un aveu de faiblesse, c’est une compétence.","Identifie quelqu’un qui a traversé ce que tu vis, et pose-lui une seule question précise.",[7,8]],["kwks8y",8,"Tomber une fois dans le fossé, c’est gagner un peu de sagesse.","","Proverbe chinois","Sagesse populaire, Chine","",1,"Le proverbe chinois, « chi yi qian, zhang yi zhi », associe chaque chute à un gain de discernement, comme un voyageur qui apprend la route à ses dépens. Il est employé pour consoler autant que pour responsabiliser : l’erreur n’est pas un déshonneur si elle sert. Sa limite est implicite : tomber deux fois dans le même fossé signale qu’il faut changer de méthode, ou demander le chemin.","Nomme un fossé où tu es tombé cette année, et la règle simple qui t’évitera d’y retomber.",[2,6,7]],["s8eqw3",8,"L’identité n’est pas donnée une fois pour toutes, elle se construit et se transforme tout au long de l’existence.","","Amin Maalouf","Écrivain franco-libanais, XXe-XXIe s.","Les Identités meurtrières (1998)",0,"Maalouf, né à Beyrouth et installé en France pendant la guerre civile, écrit cet essai contre les identités réduites à une seule appartenance. Sa phrase vaut aussi pour la vie intime : après une épreuve, on craint parfois d’avoir « perdu » qui l’on était. Or l’identité est un processus, qui intègre les ruptures au lieu d’être détruit par elles. Changer n’est pas se trahir, c’est continuer à se composer.","Écris trois appartenances qui te composent aujourd’hui et une qui s’est ajoutée récemment.",[2,6,1]]];

function plural(n,s,p){return fmt(n)+" "+(n>1?(p||s+"s"):s);}
function fmt(n){return Number(n).toLocaleString("fr-FR");}
function money(n){return Number(n).toLocaleString("fr-FR",{maximumFractionDigits:0})+" €";}
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseYmd(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function dayDiff(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function addMonths(d,m){var r=new Date(d.getFullYear(),d.getMonth()+m,1);var last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),last));return r;}
function frDate(d,opt){return d.toLocaleDateString("fr-FR",opt||{day:"numeric",month:"long",year:"numeric"});}
function frShort(d){return d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});}
function dayNumber(){var d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}

/* Synchronisation privée via le compte Claude (data/users/<id>/…) */
var remote={col:null,ready:false,pending:{},inflight:{},again:{},timer:null,status:"local"};
function setSync(s){remote.status=s;var el=$("#syncState");if(el)el.outerHTML=syncHTML();}
function syncHTML(){
  var m={local:["","Sur cet appareil uniquement. Ouvre l’application depuis Claude, connecté à ton compte, pour la retrouver sur tous tes appareils."],
    connecting:["","Connexion à ton espace privé…"],
    slow:["warn","Ton espace privé ne répond pas encore. Tout reste enregistré sur cet appareil et sera envoyé dès que possible."],
    ok:["ok","Enregistré sur ton compte, dans un espace privé que personne d’autre ne peut lire. Tes données te suivent d’un appareil à l’autre."],
    readonly:["warn","Ton compte ne permet pas d’enregistrer ici. Tes données restent sur cet appareil."],
    error:["warn","La synchronisation s’est interrompue. Tes données restent sur cet appareil."]};
  if(!window.claude&&remote.status==="local") m.local=["","Enregistré sur cet iPhone, dans l’application. Personne d’autre n’y a accès. Copie ta sauvegarde de temps en temps (ci-dessous) pour ne rien perdre si tu changes de téléphone."];
  var v=m[remote.status]||m.local;
  return '<p class="sync '+v[0]+'" id="syncState"><i></i><span>'+esc(v[1])+'</span></p>';
}
function initRemote(){
  if(!window.claude||typeof window.claude.use!=="function") return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1]; if(!db||!user) return;
    return user.id().then(function(uid){
      if(!uid) return;
      var col; try{col=db.collection("data/users/"+uid);}catch(e){return;}
      remote.col=col; setSync("connecting");
      var to=setTimeout(function(){if(!remote.ready)setSync("slow");},10000);
      col.onSnapshot(function(snap){
        var changed=false, remoteT={};
        snap.docs.forEach(function(d){
          var body=d.data(); if(!body) return; remoteT[d.id]=body._t||0;
          var l=DOCS[d.id];
          if(!l||(body._t||0)>(l._t||0)){DOCS[d.id]=clone(body);writeLocal(d.id);changed=true;}
        });
        if(!snap.metadata.fromCache&&!remote.ready){
          remote.ready=true; clearTimeout(to); setSync("ok");
          setTimeout(function(){Object.keys(DOCS).forEach(function(k){if((DOCS[k]._t||0)>(remoteT[k]||0))remote.pending[k]=1;});flush();},50);
        }
        if(changed){loadFavs();softRerender();}
      },function(err){clearTimeout(to);remote.col=null;setSync("error");});
    });
  }).catch(function(){});
}
function queueRemote(k){remote.pending[k]=1;clearTimeout(remote.timer);remote.timer=setTimeout(flush,1200);}
function flush(){if(!remote.col||!remote.ready)return;Object.keys(remote.pending).forEach(function(k){delete remote.pending[k];writeOne(k);});}
function writeOne(k){
  if(!remote.col||!DOCS[k]) return;
  if(remote.inflight[k]){remote.again[k]=1;return;}
  var body=clone(DOCS[k]);
  remote.inflight[k]=remote.col.doc(k).set(body).catch(function(e){
    var c=e&&e.code;
    if(c==="invalid_argument"&&/^[a-z0-9-]+$/.test(k)){remote.col=null;setSync("readonly");}
    else if(c==="quota_exceeded"){toast("Espace privé plein : exporte une sauvegarde");}
    else if(c==="unavailable"){setTimeout(function(){queueRemote(k);},2000+Math.random()*2000);}
  }).then(function(){remote.inflight[k]=null;if(remote.again[k]){delete remote.again[k];writeOne(k);}});
}
var rerenderPending=false;
function softRerender(){
  var a=document.activeElement;
  if(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT")){rerenderPending=true;return;}
  rerenderPending=false;
  if($("#sheet").hidden){var y=window.scrollY;show(view,true);window.scrollTo(0,y);} else rerenderPending=true;
}
document.addEventListener("focusout",function(){if(rerenderPending)setTimeout(function(){var a=document.activeElement;if(!(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT")))softRerender();},300);});

/* ---------- Coutures d’or (génératives, reprises de Kintsugi) ---------- */
function crack(r,x0,x1,y0,y1,amp,steps){
  var pts=[],y;
  for(var i=0;i<=steps;i++){var f=i/steps,x=x0+(x1-x0)*f;if(i>0&&i<steps)x+=(r()-.5)*(x1-x0)/steps*.7;y=y0+(y1-y0)*f+(i>0&&i<steps?(r()-.5)*2*amp:0);pts.push([x,y]);}
  return pts;
}
function branch(r,pts,len,amp){
  var i=1+Math.floor(r()*(pts.length-2)),x=pts[i][0],y=pts[i][1],dir=r()<.5?-1:1,out=[[x,y]],n=2+Math.floor(r()*2);
  for(var k=0;k<n;k++){x+=len*(.5+r()*.6);y+=dir*amp*(.5+r()*.8);out.push([x,y]);}
  return out;
}
function pd(pts){return "M"+pts.map(function(p){return p[0].toFixed(1)+" "+p[1].toFixed(1);}).join(" L");}
var uid=0;
function bowl(o,cls,state){
  var id="kc"+(++uid),r=rng(hash(String(o.id))+7);
  var y0=14+r()*16,y1=34+r()*18,m=crack(r,2,62,y0,y1,4,6),b=branch(r,m,7,6);
  var sc=state==="faint"?"seam-faint":"seam", op=state==="faint"?' opacity=".35"':(state==="half"?' opacity=".7"':'');
  return '<svg class="bowl '+(cls||"")+'" viewBox="0 0 64 64" aria-hidden="true" style="--h:'+o.hue+'"><defs><clipPath id="'+id+'"><circle cx="32" cy="32" r="27"/></clipPath></defs>'+
    '<circle class="bowl-body" cx="32" cy="32" r="27"/><ellipse cx="24" cy="21" rx="11" ry="6" fill="#fff" opacity=".13"/>'+
    '<g clip-path="url(#'+id+')"'+op+'><path class="'+sc+'" stroke-width="2.4" d="'+pd(m)+'"/><path class="'+sc+'" stroke-width="1.5" d="'+pd(b)+'"/></g>'+
    '<circle class="bowl-rim" cx="32" cy="32" r="27"/></svg>';
}
function seamRule(seed,w,h,draw){
  var r=rng(seed),mid=h/2,m=crack(r,-4,w+4,mid+(r()-.5)*h*.4,mid+(r()-.5)*h*.4,h*.32,Math.max(7,Math.round(w/40)));
  var b=branch(r,m,w/26,h*.28),cls=draw?"seam draw-path":"seam";
  return '<svg class="rule" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><path class="'+cls+'" stroke-width="1.8" d="'+pd(m)+'"/><path class="'+cls+'" stroke-width="1.1" d="'+pd(b)+'"/></svg>';
}
function heroSeam(seed,w){
  var h=64,r=rng(seed),m=crack(r,-6,w+6,16+r()*16,34+r()*16,13,Math.max(8,Math.round(w/34)));
  var b1=branch(r,m,w/20,13),b2=branch(r,m,w/26,11);
  return '<svg class="hero-seam" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><path class="seam draw-path" stroke-width="2.6" d="'+pd(m)+'"/><path class="seam draw-path" stroke-width="1.5" d="'+pd(b1)+'"/><path class="seam draw-path" stroke-width="1.2" d="'+pd(b2)+'"/></svg>';
}
/* Le bol des jalons : 12 fêlures qui se remplissent d’or */
function mendBowl(reached){
  var id="mb"+(++uid),r=rng(hash("douze-bol")),cx=100,cy=100,R=86,paths="";
  for(var i=0;i<12;i++){
    var a=(-90+i*30+(r()-.5)*14)*Math.PI/180, a2=a+(r()-.5)*.5, len=R*(.42+r()*.38);
    var x0=cx+Math.cos(a)*(R+6),y0=cy+Math.sin(a)*(R+6),pts=[[x0,y0]],n=4;
    for(var k=1;k<=n;k++){var f=k/n,ang=a+(a2-a)*f+(r()-.5)*.35,rr=R+6-len*f;pts.push([cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr]);}
    var on=i<reached, br="";
    if(r()<.7){var j=1+Math.floor(r()*(pts.length-2)),p=pts[j],ba=a+(r()<.5?-1:1)*(.5+r()*.5);br=" M"+p[0].toFixed(1)+" "+p[1].toFixed(1)+" L"+(p[0]-Math.cos(ba)*14).toFixed(1)+" "+(p[1]-Math.sin(ba)*14).toFixed(1);}
    paths+='<path class="'+(on?"seam draw-path":"crack")+'" stroke-width="'+(on?3:1.4)+'" d="'+pd(pts)+br+'"/>';
  }
  return '<svg class="mend-bowl" viewBox="0 0 200 200" role="img" aria-label="Bol réparé : '+reached+' jalons sur 12" style="--h:205"><defs><clipPath id="'+id+'"><circle cx="100" cy="100" r="86"/></clipPath></defs>'+
    '<circle class="bowl-body" cx="100" cy="100" r="86"/><ellipse cx="74" cy="64" rx="34" ry="18" fill="#fff" opacity=".12"/>'+
    '<g clip-path="url(#'+id+')">'+paths+'</g><circle class="bowl-rim" cx="100" cy="100" r="86"/>'+
    '<text x="100" y="108" text-anchor="middle" style="font:700 30px var(--font-display);fill:var(--surface);opacity:.95">'+reached+'<tspan style="font-size:15px;opacity:.75"> / 12</tspan></text></svg>';
}

  var main=$("#main"),J=allJournal(),p=D("profil"),now=new Date(),today=ymd();
  if(!calMonth) calMonth=new Date(now.getFullYear(),now.getMonth(),1);
  var y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),nd=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7;
  var start=p.start?parseYmd(p.start):null,hist=(p.history||[]);
  function inSober(ds){var d=parseYmd(ds);if(start&&d>=start&&ds<=today)return true;for(var i=0;i<hist.length;i++){if(ds>=hist[i].start&&ds<=hist[i].end)return true;}return false;}
  var keys=Object.keys(J).sort().reverse();
  var h='<div class="view"><header class="cat-head">'+bowl({id:"journal",hue:20})+'<div><p class="eyebrow">Un jour à la fois</p><h1>Mon journal</h1><p class="cat-tag">'+(keys.length?plural(keys.length,"journée notée","journées notées"):"Tes journées, ton humeur, tes envies et tes gratitudes")+'</p></div></header>'+
    '<div class="btn-row"><button class="btn btn-ink" data-act="checkin">'+I.pen+'Mon point du jour</button><button class="btn btn-line" data-act="soir">'+I.moon+'Inventaire du soir</button></div>';
  // Calendrier
  h+='<h2 class="sec">Mon mois</h2><div class="cal"><div class="cal-h"><button class="icon-btn" data-act="cal-prev" aria-label="Mois précédent">'+I.left+'</button><b>'+esc(first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}))+'</b><button class="icon-btn" data-act="cal-next" aria-label="Mois suivant">'+I.right+'</button></div><div class="cal-g">'+
    ["L","M","M","J","V","S","D"].map(function(x){return '<span class="wd">'+x+'</span>';}).join("");
  for(var i=0;i<off;i++) h+='<span></span>';
  for(var d=1;d<=nd;d++){
    var ds=y+"-"+pad(m+1)+"-"+pad(d),e=J[ds],fut=ds>today,cls="day in";
    if(!fut&&inSober(ds)) cls+=" sober";
    if(e&&e.sober===false) cls="day in drank";
    if(ds===today) cls+=" today"; if(fut) cls+=" future";
    var dots=(e&&(e.m!=null||e.c!=null||e.g)?'<i></i>':"")+(e&&e.eng?'<i class="eng"></i>':"");
    h+='<button class="'+cls+'" '+(fut?'disabled':'data-act="checkin" data-v="'+ds+'"')+' aria-label="'+esc(frDate(parseYmd(ds)))+(e?" · noté":"")+'">'+d+(dots?'<span class="dots">'+dots+'</span>':"")+'</button>';
  }
  h+='</div><div class="cal-l"><span><i></i>Jour de sobriété</span><span><i class="dot"></i>Point noté</span><span><i class="eng"></i>Engagement du matin</span></div></div>';
  // Tendances
  var series=[],ms=[];for(var k=29;k>=0;k--){var dd=ymd(addDays(now,-k)),ee=J[dd];series.push({d:dd,v:ee&&ee.c!=null?+ee.c:null});ms.push({d:dd,v:ee&&ee.m?+ee.m:null});}
  if(locked()) h+='<h2 class="sec">Mes 30 derniers jours</h2>'+lockCard("Tes courbes et ton journal complet","Suis l’évolution de ton envie et de ton humeur sur 30 jours, et relis toutes tes journées.");
  else h+='<h2 class="sec">Mes 30 derniers jours</h2><p class="sec-lead">Une envie qui baisse, même lentement, est un vrai progrès. Les jours sans point noté restent vides.</p>'+
    trendHTML("craving","Envie de boire",series,0,10,function(v){return v+"/10";})+
    trendHTML("mood","Humeur",ms,1,5,function(v){return MOODS[v-1];});
  var nG=0,nM=0,nS=0,nE=0;keys.forEach(function(k2){var e2=J[k2];nG+=(e2.g||[]).filter(function(x){return x&&x.trim();}).length;if(e2.meet)nM++;nS+=(e2.surf||[]).length;if(e2.soir&&Object.keys(e2.soir).length)nE++;});
  h+='<div class="kpis"><div class="stat"><b>'+fmt(nG)+'</b><span>gratitudes notées</span></div><div class="stat"><b>'+fmt(nM)+'</b><span>réunions</span></div><div class="stat"><b>'+fmt(nE)+'</b><span>inventaires du soir</span></div><div class="stat"><b>'+fmt(nS)+'</b><span>vagues surfées</span></div></div>';
  // Entrées
  h+='<h2 class="sec">Mes journées</h2>';
  if(!keys.length) h+='<div class="empty">'+bowl({id:"vide",hue:20})+'<h3>Ton journal commence aujourd’hui</h3><p>Note ton humeur, ton envie et trois gratitudes. Une minute suffit.</p><div class="btn-row" style="justify-content:center"><button class="btn btn-ink" data-act="checkin">Mon point du jour</button></div></div>';
  else h+='<div class="entries">'+(locked()?keys.filter(function(k4){return k4>=ymd(addDays(new Date(),-6));}):keys).slice(0,40).map(function(k3){return entryHTML(k3,J[k3]);}).join("")+'</div>'+(locked()?'<p class="fine">Sans le premium, le journal affiche tes 7 derniers jours. Les autres restent enregistrés sur ton téléphone.</p>':"")+(keys.length>40?'<p class="fine">Les 40 journées les plus récentes sont affichées. Touche un jour du calendrier pour ouvrir les plus anciennes.</p>':"");
  h+='</div>';

function entryHTML(ds,e){
  var d=parseYmd(ds),tags=[];
  if(e.sober===false) tags.push('<span class="tag">Jour difficile</span>');
  if(e.m) tags.push('<span class="tag">Humeur · '+esc(MOODS[e.m-1])+'</span>');
  if(e.c!=null) tags.push('<span class="tag">Envie · '+e.c+'/10</span>');
  (e.halt||[]).forEach(function(k){var x=HALT.filter(function(hh){return hh.k===k;})[0];if(x)tags.push('<span class="tag tag-trad">'+esc(x.t)+'</span>');});
  if(e.meet) tags.push('<span class="tag">Réunion</span>');
  if(e.eng) tags.push('<span class="tag">Engagement à '+esc(e.eng)+'</span>');
  (e.surf||[]).forEach(function(sv){tags.push('<span class="tag">Vague '+sv.b+' → '+sv.a+'</span>');});
  var g=(e.g||[]).filter(function(x){return x&&x.trim();});
  var so=e.soir&&Object.keys(e.soir).length?SOIR.filter(function(q){return q[2]?e.soir[q[0]]===0:e.soir[q[0]]===1;}).map(function(q){return q[3];}):null;
  return '<article class="entry"><div class="entry-h"><b>'+esc(d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}))+'</b><button class="link-btn" data-act="checkin" data-v="'+ds+'">Modifier</button></div>'+
    (tags.length?'<div class="tags">'+tags.join("")+'</div>':"")+
    (g.length?'<p class="gr">'+g.map(esc).join(" · ")+'</p>':"")+
    (e.note?'<p>'+esc(e.note)+'</p>':"")+
    (so?'<p><span class="label">Inventaire du soir</span>'+(so.length?esc("À revoir : "+so.join(" ; ")):"Une journée tenue.")+(e.soir.mieux?"\n"+esc(e.soir.mieux):"")+'</p>':"")+
  '</article>';
}
function trendHTML(id,title,pts,min,max,lab){
  var vals=pts.filter(function(p){return p.v!=null;});
  if(vals.length<2) return '<div class="trend"><div class="trend-h"><b>'+esc(title)+'</b><span>'+(vals.length?"1 point noté":"Aucun point noté")+'</span></div><p class="fine">La courbe apparaît à partir de deux journées notées.</p></div>';
  var W=600,H=110,L=26,R=8,T=10,B=22,iw=W-L-R,ih=H-T-B;
  function X(i){return L+i*iw/(pts.length-1);} function Y(v){return T+ih-(v-min)*ih/(max-min);}
  var segs=[],cur=[];pts.forEach(function(p,i){if(p.v==null){if(cur.length)segs.push(cur);cur=[];}else cur.push([X(i),Y(p.v)]);});if(cur.length)segs.push(cur);
  var line=segs.map(function(sg){return "M"+sg.map(function(q){return q[0].toFixed(1)+" "+q[1].toFixed(1);}).join(" L");}).join(" ");
  var area=segs.filter(function(sg){return sg.length>1;}).map(function(sg){return "M"+sg[0][0].toFixed(1)+" "+(T+ih)+" L"+sg.map(function(q){return q[0].toFixed(1)+" "+q[1].toFixed(1);}).join(" L")+" L"+sg[sg.length-1][0].toFixed(1)+" "+(T+ih)+" Z";}).join(" ");
  var lastI=-1;for(var i=pts.length-1;i>=0;i--){if(pts[i].v!=null){lastI=i;break;}}
  var avg=vals.reduce(function(a,p){return a+p.v;},0)/vals.length;
  var ticks=[min,Math.round((min+max)/2),max];
  var svg='<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" data-trend="'+id+'" role="img" aria-label="'+esc(title)+' sur 30 jours, moyenne '+(Math.round(avg*10)/10)+'">'+
    ticks.map(function(t){return '<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text class="ax" x="'+(L-6)+'" y="'+(Y(t)+3.5)+'" text-anchor="end">'+t+'</text>';}).join("")+
    '<text class="ax" x="'+L+'" y="'+(H-4)+'">il y a 30 j</text><text class="ax" x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end">aujourd’hui</text>'+
    '<path class="ar" d="'+area+'"/><path class="ln" d="'+line+'" vector-effect="non-scaling-stroke"/>'+
    (lastI>=0?'<circle class="pt" cx="'+X(lastI)+'" cy="'+Y(pts[lastI].v)+'" r="4.5"/>':"")+
    '<line class="cross" x1="0" x2="0" y1="'+T+'" y2="'+(T+ih)+'" visibility="hidden"/><rect x="'+L+'" y="0" width="'+iw+'" height="'+H+'" fill="transparent"/></svg>';
  TRENDS[id]={pts:pts,lab:lab,L:L,iw:iw,W:W};
  return '<div class="trend"><div class="trend-h"><b>'+esc(title)+'</b><span>moyenne '+(id==="mood"?esc(MOODS[Math.round(avg)-1]).toLowerCase():(Math.round(avg*10)/10)+"/10")+' · '+plural(vals.length,"jour noté","jours notés")+'</span></div>'+svg+'<div class="tip" hidden></div></div>';
}
var TRENDS={};
function bindTrends(root){
  $$("svg[data-trend]",root).forEach(function(svg){
    var t=TRENDS[svg.dataset.trend],box=svg.parentNode,tip=box.querySelector(".tip"),cross=svg.querySelector(".cross");
    function move(ev){
      var r=svg.getBoundingClientRect(),cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left,x=cx*t.W/r.width;
      var i=Math.round((x-t.L)*(t.pts.length-1)/t.iw);i=Math.max(0,Math.min(t.pts.length-1,i));
      var p=t.pts[i],px=t.L+i*t.iw/(t.pts.length-1);
      cross.setAttribute("x1",px);cross.setAttribute("x2",px);cross.setAttribute("visibility","visible");
      tip.hidden=false;tip.textContent=frShort(parseYmd(p.d))+" · "+(p.v==null?"non noté":t.lab(p.v));
      var br=box.getBoundingClientRect();tip.style.left=Math.max(60,Math.min(br.width-60,r.left-br.left+px*r.width/t.W))+"px";tip.style.top=(r.top-br.top+8)+"px";
    }
    function out(){tip.hidden=true;cross.setAttribute("visibility","hidden");}
    svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);svg.addEventListener("pointerleave",out);
  });
}

/* ---------- Vue : Citations ---------- */
function citeList(){
  var L=Q;
  if(citeState.th==="fav") L=favs.slice().reverse().map(function(id){return byId[id];}).filter(Boolean);
  else if(citeState.th!=="all"){var ti=+citeState.th;L=L.filter(function(q){return q.th===ti;});}
  if(citeState.step) L=L.filter(function(q){return q.st.indexOf(citeState.step)>=0;});
  return citeState.shuffle?shuffled(L,citeState.shuffle):L;
}
function renderCites(){
  var main=$("#main"),cnt={};Q.forEach(function(q){cnt[q.th]=(cnt[q.th]||0)+1;});
  if(locked()){var qd0=Q[hash("jour"+dayNumber())%Q.length];main.innerHTML='<div class="view"><header class="cat-head">'+bowl({id:"cites",hue:200})+'<div><p class="eyebrow">Pensées pour le chemin</p><h1>Citations</h1><p class="cat-tag">'+fmt(Q.length)+' citations, chacune expliquée et reliée aux étapes</p></div></header><h2 class="sec">La pensée du jour</h2><div class="list">'+cardHTML(qd0,{showCat:true})+'</div>'+lockCard("Les "+fmt(Q.length)+" citations expliquées","Chaque citation a son analyse et une piste concrète, filtrable par thème et par étape.")+'</div>';return;}

    '<p class="cat-intro">Des membres des fraternités, des soignants, des écrivains passés par l’alcool et des sagesses anciennes. Chaque citation a son analyse et une piste concrète pour aujourd’hui.</p></header>'+
    '<div class="filters"><div class="chips" role="group" aria-label="Thème">'+
      '<button class="chip" data-act="cite-th" data-v="all" aria-pressed="'+(citeState.th==="all")+'">Toutes<span class="n">'+Q.length+'</span></button>'+
      THEMES.map(function(t,i){return cnt[i]?'<button class="chip" data-act="cite-th" data-v="'+i+'" aria-pressed="'+(citeState.th===String(i))+'">'+esc(t.name)+'<span class="n">'+cnt[i]+'</span></button>':"";}).join("")+
      '<button class="chip" data-act="cite-th" data-v="fav" aria-pressed="'+(citeState.th==="fav")+'">Mes favoris<span class="n" id="favCount">'+(favs.length||"")+'</span></button>'+
    '</div><div class="row"><div class="chips" role="group" aria-label="Étape">'+
      '<button class="chip" data-act="cite-step" data-v="0" aria-pressed="'+(!citeState.step)+'">Toutes les étapes</button>'+
      STEPS.map(function(s){return '<button class="chip" data-act="cite-step" data-v="'+s.n+'" aria-pressed="'+(citeState.step===s.n)+'">Étape '+s.n+'</button>';}).join("")+
    '</div><button class="chip" data-act="cite-shuffle" aria-pressed="'+(!!citeState.shuffle)+'">'+I.shuffle+' '+(citeState.shuffle?"Mélangé":"Mélanger")+'</button></div></div>'+
    '<div class="btn-row"><button class="btn btn-line" data-act="draw">'+I.sparkle+'Tirer une pensée au hasard</button></div>'+
    '<div id="listWrap"></div></div>';
  main.innerHTML=h; renderCiteList();
}
function renderCiteList(){
  var wrap=$("#listWrap");if(!wrap)return;
  var L=citeList(),shown=L.slice(0,citeState.limit);
  var h='<p class="result-n" style="margin-top:1.2rem">'+plural(L.length,"citation")+(citeState.shuffle?" · ordre aléatoire":"")+'</p>';
  if(!L.length) h+='<div class="empty"><h3>'+(citeState.th==="fav"?"Aucun favori pour l’instant":"Aucune citation pour ce filtre")+'</h3><p>'+(citeState.th==="fav"?"Touche le cœur sous une citation pour la garder ici.":"Choisis « Toutes » pour tout afficher.")+'</p></div>';
  else h+='<div class="list">'+shown.map(function(q){return cardHTML(q,{showCat:citeState.th==="all"||citeState.th==="fav"});}).join("")+'</div>';
  if(L.length>shown.length) h+='<button class="more" data-act="more">Afficher la suite · '+(L.length-shown.length)+' restantes</button>';
  wrap.innerHTML=h; observeMore();
}
function observeMore(){
  if(io) io.disconnect();
  var b=$("#main .more");if(!b||!("IntersectionObserver" in window))return;
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.disconnect();loadMore();}});},{rootMargin:"600px 0px"});
  io.observe(b);
}
function loadMore(){
  var L=citeList(),from=citeState.limit;citeState.limit+=30;
  var listEl=$("#listWrap .list"),more=$("#listWrap .more");if(!listEl)return;
  listEl.insertAdjacentHTML("beforeend",L.slice(from,citeState.limit).map(function(q){return cardHTML(q,{showCat:citeState.th==="all"||citeState.th==="fav"});}).join(""));
  if(L.length>citeState.limit){more.textContent="Afficher la suite · "+(L.length-citeState.limit)+" restantes";observeMore();}else if(more)more.remove();
}

var T={iv:null,raf:null,wake:null,ac:null,run:null};
function stopTimers(){clearInterval(T.iv);cancelAnimationFrame(T.raf);T.iv=null;T.raf=null;T.run=null;try{if(T.wake)T.wake.release();}catch(e){}T.wake=null;}

function chime(){try{if(!T.ac)return;var ac=T.ac,t=ac.currentTime;[528,792,1056].forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16/(i+1),t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+3.6);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+3.7);});}catch(e){}}

function countdown(sec,onTick,onEnd){
  var t0=Date.now();T.run=true;wakeLock();
  function tick(){var el=(Date.now()-t0)/1000;if(el>=sec){stopTimers();onTick(sec,1);onEnd();return;}onTick(el,el/sec);}
  tick();T.iv=setInterval(tick,250);
}

var surf={b:6,min:15};
function openSurf(phase){
  if(phase==="run"){

    '<div class="btn-row"><button class="btn btn-ink" data-act="surf-start">'+I.wave+'Commencer</button></div>';

function startWave(){
  var c=$("#waveC");if(!c)return;var ctx=c.getContext("2d"),dpr=window.devicePixelRatio||1,cs=getComputedStyle(document.documentElement);
  var gold=cs.getPropertyValue("--gold-b").trim()||"#C1902F",ink=cs.getPropertyValue("--ink-3").trim()||"#6F7A75";
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(ts){
    if(!document.body.contains(c))return;
    var w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
    var f=surf.f||0,peak=f<.3?f/.3:Math.max(0,1-(f-.3)/.7),amp=8+peak*30,t=reduce?0:ts/1000;
    [[gold,1,2.2],[ink,.55,1.2]].forEach(function(L,li){
      ctx.beginPath();for(var x=0;x<=w;x+=4){var y=h/2+Math.sin(x/w*Math.PI*3+t*(1.2-li*.4))*amp*L[1]*Math.sin(Math.PI*x/w)+(li?8:0);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
      ctx.strokeStyle=L[0];ctx.lineWidth=L[2];ctx.globalAlpha=li?.5:1;ctx.stroke();ctx.globalAlpha=1;
    });
    T.raf=requestAnimationFrame(frame);
  }
  T.raf=requestAnimationFrame(frame);
}

var searchTimer=null,searchIdx=null;
function openSearch(){$("#search").hidden=false;document.documentElement.style.overflow="hidden";try{$("#q").focus();}catch(e){}runSearch();}
function closeSearch(){$("#search").hidden=true;document.documentElement.style.overflow="";}
function runSearch(){
  var raw=$("#q").value.trim(),out=$("#searchOut");
  if(raw.length<2){
    out.innerHTML='<p class="result-n">Étapes, outils, Gros Livre, vocabulaire et '+fmt(Q.length)+' citations</p><p class="sec-lead" style="margin-top:.6rem">Quelques pistes :</p><div class="hints">'+
      ["ressentiment","rechute","parrain","humilité","peur","Bill W.","sevrage","inventaire","prière","pardon","honte","réparation"].map(function(s){return '<button class="chip" data-act="hint" data-v="'+esc(s)+'">'+esc(s)+'</button>';}).join("")+'</div>';
    return;
  }
  if(!searchIdx){
    searchIdx={q:Q.map(function(q){return norm(q.t+" "+q.a+" "+q.d+" "+q.s+" "+q.e+" "+q.p);}),
      s:STEPS.map(function(s){return norm(s.title+" "+s.principle+" "+s.text+" "+s.plain+" "+s.intro+" "+s.book+" "+s.myths.join(" ")+" "+s.exercises.map(function(e){return e.title+" "+e.intro;}).join(" "));}),
      x:[].concat(GLOSSARY.map(function(g){return {k:"Vocabulaire",t:g.t,d:g.d,go:"reunions"};}),FAQ.map(function(f){return {k:"Question fréquente",t:f.q,d:f.a,go:"reunions"};}),SLOGANS.map(function(s){return {k:"Slogan",t:s.t,d:s.x,go:"outils"};}),BOOK.chapters.map(function(c){return {k:"Gros Livre · "+c.n,t:c.fr,d:c.sum,go:"livre",ch:c.id};}),TRADITIONS.map(function(t){return {k:"Tradition "+t.n,t:t.t,d:t.x,go:"reunions"};}))};
    searchIdx.xn=searchIdx.x.map(function(x){return norm(x.t+" "+x.d);});
  }
  var toks=norm(raw).split(/\s+/).filter(Boolean);
  function hit(s){for(var k=0;k<toks.length;k++){if(s.indexOf(toks[k])<0)return false;}return true;}
  var sh=STEPS.filter(function(s,i){return hit(searchIdx.s[i]);}),xh=searchIdx.x.filter(function(x,i){return hit(searchIdx.xn[i]);}),qh=Q.filter(function(q,i){return hit(searchIdx.q[i]);});
  var h='';

  if(xh.length)h+='<h2 class="sec">Programme et vocabulaire</h2>'+xh.slice(0,20).map(function(x){return '<button class="hit" data-act="'+(x.ch?"open-ch":"go")+'" data-view="'+x.go+'" data-v="'+(x.ch||"")+'"><small>'+esc(x.k)+'</small><b>'+esc(x.t)+'</b><span>'+esc(x.d.length>180?x.d.slice(0,177)+"…":x.d)+'</span></button>';}).join("");
  if(qh.length)h+='<h2 class="sec">Citations · '+qh.length+'</h2><div class="list">'+qh.slice(0,30).map(function(q){return cardHTML(q,{showCat:true});}).join("")+'</div>';
  out.innerHTML='<p class="result-n">'+(sh.length+xh.length+qh.length?plural(sh.length+xh.length+qh.length,"résultat"):"Aucun résultat")+'</p>'+(h||'<div class="empty"><h3>Rien pour « '+esc(raw)+' »</h3><p>Essaie un mot plus court ou sans accent.</p></div>');
}

    case "contact-role": D("profil").contacts[i].role=ROLES[+v];touch("profil");sheetDirty=true;setPressed(b);break;
    case "audit-ans": auditAns[+b.dataset.q]=+v;refreshSheet();break;
    case "audit-save": D("outils").audit={score:+v,at:new Date().toISOString()};touch("outils");toast("Résultat enregistré");break;
    case "relapse-reset":
      var pr=D("profil"),ns=$("#newStart").value||ymd();
      if(pr.start&&ns>pr.start){pr.history=pr.history||[];pr.history.push({start:pr.start,end:ymd(addDays(parseYmd(ns),-1))});}
      pr.start=ns;touch("profil");sheetDirty=true;toast("Nouveau départ. Un jour à la fois.");closeSheet();break;

    /* Citations, livre, journal */
    case "cite-th": citeState.th=v;citeState.limit=30;renderCites();break;
    case "cite-step": citeState.step=+v;citeState.limit=30;renderCites();break;
    case "cite-shuffle": citeState.shuffle=citeState.shuffle?0:(Math.floor(Math.random()*1e9)+1);citeState.limit=30;renderCites();break;
    case "more": loadMore(); break;
    case "acc": var ab=b.parentNode.querySelector(".acc-b"),ao=ab.hidden;openAcc[v]=ao;ab.hidden=!ao;b.setAttribute("aria-expanded",ao);break;
    case "ch-read": var rd=D("livre").read;rd[v]=!rd[v];touch("livre");if(rd[v])toast("Partie lue");openAcc[v]=true;var y1=window.scrollY;renderBook();window.scrollTo(0,y1);break;
    case "open-ch": if(!$("#search").hidden)closeSearch();openAcc[v]=true;go("livre");if(view==="livre")renderBook();setTimeout(function(){var el=$("#acc-"+v);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},80);break;
    case "cal-prev": calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);renderJournal();break;
    case "cal-next": calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);renderJournal();break;

    /* Réglages */
    case "backup-copy": copyText(backupJSON(),"Sauvegarde copiée"); break;
    case "backup-restore":
      var raw=($("#restoreIn").value||"").trim();
      try{var bk=JSON.parse(raw);if(!bk||bk.app!=="douze-marches"||!bk.docs)throw 0;if(bk.premium&&bk.premium.id)P.set("premium",bk.premium);var now=Date.now();Object.keys(bk.docs).forEach(function(k2){if(!/^[a-z0-9-]{1,40}$/.test(k2))return;var d2=bk.docs[k2];if(d2&&typeof d2==="object"){d2._t=now;DOCS[k2]=d2;writeLocal(k2);queueRemote(k2);}});loadFavs();toast("Sauvegarde restaurée");closeSheet();show(view,true);}
      catch(err){toast("Ce texte n’est pas une sauvegarde Douze Marches");}
      break;
    case "wipe":
      if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Confirmer : tout effacer";return;}
      var tnow=Date.now();Object.keys(DOCS).forEach(function(k3){DOCS[k3]={_t:tnow};writeLocal(k3);queueRemote(k3);});
      loadFavs();openEx={};toast("Données effacées");closeSheet();show("aujourdhui");break;
  }
});
$("#q").addEventListener("input",function(){clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,140);});
$("#q").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();this.blur();}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(!$("#sheet").hidden)closeSheet();else if(!$("#search").hidden)closeSearch();}});
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&view==="aujourdhui"&&$("#sheet").hidden&&!rerenderPending){var a=document.activeElement;if(!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))){var y=window.scrollY;show(view,true);window.scrollTo(0,y);}}});

/* ---------- Démarrage ---------- */
loadLocal();loadFavs();
$("#brandMark").outerHTML=bowl({id:"douze-marches",hue:205},"brand-mark");
applyPrefs();renderTabs();route();
updatePill();setInterval(tickTrial,5000);if(forceEnd)setTimeout(function(){openPaywall(true);},500);
initRemote();
if(!window.claude){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}catch(e){}
  if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}

})();
</script>

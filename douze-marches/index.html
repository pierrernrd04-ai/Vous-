r lancer l’élan.",[2,3,5]],["we654d",0,"Ils t’interrogent sur le vin et les jeux de hasard. Dis : “Dans les deux il y a un grand péché et quelques avantages pour les hommes, mais leur péché est plus grand que leur utilité.”","","Coran","Texte sacré de l’islam, VIIe siècle","Sourate 2 (La Vache), verset 219",1,"Le verset frappe par sa méthode : il ne nie pas les « avantages » du vin et du jeu, il les pèse. Les commentateurs classiques y voient une étape d’une pédagogie progressive. Ce raisonnement en balance rejoint un outil central de l’entretien motivationnel, qui invite à reconnaître honnêtement ce que la consommation apporte avant d’examiner ce qu’elle coûte. Ce que l’on nie garde son pouvoir ; ce que l’on pèse peut être dépassé.","Trace deux colonnes honnêtes : « ça m’apporte », « ça me coûte ». Entoure ce qui pèse le plus.",[1,2,4]],["192usu4",0,"J’ai cherché un but que tous les hommes s’accordent à trouver bon et à poursuivre, et je n’en ai trouvé qu’un : chasser l’inquiétude.","","Ibn Hazm","Penseur et poète andalou, Cordoue, XIe s.","Les Caractères et la conduite (Kitâb al-akhlâq wa-l-siyar)",0,"Le penseur andalou observe que le jouisseur, l’ambitieux, l’amoureux ou l’ascète poursuivent au fond la même chose : faire taire le souci. Appliquée à l’addiction, l’idée désarme le jugement : on boit souvent pour se soulager, non par goût du vice. Ibn Hazm conclut que la plupart des chemins échouent, et la dépendance en offre l’exemple flagrant : ce qui chasse l’inquiétude un soir la ramène souvent multipliée. La vraie question devient : quel apaisement dure ?","Note ce qui t’inquiète au moment où l’envie arrive, et cherche une façon d’apaiser ce souci-là directement.",[5,10]],["pzhkv8",0,"Quand l’eau a dépassé la tête, qu’importe un empan ou cent empans.","","Proverbe persan","Sagesse populaire, Iran","",1,"Le proverbe exprime une logique que chacun connaît : une fois submergé, peu importe de s’enfoncer davantage. En matière d’addiction, c’est exactement la pensée qui transforme un écart en rechute, ce qu’Alan Marlatt a nommé l’effet de violation de l’abstinence : « puisque j’ai bu un verre, autant finir la bouteille ». Le citer ici sert à reconnaître cette voix. Car, contrairement à l’eau, un verre n’engloutit personne : on peut s’arrêter au premier.","Si un écart arrive, dis à voix haute « un verre n’est pas cent », puis appelle quelqu’un dans l’heure.",[2,6,8]],["bw6ikg",0,"De quelque point de la perte que l’on fasse demi-tour, c’est un gain.","Zararın neresinden dönülse kârdır.","Proverbe turc","Sagesse populaire, Turquie","",1,"Né dans le monde marchand, le proverbe répond au piège des coûts irrécupérables : on persiste dans une mauvaise affaire parce qu’on y a déjà trop investi. Appliqué à la consommation, il défait deux pensées toxiques, « c’est trop tard » et « la soirée est fichue ». Arrêter au deuxième verre plutôt qu’au cinquième, à quarante ans plutôt qu’à soixante : chaque demi-tour, quel que soit le moment, épargne quelque chose de réel.","Au cœur d’une mauvaise passe, demande-toi : « Que puis-je encore épargner à partir de maintenant ? »",[10]],["oehdmn",0,"Comme un arbre abattu repousse si ses racines restent intactes et solides, ainsi la souffrance renaît sans cesse tant que la tendance latente à la soif n’est pas extirpée.","","Dhammapada","Recueil de paroles du Bouddha, Inde ancienne","Dhammapada, 338",1,"Le verset appartient au chapitre consacré à tanhâ, la soif. Sa leçon touche directement la rechute : abattre le tronc, c’est cesser de consommer ; mais si la racine, le besoin que le produit comblait, reste vivante, des rejets reviennent. Ce n’est pas un verdict d’échec, c’est une indication de travail. L’abstinence dégage l’espace ; la guérison consiste à s’occuper patiemment de ce qui, en dessous, réclamait.","Si l’envie revient après une période sobre, demande-toi quelle racine elle signale : fatigue, solitude, colère ou ennui ?",[4,5]],["1lzdiqi",0,"Six dangers guettent qui s’adonne aux boissons enivrantes : la perte immédiate de ses biens, la multiplication des querelles, la porte ouverte aux maladies, la mauvaise réputation, l’impudeur, et l’affaiblissement de l’intelligence.","","Sigālovāda-sutta","Enseignement du Bouddha, canon pâli","Dīgha-nikāya, 31",1,"Adressé à un jeune laïc, ce discours n’a rien d’un sermon ascétique : il parle argent, disputes, santé, réputation, dignité et lucidité. Le Bouddha y adopte un registre pragmatique, celui des conséquences visibles ici et maintenant. La liste a la structure d’un bilan, que l’on peut reprendre point par point sans honte ni exagération. Son ordre est éclairant : le dernier danger, l’intelligence affaiblie, est justement celui qui empêche de voir les cinq autres.","Reprends les six dangers un par un et note, pour chacun, un fait précis de ta propre histoire.",[5,8,12]],["1k55dnz",0,"L’homme qui s’attarde en pensée sur les objets des sens s’y attache ; de l’attachement naît le désir, et du désir la colère ; de la colère vient l’égarement, et de l’égarement la confusion de la mémoire.","","Bhagavad-Gîtâ","Texte sacré hindou, Inde ancienne","Bhagavad-Gîtâ, II, 62-63",1,"La Gîtâ décrit une chaîne dont le premier maillon est minuscule : une pensée sur laquelle on s’attarde. La rumination sur l’objet désiré nourrit l’attachement puis le désir ; et le désir contrarié devient irritation, jusqu’à brouiller la mémoire de ce qu’on voulait vraiment. Les thérapies d’acceptation parlent de fusion avec ses pensées. Le texte ne demande pas de les chasser, mais de ne pas y élire domicile.","Quand une pensée de consommation revient, nomme-la (« voilà la pensée du verre ») et ramène doucement ton attention ailleurs.",[4]],["zztx3l",0,"Jamais le désir ne s’apaise par la jouissance des objets désirés ; comme le feu nourri de beurre clarifié, il ne fait que croître davantage.","","Mahâbhârata","Épopée sanskrite, Inde ancienne","Ādi-parvan, histoire du roi Yayâti",1,"Le roi Yayâti, raconte l’épopée, obtint de son fils qu’il lui cède sa jeunesse et jouit des plaisirs pendant mille ans ; il en tira ce vers. L’image rituelle est parlante : le beurre versé dans le feu sacré ne l’éteint pas, il le fait monter. C’est une description antique de la tolérance : satisfaire l’envie ne la clôt pas, cela la relance plus haut. La paix ne viendra donc pas d’une ultime satisfaction.","Rappelle-toi une fois où tu t’es dit « juste ce soir, et après ça ira » : qu’est-il arrivé ensuite ?",[2,10]],["ln5wek",0,"Nous n’avons pas consommé les plaisirs, ce sont eux qui nous ont consommés ; […] le temps ne s’en est pas allé, c’est nous qui nous en allons ; la soif n’a pas vieilli, c’est nous qui avons vieilli.","","Bhartrihari","Poète sanskrit, Inde, vers le Ve s.","Vairāgya-śataka (Cent stances sur le détachement)",0,"Le poète joue sur le verbe sanskrit bhuj, qui signifie à la fois jouir et manger : celui qui croyait se servir des plaisirs découvre qu’il en était la nourriture. Le dernier vers est d’une lucidité rare. Avec les années, le corps s’use, mais l’envie, elle, reste jeune et exigeante. Cette asymétrie n’appelle pas le désespoir ; elle invite à cesser d’attendre que la soif s’éteigne seule, et à reprendre l’initiative.","Écris une phrase sur le modèle de Bhartrihari : « Je croyais tenir…, c’est… qui me tenait. »",[2,12]],["mupujt",0,"Raisonner un homme ivre, c’est descendre sous l’eau avec une torche pour chercher celui qui s’est noyé.","","Tiruvalluvar","Poète et moraliste tamoul, Inde ancienne","Tirukkural, 929",0,"Le Tirukkural consacre tout un chapitre au refus de l’alcool, avec une concision implacable. Ce distique s’adresse à l’entourage autant qu’au buveur : argumenter avec quelqu’un d’ivre est aussi vain qu’éclairer le fond de l’eau avec une flamme. Le conseil est pratique. Les conversations importantes, les reproches et les décisions se tiennent à jeun ; tenter de convaincre en pleine ivresse épuise les proches et n’atteint personne.","Si tu es proche d’une personne qui boit, reporte toute discussion importante à un moment où elle est sobre.",[2,3]],["1hrqo6c",0,"Quand, n’ayant pas bu, il voit un homme ivre, ne songe-t-il pas à l’égarement où il tombe lui-même lorsqu’il boit ?","","Tiruvalluvar","Poète et moraliste tamoul, Inde ancienne","Tirukkural, 930",0,"Le distique joue sur un miroir : l’ivresse se voit mal de l’intérieur et très bien de l’extérieur. Valluvar ne propose pas de mépriser l’homme ivre, mais de s’en servir comme d’un reflet, à jeun, au moment où la lucidité est disponible. Cette décentration rejoint un ressort des groupes d’entraide : se reconnaître dans le récit d’un autre ouvre souvent les yeux plus sûrement que tous les avertissements.","La prochaine fois que tu vois quelqu’un d’ivre, remplace le jugement par cette question : « Qu’est-ce que je reconnais ? »",[12,2,8]],["17i21r8",0,"Ce que l’on boit éloigne la raison et fait entrer la folie dans l’esprit ; on ne distingue plus les siens des étrangers.","","Guru Amar Das","Troisième guru des sikhs, Pendjab, XVIe s.","Guru Granth Sahib, p. 554",0,"Le sikhisme proscrit les intoxicants, et ce distique en donne une raison relationnelle plus que morale : sous l’emprise, on ne reconnaît plus les siens. C’est souvent ce que décrivent les proches, une personne aimée devenue étrangère pour quelques heures. Le texte place ainsi la sobriété du côté de la reconnaissance mutuelle. Rester lucide, c’est rester présent à ceux qui comptent et savoir les distinguer des compagnons de hasard.","Pense à une personne qui compte pour toi et à ce qu’elle mérite de retrouver de toi, ce soir ou demain.",[2,10,11]],["1j79rk5",0,"Le chameau aime manger des buissons épineux ; plus il en mange, plus le sang coule de sa bouche, et pourtant il continue d’en manger et ne s’en détourne jamais.","","Ramakrishna","Mystique hindou, Bengale, XIXe s.","L’Enseignement de Ramakrishna (Sri Sri Ramakrishna Kathamrita)",0,"Ramakrishna employait cette image pour les hommes prisonniers de leurs attachements, et elle décrit exactement la conduite addictive : continuer malgré les conséquences, critère central des définitions cliniques actuelles. Le sang n’arrête pas le chameau, parce que la blessure ne suffit pas à défaire l’envie. Le constat a une portée pratique : souffrir davantage ne guérit pas, et attendre de toucher le fond n’est pas une stratégie ; il faut autre chose que la douleur pour changer.","Cesse d’attendre le « fond » : écris trois raisons positives d’arrêter qui ne dépendent d’aucune nouvelle blessure.",[2,6]],["1loefd5",0,"Tenaces sont les entraves, mais mon cœur souffre quand j’essaie de les briser.","","Rabindranath Tagore","Poète bengali, prix Nobel 1913","L’Offrande lyrique (Gitanjali), 28, 1912",0,"Tagore saisit ce que l’entretien motivationnel appelle l’ambivalence : vouloir se libérer et tenir à ses chaînes, en même temps et sans hypocrisie. Le poème poursuit en avouant qu’il a presque honte d’espérer la liberté. Cette gêne à désirer guérir est fréquente, et elle ne trahit aucun manque de volonté. Reconnaître les deux mouvements, au lieu de nier l’un d’eux, est souvent ce qui permet enfin d’avancer.","Écris deux phrases honnêtes, l’une commençant par « Je veux arrêter parce que… », l’autre par « Je tiens encore à… ».",[1,3,5]],["1bqb6pp",0,"Comme le ver à soie […] qui meurt dans les fils de son propre corps, je brûle de désirer ce que le cœur désire.","","Akka Mahadevi","Poétesse mystique, Karnataka, XIIe s.","Vachana (poème en kannada)",0,"Figure de la tradition shivaïte vîrashaiva, Akka Mahadevi choisit une image d’une précision troublante : le ver à soie fabrique avec sa propre substance l’enveloppe qui l’emprisonne. Le désir n’y est pas un ennemi extérieur, mais un tissage intime, fait de ce que l’on a de plus vivant. Le poème s’achève sur une demande d’aide adressée au divin : la sortie du cocon, pour elle, ne se fait pas seule.","Identifie un fil que tu tisses toi-même chaque jour autour de l’envie (un trajet, un horaire) et dénoue-le.",[10]],["1tod3fv",0,"Avec une corde de fil non tordu, je hale une barque sur la mer. […] Comme l’eau dans des coupes d’argile crue, je m’écoule.","","Lal Ded (Lalla)","Poétesse mystique, Cachemire, XIVe s.","Vakh (poème en cachemiri)",1,"Lalla, figure majeure de la mystique cachemirie, peint l’effort solitaire avec deux images d’impuissance : une corde trop lâche pour haler la barque, une coupe qui ne retient rien. Transmis oralement pendant des siècles, ses vers disent l’épuisement de qui veut traverser par ses seules forces. Entre les deux images, elle prie qu’on la fasse passer. L’aveu de faiblesse n’y est pas une défaite : c’est le moment où l’on cesse de tirer seul.","Repère où tu tires seul sur la corde, et confie ce point précis à quelqu’un cette semaine.",[1,8]],["1x0p5ed",0,"Libre, bien libre je suis, délivrée de trois choses tordues : mon mortier, mon pilon et mon bossu de mari. […] Ce qui me menait vers le devenir est arraché.","","Muttā (Therīgāthā)","Nonne bouddhiste, Inde ancienne","Therīgāthā, 11",1,"Les Therīgāthā, chants des premières nonnes bouddhistes, comptent parmi les plus anciens textes attribués à des femmes. Muttā, dont le nom signifie « libérée », y mêle l’humour et le sublime : la délivrance d’une vie domestique écrasante et celle, plus profonde, de la soif qui « mène au devenir ». La joie y est concrète, presque espiègle. Elle rappelle que la liberté retrouvée se fête, et qu’elle délivre aussi de rôles qui étouffaient.","Écris ta propre liste de « trois choses tordues » dont la sobriété t’a libéré, ou te libérera.",[8]],["7m5srk",0,"Dors en paix, petite ancienne, enveloppée du vêtement que tu t’es fait ; ton désir s’est apaisé comme des herbes séchées dans une jarre.","","Therīgāthā (nonne anonyme)","Chants des premières nonnes bouddhistes, Inde ancienne","Therīgāthā, 1",1,"C’est le tout premier verset des chants des nonnes, adressé selon la tradition à une femme restée sans nom. Il promet une chose modeste et immense : le sommeil. Pour qui a connu les nuits agitées, les réveils anxieux ou les insomnies du sevrage, l’image parle directement. Le désir n’a pas été arraché avec violence ; il a séché lentement, comme des herbes que l’on conserve, désormais inoffensives.","Ce soir, crée un petit rituel de coucher sobre (tisane, page de lecture, lumière douce) et savoure ce sommeil-là.",[2,5,7]],["i04tpv",0,"Tenir un vase et le remplir jusqu’au bord ne vaut pas de s’arrêter à temps ; une lame aiguisée à l’extrême ne garde pas longtemps son tranchant.","","Lao-tseu","Sage taoïste, Chine antique","Tao-tö-king, 9",0,"Le taoïsme se méfie du trop-plein : ce qui est rempli au maximum déborde, ce qui est affûté à l’extrême s’émousse. Lao-tseu ne parle pas d’alcool, mais d’une logique de surenchère que toute dépendance connaît, celle du « encore un peu ». La sagesse n’est pas de frôler le bord sans le franchir, mais de reconnaître la valeur de l’arrêt lui-même. Pour beaucoup de personnes dépendantes, le moment juste se situe d’ailleurs avant le premier verre.","Repère dans ta journée un « encore un peu » (écran, verre, travail) et pratique l’arrêt bien avant le bord.",[8,10]],["l8bv7h",0,"Chez ceux dont les appétits sont profonds, les ressorts célestes sont superficiels.","","Tchouang-tseu","Philosophe taoïste, Chine, IVe s. av. J.-C.","Tchouang-tseu, chap. 6 (« Le Grand Maître »)",0,"Pour Tchouang-tseu, le « ressort céleste » (tianji) désigne la spontanéité naturelle, cette vitalité qui fait réagir juste sans calcul. Plus les appétits se creusent, plus cette source s’amincit. Le constat éclaire une plainte fréquente au début de l’arrêt : plus rien ne fait plaisir. Les petites joies ont été recouvertes, non détruites. La sobriété laisse la source remonter, lentement, à mesure que l’appétit cesse d’occuper tout l’espace.","Note chaque soir une petite joie spontanée de la journée, même minuscule, pour voir la source remonter.",[10]],["vrwttm",0,"Pour nourrir le cœur, rien ne vaut de réduire ses désirs.","","Mencius","Philosophe confucéen, Chine, IVe s. av. J.-C.","Mencius, VII B, 35",0,"Mencius pense le cœur, xin, comme une pousse à cultiver : il porte en germe tout ce qu’il faut pour bien vivre, à condition qu’on ne l’étouffe pas. La suite précise que chez l’homme aux désirs peu nombreux, ce qui se perd du cœur est rare, et qu’il en va inversement chez l’homme aux désirs multiples. Réduire n’est pas se mortifier, c’est désencombrer pour que le meilleur respire.","Retire de ta semaine une seule sollicitation inutile (notification, détour par le bar, achat réflexe) et observe l’espace libéré.",[11]],["1t03m8c",0,"Sur le chemin du désir, ne profite pas de sa facilité pour y tremper le doigt, ne serait-ce qu’un instant : à peine le doigt trempé, on s’enfonce de dix mille toises.","","Hong Zicheng","Lettré chinois, fin des Ming, XVIe-XVIIe s.","Propos sur la racine des légumes (Caigentan)",0,"Hong Zicheng mêle confucianisme, taoïsme et bouddhisme chan dans des maximes d’une grande économie. Celle-ci vise l’argument le plus séducteur de la rechute : « juste un peu, juste pour goûter ». La disproportion entre le doigt et les dix mille toises dit l’asymétrie du risque : l’essai coûte peu à faire et beaucoup à défaire. D’où une règle simple, précieuse surtout dans les premiers mois : ne pas tester.","Prépare ta réponse au « juste un verre, pour goûter » et répète-la à voix haute avant ta prochaine sortie.",[9,11]],["1ysjtnq",0,"Boire du poison pour étancher sa soif.","","Proverbe chinois","Expression proverbiale (chengyu), Chine","",1,"L’expression remonte à un texte de la dynastie des Han postérieurs, qui compare un remède désastreux au fait d’apaiser sa soif avec du vin empoisonné. Elle décrit avec une concision parfaite l’automédication : le produit soulage réellement, sur le moment, une souffrance réelle, qu’il s’agisse d’anxiété, de tristesse ou de solitude. Le reconnaître évite le mépris de soi. Mais le soulagement aggrave le mal qu’il calme, et la soif revient plus forte.","Nomme la soif réelle que le verre apaisait, puis trouve-lui une source sans poison : repos, parole, mouvement.",[8,10,11]],["1l5k4x1",0,"Je commence à comprendre qu’arrêter est un bien : ce matin, vraiment, j’arrête.","","Tao Yuanming","Poète, Chine, IVe-Ve s.","Arrêter le vin (Zhi jiu)",0,"Tao Yuanming est l’un des grands chantres chinois du vin, et ce poème joue malicieusement : chacun de ses vers contient le mot « arrêter ». Plus haut, il avoue qu’arrêter lui ôte toute joie, avant de basculer vers cette décision. On peut sourire de la résolution matinale, si familière à qui l’a prise cent fois. Le poème garde pourtant une vérité : la décision mûrit à travers l’ambivalence, et finit par se dire au présent.","Formule ta décision au présent et pour aujourd’hui seulement : « Ce matin, vraiment, j’arrête. » Écris-la et date-la.",[1,2,3]],["ya9hqr",0,"Il y a en ce monde bien des choses que je ne comprends pas. À la moindre occasion, on offre d’abord du saké et l’on s’amuse à forcer les gens à boire : pour quelle raison, je ne le comprends pas.","","Yoshida Kenkō","Moine et essayiste, Japon, XIVe s.","Les Heures oisives (Tsurezuregusa), 175",0,"Moine lettré du Japon médiéval, Kenkō s’étonne il y a près de sept siècles de ce qui passe encore pour de la convivialité : l’insistance à faire boire. Son ironie déplace la question. L’étrange n’est pas celui qui refuse, mais l’usage qui pousse à boire contre son gré. Le passage offre une légitimité ancienne à tous ceux qui, aujourd’hui, doivent encore justifier leur verre d’eau en société.","Prépare une phrase brève, sans justification, pour refuser un verre, et emploie-la à la prochaine insistance.",[2,9,10]],["1cdtj73",0,"On l’appelle le premier des cent remèdes, mais toutes les maladies naissent du saké.","","Yoshida Kenkō","Moine et essayiste, Japon, XIVe s.","Les Heures oisives (Tsurezuregusa), 175",0,"Kenkō répond à une formule venue de Chine, où l’on qualifiait le vin de « chef des cent remèdes ». Plutôt que de nier la croyance, il en retourne la tournure, avec une hyperbole assumée. Le procédé est utile contre les rationalisations ordinaires : « ça me détend », « ça m’aide à dormir », « c’est bon pour le cœur ». Chaque bienfait prétendu mérite d’être posé à côté de ce qu’il coûte.","Liste les « remèdes » que tu attribuais à l’alcool et cherche, pour chacun, un remède sans effet secondaire.",[6,8]],["2p22nj",0,"Le regret qui vient avant est un profit ; le regret qui vient après ne sert à rien.","Sesal dahulu pendapatan, sesal kemudian tiada berguna.","Proverbe malais","Sagesse populaire, Malaisie et Indonésie","",1,"Le proverbe distingue deux regrets : celui qui arrive trop tard, et celui qu’on anticipe, qui devient une boussole. La psychologie de la décision parle de regret anticipé : se représenter son état futur pour éclairer le choix présent. La formule n’interdit pas le regret d’après ; elle le dit stérile s’il s’installe en reproche. Mieux vaut le convertir en lucidité pour la prochaine fois, ce qui est déjà un profit.","Avant de décider, imagine-toi demain matin et demande-toi ce que cette personne-là te remercierait d’avoir choisi.",[2,3,11]],["1jzymg6",0,"Si tu tombes et te blesses, personne ne te tend la main ; tes compagnons de beuverie se lèvent et disent : “Dehors, l’ivrogne !”","","Enseignement d’Any","Sagesse de l’Égypte ancienne, Nouvel Empire","",1,"Dans ce texte de sagesse égyptienne, un scribe met en garde son fils contre la taverne. L’observation est sociale autant que morale : les compagnons de boisson ne sont pas forcément des amis, et l’ivresse dissout les liens qu’elle semblait créer. Il ne s’agit pas d’humilier celui qui tombe, mais de distinguer la camaraderie du verre de la fidélité véritable. Le rétablissement commence souvent par ce tri, douloureux et libérateur.","Note qui t’a tendu la main sans verre à la main, et donne-lui de tes nouvelles cette semaine.",[7,8]],["5r6m3q",0,"L’ivrogne de vin finit par dessoûler ; l’ivrogne de richesses ne dessoûle jamais.","Mlevi wa mvinyo hulevuka, mlevi wa mali halevuki.","Proverbe swahili","Sagesse populaire, Afrique de l’Est","",1,"Le proverbe élargit le mot « ivresse » à toute passion qui gouverne, et suggère que certaines dépendances sont plus sournoises que l’alcool parce qu’elles ne connaissent pas de lendemain qui dégrise. Il rappelle utilement que l’arrêt d’un produit ne règle pas tout : l’avidité peut se déplacer vers l’argent, le travail, les écrans. La sobriété au sens large consiste à repérer aussi les ivresses qui ne disent pas leur nom.","Demande-toi quelle « ivresse » sans alcool a pris de la place depuis que tu as réduit ou arrêté.",[]],["1i9gk6e",0,"Le pire état de l’homme, c’est où il perd la connaissance et gouvernement de soi.","","Michel de Montaigne","Philosophe et essayiste, France, XVIe s.","Essais, II, 2 (« De l’ivrognerie »)",0,"Montaigne, peu enclin à la sévérité, consacre pourtant un chapitre entier à l’ivrognerie, qu’il range parmi les vices « grossiers et brutaux ». Ce qui l’inquiète n’est pas le plaisir, qu’il défend ailleurs, mais la perte de deux biens : savoir ce que l’on fait et se conduire soi-même. Sa définition est précieuse parce qu’elle ne mesure aucune quantité. Elle pose une seule question : dans ces moments-là, qui gouverne ?","Après chaque occasion à risque, pose-toi la question de Montaigne : « Qui gouvernait ce soir, moi ou l’envie ? »",[1,10]],["161q0ff",0,"Ô Dieu ! que les hommes mettent dans leur bouche un ennemi qui leur vole la cervelle !","O God, that men should put an enemy in their mouths to steal away their brains!","William Shakespeare","Dramaturge et poète, Angleterre, XVIe-XVIIe s.","Othello, acte II, scène 3",0,"Cassio, lieutenant estimé, vient de perdre son grade après une rixe provoquée par l’ivresse où Iago l’a poussé. Sa plainte associe l’intime et le social : l’ennemi n’est pas dehors, on l’introduit soi-même. La scène montre aussi un mécanisme souvent oublié. Cassio savait qu’il supportait mal le vin et l’avait dit, mais il a cédé à l’insistance d’un faux ami. La vulnérabilité se joue souvent dans le refus qu’on n’ose pas tenir.","Repère la personne qui insiste le plus pour te faire boire, et décide à l’avance de la distance à garder.",[3,5]],["1oa4o9y",0,"Comme un noyé, un sot et un fou : un verre au-delà de la chaleur en fait un sot, le deuxième le rend fou, et le troisième le noie.","Like a drowned man, a fool, and a madman: one draught above heat makes him a fool; the second mads him; and a third drowns him.","William Shakespeare","Dramaturge et poète, Angleterre, XVIe-XVIIe s.","La Nuit des rois, acte I, scène 5",0,"À Olivia qui lui demande à quoi ressemble un homme ivre, le bouffon Feste répond par cette gradation. Sous la plaisanterie, il décrit la dose qui dépasse « la chaleur », c’est-à-dire le seuil où le réconfort bascule en altération. Le fou de Shakespeare, comme souvent, dit vrai : la pente s’accélère à mesure qu’on la descend, et chaque verre rend le suivant plus facile à accepter, car celui qui juge est déjà touché.","Repère le moment précis où, autrefois, le réconfort basculait, et ce qui t’y conduisait chaque fois.",[2,5]],["1yzqnb2",0,"Sois tempérant dans le boire, en considérant que le vin pris avec excès ne garde aucun secret et ne tient aucune parole.","Sé templado en el beber, considerando que el vino demasiado ni guarda secreto ni cumple palabra.","Miguel de Cervantès","Romancier, Espagne, XVIe-XVIIe s.","Don Quichotte, II, 43",0,"Parmi les conseils que Don Quichotte donne à Sancho avant qu’il ne gouverne son île, celui-ci touche une conséquence rarement nommée de l’excès : la perte de fiabilité. Le vin trahit les confidences et fait manquer les promesses, deux choses sur lesquelles reposent la confiance et le pouvoir d’agir. Pour qui se rétablit, retrouver une parole qui tient, envers les autres comme envers soi, est l’un des bénéfices les plus concrets et les plus réparateurs.","Fais aujourd’hui une petite promesse réaliste à quelqu’un, et tiens-la : c’est ainsi que la parole se reconstruit.",[3,5,8]],["1e3jwlr",0,"Qu’un homme ne se fie pas trop à sa victoire sur sa nature, car la nature peut rester longtemps enfouie, et pourtant revivre à l’occasion ou à la tentation.","But let not a man trust his victory over his nature too far; for nature will lay buried a great time, and yet revive upon the occasion or temptation.","Francis Bacon","Philosophe et homme d’État, Angleterre, XVIe-XVIIe s.","Essais, « De la nature chez les hommes », 1625",0,"Bacon illustre l’idée par la fable d’Ésope : une chatte changée en femme se tient sagement à table jusqu’à ce qu’une souris passe. L’avertissement n’est pas pessimiste, il est stratégique. Une habitude ancienne ne disparaît pas, elle s’endort, et certaines circonstances peuvent la réveiller. D’où l’intérêt de continuer à protéger son rétablissement même après des années, sans honte, comme on entretient une digue qui a bien tenu.","Même après un long temps sobre, garde une ou deux protections simples (un contact, une règle) et honore-les.",[5]],["t5iuba",0,"Il y a dans le cœur humain une génération perpétuelle de passions, en sorte que la ruine de l’une est presque toujours l’établissement d’une autre.","","François de La Rochefoucauld","Moraliste, France, XVIIe s.","Maximes, 10",0,"La Rochefoucauld a observé ce que les cliniciens appellent le transfert de dépendance : on arrête l’alcool, et le jeu, les achats, le travail ou les écrans prennent le relais. La maxime n’est pas un fatalisme ; elle invite à la vigilance pendant la période où le vide cherche à se remplir. Elle suggère aussi une piste : si les passions se succèdent, mieux vaut choisir consciemment celle qui viendra, plutôt que la laisser s’installer seule.","Observe ce qui a grandi dans ta vie depuis l’arrêt, et choisis délibérément une passion qui nourrit.",[3,10]],["1q4l61m",0,"Si nous résistons à nos passions, c’est plus par leur faiblesse que par notre force.","","François de La Rochefoucauld","Moraliste, France, XVIIe s.","Maximes, 122",0,"Fidèle à son pessimisme lucide, La Rochefoucauld dégonfle la fierté de celui qui résiste : souvent, la tentation était simplement faible ce jour-là. Lue du côté du rétablissement, la maxime devient un conseil pratique plutôt qu’une humiliation. Puisque la volonté a ses limites, mieux vaut réduire la force des passions : éviter les lieux, les heures et les états, comme la fatigue ou la solitude, qui les rendent puissantes.","Plutôt que de muscler ta volonté, affaiblis l’envie : supprime un déclencheur précis de ton environnement dès aujourd’hui.",[7,3,6]],["175n1lg",0,"La seule chose qui nous console de nos misères est le divertissement, et cependant c’est la plus grande de nos misères.","","Blaise Pascal","Philosophe et mathématicien, France, XVIIe s.","Pensées, Lafuma 414 / Brunschvicg 171",0,"Chez Pascal, le divertissement désigne tout ce qui nous détourne de nous-mêmes, la chasse, le jeu, les affaires, et l’on y ajouterait aisément le verre. Il ne le condamne pas par austérité : il en montre le double effet, consoler et empêcher de penser, donc empêcher de guérir. La suite du fragment ajoute que, sans lui, nous serions dans l’ennui, et que cet ennui nous pousserait à chercher un moyen plus solide d’en sortir.","Accorde-toi dix minutes d’ennui volontaire, sans écran ni verre, et note ce qui remonte.",[]],["1a9w8vo",0,"Rien n’est si insupportable à l’homme que d’être dans un plein repos, sans passions, sans affaire, sans divertissement, sans application. Il sent alors son néant, son abandon, son insuffisance, sa dépendance, son impuissance, son vide.","","Blaise Pascal","Philosophe et mathématicien, France, XVIIe s.","Pensées, Lafuma 622 / Brunschvicg 131",0,"Le fragment décrit exactement ce que vivent beaucoup de personnes dans les premières semaines sans alcool : le soir libre devient soudain vertigineux. Pascal énumère ce qui surgit dans le silence, jusqu’au mot « dépendance ». Il ne s’agit pas de fuir ce moment, mais de savoir qu’il est normal, transitoire et habitable. La tolérance au vide s’apprend, et les soirées remplies autrement, sans frénésie, deviennent peu à peu supportables, puis bonnes.","Prépare pour tes soirées vides une courte liste d’activités calmes, et choisis-en une avant que l’ennui ne choisisse pour toi.",[11,1,3]],["jzxsts",0,"J’appelle Servitude l’impuissance de l’homme à gouverner et réduire ses affects ; soumis aux affects, en effet, l’homme ne relève pas de lui-même, mais de la fortune.","","Baruch Spinoza","Philosophe, Provinces-Unies, XVIIe s.","Éthique, IV, préface",0,"Spinoza définit la servitude sans un mot de reproche : c’est une impuissance, non une faute. Celui qui est mené par ses affects dépend de la « fortune », des circonstances qui les déclenchent. La suite ajoute qu’il est alors souvent contraint, voyant le meilleur, de faire le pire. Pour Spinoza, la liberté ne s’obtient pas en s’accusant mais en comprenant : dès qu’on s’en forme une idée claire, une passion cesse d’être une passion.","Décris ta dernière envie comme un phénomène naturel, sans juger : quand, où, après quoi, avec quelle intensité ?",[1,8]],["1df2d73",0,"Un ivrogne croit dire par un libre décret de l’âme ce que, revenu à son état normal, il voudrait avoir tu.","","Baruch Spinoza","Philosophe, Provinces-Unies, XVIIe s.","Éthique, III, proposition 2, scolie",0,"Spinoza prend l’ivrogne comme exemple de l’illusion du libre arbitre : nous nous croyons libres parce que nous avons conscience de nos actes, tout en ignorant les causes qui les déterminent. L’exemple n’a rien de méprisant, il voisine avec l’enfant qui réclame son lait. Paradoxalement, reconnaître qu’on n’était pas libre en buvant libère : la honte s’allège, et s’ouvre la voie d’une liberté réelle, fondée sur la connaissance des causes.","Repère une parole regrettée prononcée sous l’effet de l’alcool, et cherche ce qui, en toi, voulait vraiment être dit.",[5,8,10]],["17wh54a",0,"L’impulsion du seul appétit est esclavage, et l’obéissance à la loi qu’on s’est prescrite est liberté.","","Jean-Jacques Rousseau","Philosophe et écrivain, Genève, XVIIIe s.","Du contrat social, I, 8, 1762",0,"Rousseau parle ici de la liberté morale, celle qui seule « rend l’homme vraiment maître de lui ». La formule déjoue une confusion courante : suivre toutes ses envies passe pour de la liberté, alors que c’est obéir à ce qui nous pousse. Inversement, une règle que l’on s’est donnée n’est pas une prison, c’est un engagement choisi. Le mot décisif est « prescrite » : une règle imposée du dehors tient moins bien que celle qu’on a faite sienne.","Rédige toi-même, avec tes mots, une règle courte pour ta sobriété, et relis-la chaque matin pendant une semaine.",[]],["qd6mm",0,"L’abstinence m’est aussi facile que la modération me serait difficile.","Abstinence is as easy to me, as temperance would be difficult.","Samuel Johnson","Écrivain et lexicographe, Angleterre, XVIIIe s.","Propos rapportés par Hannah More",0,"Johnson, qui avait cessé de boire, répondait ainsi à Hannah More qui l’engageait à prendre un peu de vin : il ne savait pas boire « un peu ». Sa phrase défait le préjugé qui fait de la modération la voie raisonnable et de l’abstinence un excès. Pour certains tempéraments, le « pas du tout » est plus simple que le « juste un peu », qui oblige à négocier sans cesse. Se connaître, c’est choisir sa voie.","Demande-toi honnêtement si le « juste un peu » te coûte plus d’énergie que le « pas du tout ».",[1,2,7]],["kxmdzs",0,"Ainsi je titube du désir à la jouissance, et dans la jouissance je languis après le désir.","So tauml’ ich von Begierde zu Genuß, / Und im Genuß verschmacht’ ich nach Begierde.","Johann Wolfgang von Goethe","Poète et dramaturge, Allemagne, XVIIIe-XIXe s.","Faust I, « Forêt et caverne », v. 3249-3250",0,"Faust résume le cercle qui l’épuise : le désir pousse vers la jouissance, mais à peine atteinte, celle-ci laisse un manque qui relance le désir. Le verbe « tituber » dit tout : c’est une démarche d’homme ivre, même sans vin. Goethe place cet aveu dans la bouche d’un homme qui a parié ne jamais trouver d’instant qui le comble. On y lit la mécanique de l’addiction, où la satisfaction devient le point de départ du manque suivant.","Observe ce que tu ressens dix minutes après une satisfaction rapide : apaisement durable, ou nouveau manque ?",[11]],["ee906x",0,"Les eaux ont passé sur moi. Mais du fond de ces noirs abîmes, si l’on pouvait m’entendre, je crierais à tous ceux qui n’ont encore posé qu’un pied dans le flot périlleux.","The waters have gone over me. But out of the black depths, could I be heard, I would cry out to all those who have but set a foot in the perilous flood.","Charles Lamb","Essayiste et poète, Angleterre, XIXe s.","Confessions d’un ivrogne (Confessions of a Drunkard), 1813",0,"Lamb écrit cette confession à une époque où l’ivrognerie relève du sermon plutôt que de la médecine, et il choisit pourtant la première personne. Son cri s’adresse à ceux qui commencent : le moment où l’on peut encore reculer facilement est aussi celui où l’on se croit le moins concerné. La phrase porte une générosité discrète. Même submergé, l’auteur se tourne vers les autres, ce dont les fraternités d’entraide feront plus tard une méthode.","Si tu as traversé le flot, pense à quelqu’un qui n’y a qu’un pied, et offre-lui simplement ton écoute.",[12,5]],["qzjajc",0,"Je choisis la meilleure part, et je manquai de la force de m’y tenir.","I chose the better part and was found wanting in the strength to keep to it.","Robert Louis Stevenson","Romancier, Écosse, XIXe s.","L’Étrange Cas du Dr Jekyll et de Mr Hyde, 1886",0,"Dans sa confession finale, Jekyll raconte comment la potion qui libérait Hyde est devenue une dépendance : d’abord choisie, puis nécessaire, enfin plus forte que lui. Le roman est souvent lu comme une parabole de l’addiction, et cette phrase en saisit le cœur. La décision ne suffit pas ; la tenir sans soutien, sous la pression du manque, est une autre affaire. Le drame de Jekyll tient aussi à ce qu’il a lutté seul, dans le secret.","Ne garde pas ta décision secrète : confie-la à une personne de confiance qui pourra t’aider à t’y tenir.",[3,5,12]],["w3sfsn",0,"Je peux résister à tout, sauf à la tentation.","I can resist everything except temptation.","Oscar Wilde","Écrivain et dramaturge, Irlande, XIXe s.","L’Éventail de Lady Windermere, acte I, 1892",0,"Lord Darlington lance ce trait d’esprit en souriant, et son paradoxe contient une vérité sérieuse : la volonté semble solide partout, sauf là où elle est sollicitée. On surestime volontiers sa capacité à résister au moment critique, ce que les psychologues nomment le biais de retenue. La conclusion pratique est modeste : plutôt que de compter sur sa force face à la tentation, organiser sa vie pour la croiser le moins souvent possible.","Ne teste pas ta résistance : repère une situation tentante de la semaine et organise-toi pour l’éviter.",[1,2,3]],["1v9gb5t",0,"La cause de la consommation universelle du haschich, de l’opium, du vin, du tabac ne réside ni dans le goût, ni dans le plaisir, ni dans la distraction, ni dans la gaieté qu’ils procurent, mais uniquement dans le besoin de se dissimuler les exigences de la conscience.","","Léon Tolstoï","Romancier et penseur, Russie, XIXe-XXe s.","Pourquoi les hommes s’enivrent-ils ?, 1890",0,"Tolstoï, qui avait beaucoup bu et joué dans sa jeunesse, fonde en 1887 une société de tempérance et défend dans cet essai une thèse radicale : on s’étourdit pour ne plus entendre sa conscience. On peut nuancer, car la douleur, l’anxiété ou la solitude jouent aussi leur rôle. Mais l’intuition reste forte : le produit sert souvent à faire taire une voix intérieure qui, entendue à jeun, indiquerait ce qui doit changer.","Quand l’envie vient, demande-toi quelle pensée tu aimerais ne pas entendre en ce moment, et écris-la.",[2,6]],["1ce3bsy",0,"Car il faut que chaque homme puisse aller au moins quelque part.","","Fiodor Dostoïevski","Romancier, Russie, XIXe s.","Crime et Châtiment, Ire partie, chap. 2, 1866",0,"Marmeladov, fonctionnaire déchu et buveur, parle à Raskolnikov dans une taverne. Sous le pathos affleure une vérité nue : celui qui boit a souvent perdu tous les lieux où il pouvait aller sans honte, et le cabaret reste le dernier qui l’accueille. Dostoïevski donne à l’homme ivre une dignité et une parole. La phrase rappelle que sortir de l’alcool suppose aussi d’avoir ailleurs où aller : des lieux et des personnes qui ouvrent la porte.","Dresse la liste des lieux où l’on t’accueille sans verre, puis rends-toi dans l’un d’eux cette semaine.",[1,5,8]],["12n1jco",0,"Demain, demain, tout sera fini !","","Fiodor Dostoïevski","Romancier, Russie, XIXe s.","Le Joueur, dernière phrase, 1866",0,"Ainsi s’achève le roman qu’un Dostoïevski lui-même ruiné par la roulette dicta en moins d’un mois. Le narrateur promet d’arrêter… demain, comme toujours. La phrase est d’autant plus poignante qu’elle sonne comme un espoir ; elle désigne le piège le plus doux de la dépendance, la décision sincère mais reportée. L’auteur, lui, cessera de jouer quelques années plus tard, ce qui ôte au roman son air de fatalité.","Remplace chaque « demain » par une action minuscule faite aujourd’hui, même imparfaite, et note-la.",[2,3,7]],["tmq6ye",0,"… comment ce jeune homme fait sortir de lui l’esclave goutte à goutte, et comment, s’éveillant un beau matin, il sent que ce n’est plus un sang d’esclave qui coule dans ses veines, mais un vrai sang d’homme.","","Anton Tchekhov","Écrivain et médecin, Russie, XIXe s.","Lettre à Alexeï Souvorine, 7 janvier 1889",0,"Petit-fils d’un serf affranchi, Tchekhov propose à son éditeur le sujet d’un récit où un jeune homme se libère de sa servilité, et c’est sa propre histoire qu’il esquisse. L’image du goutte-à-goutte est précieuse pour le rétablissement : la liberté n’arrive pas d’un coup, elle se gagne par une infinité de petits gestes, jusqu’au matin où l’on constate qu’on a changé. Ce matin-là ne se décrète pas, il se prépare.","Choisis aujourd’hui une goutte de servitude à faire sortir (un réflexe, un mensonge, un détour) et note-la.",[9,10]],["10wa86w",0,"On l’appelle le héron de l’oubli, celui qui plane au-dessus des beuveries : il dérobe l’esprit des hommes.","","Hávamál","Poème eddique, Scandinavie médiévale","Hávamál, strophe 13 (Edda poétique)",1,"Dans ces « Dits du Très-Haut », placés dans la bouche d’Odin, la sagesse nordique ne prône pas l’abstinence mais se méfie de l’excès de bière, qui fait perdre l’esprit. L’image du héron, oiseau qui guette immobile avant de frapper, figure l’oubli qui attend son heure au-dessus des tablées. Le dieu avoue même avoir été « enchaîné » par ses plumes. Que le plus sage des dieux confesse cette perte rend l’aveu profondément humain.","Note un souvenir que l’alcool t’a volé, puis un souvenir sobre récent que tu tiens à garder intact.",[3,5]],["1geecik",0,"Pour l’homme ivre, la mer n’arrive qu’aux genoux, et la flaque jusqu’aux oreilles.","","Proverbe russe","Sagesse populaire, Russie","",1,"La première moitié est souvent citée seule, comme un éloge de l’audace que donnerait l’alcool. La seconde la corrige avec un humour noir : l’homme qui se croit invincible devant la mer se noie dans une flaque. Le proverbe décrit la distorsion du jugement sous l’effet de l’ivresse, qui surestime ses forces et sous-estime les dangers. Le courage chimique est un courage d’emprunt, qu’il faut toujours rembourser.","Demande-toi ce que tu n’osais faire qu’après un verre, et cherche un premier pas sobre, même petit, pour l’oser.",[12]],["11f36j4",0,"On me proclame chaste : c’est qu’on n’a pas découvert l’hypocrite que je suis.","Castam me praedicant, qui non deprehenderunt hypocritam.","Héloïse","Abbesse et lettrée, France, XIIe s.","Seconde lettre à Abélard",0,"Abbesse admirée, Héloïse refuse les éloges qu’on fait de sa conduite : son corps s’abstient, mais son désir persiste, et elle ne veut pas qu’on confonde les deux. Cette honnêteté rare éclaire le rétablissement. Ne pas consommer n’éteint pas aussitôt l’envie, et prétendre le contraire isole. Reconnaître, au moins devant quelqu’un, que le désir est encore là n’est pas un échec : c’est ce qui empêche la sobriété de devenir une façade.","Dis à une personne sûre où en est vraiment ton envie aujourd’hui, sans l’embellir ni la dramatiser.",[10,1,6]],["1qijo3i",0,"L’amour de l’étude est de toutes les passions celle qui contribue le plus à notre bonheur.","","Émilie du Châtelet","Physicienne et philosophe, France, XVIIIe s.","Discours sur le bonheur",0,"Traductrice de Newton et joueuse invétérée, Émilie du Châtelet connaissait les passions qui ruinent ; son Discours ne les condamne pas en bloc, il les hiérarchise. L’étude a pour elle un avantage décisif : c’est une ressource sur laquelle on garde la main, et dont le plaisir grandit au lieu de s’épuiser. L’idée rejoint une stratégie du rétablissement : remplacer une passion qui consume par une passion qui construit, plutôt que vivre dans le vide.","Choisis un sujet qui t’intrigue et consacre-lui le créneau horaire où tu buvais autrefois.",[2]],["gkvw7o",1,"La plus grande tragédie de nos vies est peut-être que la liberté est possible, et que nous pouvons pourtant passer nos années prisonniers des mêmes vieux schémas.","","Tara Brach","Psychologue et enseignante de méditation, États-Unis","L’Acceptation radicale (Radical Acceptance), 2003",0,"Tara Brach décrit ce qu’elle appelle la « transe de l’indignité » : une vie entière organisée autour de la peur de ne pas être à la hauteur, faite d’efforts, de contrôle et d’autocritique. La liberté évoquée n’est pas spectaculaire ; elle commence quand on remarque le schéma au lieu de le subir. Le mot « tragédie » n’accuse personne : il souligne l’écart entre ce qui est possible et ce que l’habitude nous laisse vivre.","Nomme un vieux schéma qui se répète dans ta vie, et observe-le une fois aujourd’hui sans le suivre ni te juger.",[2,1,4]],["1x1lc69",1,"Mon Seigneur Dieu, je n’ai aucune idée de l’endroit où je vais.","","Thomas Merton","Moine trappiste et écrivain, États-Unis, XXe s.","Pensées dans la solitude, 1958",0,"Ainsi commence la prière la plus célèbre de Thomas Merton, moine trappiste et écrivain prolifique. Elle avoue d’emblée ce que l’on cache d’ordinaire : ne pas savoir où l’on va, ne pas voir la route, ne pas même se connaître vraiment. La suite reconnaît qu’on peut se tromper en croyant bien faire. Cette lucidité désarmée n’est pas du désespoir ; elle libère de la prétention de tout contrôler, que l’on soit croyant ou non.","Écris une phrase qui commence par « Je ne sais pas où je vais, mais… » et complète-la honnêtement.",[1,11,2]],["1brbvy2",1,"La bonté adoucit le changement.","","Octavia E. Butler","Romancière de science-fiction, États-Unis, XXe s.","La Parabole du semeur, 1993",0,"Dans ce roman d’anticipation, l’héroïne fonde une philosophie, Earthseed, dont le cœur est l’acceptation du changement comme loi du monde. Ce verset en tire une conséquence pratique : si l’on ne peut empêcher les bouleversements, on peut en adoucir la traversée, pour soi et pour les autres. La bonté n’est pas une naïveté face au chaos ; c’est la manière la plus réaliste d’y survivre ensemble.","Pendant une période de changement, ajoute un geste de bonté par jour, envers toi ou quelqu’un d’autre.",[12,8]],["hka18q",1,"Pour être un bon danseur, avec toi comme ailleurs, il ne faut pas savoir où cela mène. Il faut suivre, être allègre, être léger, et surtout n’être pas raide.","","Madeleine Delbrêl","Assistante sociale, poétesse et mystique, France, XXe s.","« Le bal de l’obéissance »",0,"Assistante sociale et poétesse, Madeleine Delbrêl vécut parmi les ouvriers d’Ivry et décrivit sa foi comme une danse avec Dieu. L’image renverse notre besoin de contrôle : un danseur qui exige de connaître toute la chorégraphie avant de bouger ne danse jamais. Suivre, rester léger, ne pas se raidir sont des qualités physiques autant que spirituelles, qui valent pour toute période où l’avenir reste illisible.","Mets une musique et danse trois minutes sans chorégraphie, en suivant seulement le rythme.",[1,2,3]],["q9vzka",1,"Cela ne peut être évité.","","Proverbe inuit","Expression inuite, Arctique","",1,"Ajurnamat est une expression inuite d’acceptation face aux aléas d’un environnement extrême : tempête, chasse manquée, glace qui cède. Elle n’exprime pas le découragement, mais l’économie d’énergie d’un peuple qui ne pouvait se permettre de s’épuiser contre l’inévitable. Comme toute formule fataliste, sa sagesse dépend de l’usage : elle aide face aux éléments, beaucoup moins face aux injustices humaines.","Face à un aléa aujourd’hui, dis « ajurnamat », puis dirige aussitôt ton énergie vers ce qui reste faisable.",[8,10]],["3biqpj",1,"Suis ton destin, arrose tes plantes, aime tes roses ; le reste est l’ombre d’arbres étrangers.","","Fernando Pessoa (Ricardo Reis)","Poète, Portugal, XXe s.","Odes de Ricardo Reis",0,"Ricardo Reis, l’hétéronyme stoïcien et épicurien de Pessoa, condense en trois gestes une sagesse de la limite : suivre sa route, prendre soin de ce qui pousse près de soi, aimer ce qui est à portée. Tout le reste, ambitions, comparaisons, inquiétudes pour ce qui ne nous regarde pas, n’est qu’ombre portée par d’autres arbres. Le jardin devient une image du lâcher-prise : cultiver le sien, et laisser le reste.","Aujourd’hui, prends soin d’une seule « plante » de ta vie, et renonce à t’occuper de l’ombre des arbres voisins.",[3,2,4]],["14qhoiz",1,"La limite de ce que nous pouvons accepter est la limite de notre liberté.","The boundary to what we can accept is the boundary to our freedom.","Tara Brach","Psychologue et enseignante de méditation, États-Unis","L’Acceptation radicale (Radical Acceptance), 2003",0,"Psychologue et enseignante de méditation, Tara Brach a popularisé l’expression « acceptation radicale ». Sa phrase dessine une carte : là où nous ne pouvons accepter une émotion, un souvenir, une part de nous, nous perdons notre liberté de mouvement, car tout notre comportement s’organise pour l’éviter. Accepter n’est pas aimer ce qui fait mal ; c’est cesser de laisser la peur décider de la taille de notre vie.","Repère une émotion que tu évites à tout prix, et demande-toi ce que cet évitement t’interdit de vivre.",[3,4,11]],["11qro97",1,"Notre tâche n’est pas de réparer le monde entier d’un seul coup, mais de nous étirer pour réparer la part du monde qui est à notre portée.","Ours is not the task of fixing the entire world all at once, but of stretching out to mend the part of the world that is within our reach.","Clarissa Pinkola Estés","Psychanalyste jungienne et conteuse, États-Unis","",0,"Psychanalyste jungienne d’ascendance mexicaine, élevée dans une famille hongroise, Estés écrit ce texte pour des militants épuisés par l’ampleur des injustices. Elle distingue l’impuissance face au tout et la puissance réelle face à la partie. Vouloir tout réparer mène au découragement, ne rien faire au cynisme. Entre les deux, une voie modeste : réparer ce qui est à portée de bras. Lâcher l’immensité, c’est retrouver une échelle humaine.","Nomme une seule chose à ta portée cette semaine, dans ce qui te désole, et fais-la.",[1,3,7]],["mb5eae",1,"Tout ce qui m’est cher et agréable changera, et j’en serai séparé.","","Le Bouddha (Upajjhatthana Sutta)","Fondateur du bouddhisme, Inde, Ve s. av. J.-C.","Anguttara Nikaya, 5, 57",1,"C’est la cinquième des « choses à contempler souvent », après la vieillesse, la maladie et la mort, et avant la responsabilité de nos actes. Le Bouddha propose de les méditer non pour se terrifier, mais pour défaire l’illusion de permanence que donnent la jeunesse et la santé. Contempler la séparation n’éteint pas l’amour ; cela le rend plus attentif, moins possessif, et prépare doucement à ce qui viendra.","Pense à une personne aimée, dis-toi doucement « je ne t’aurai pas toujours », puis offre-lui une attention aujourd’hui.",[11,2,6]],["1vvsonj",1,"Je croyais que l’éveil consistait à pouvoir mourir sereinement en toute circonstance ; c’était une erreur : l’éveil, c’est pouvoir vivre sereinement en toute circonstance.","","Masaoka Shiki","Poète, rénovateur du haïku, Japon, XIXe s.","Un lit de malade de six pieds (Byōshō rokushaku), 1902",0,"Cloué au lit par une tuberculose osseuse, Shiki tient jusqu’à sa mort une chronique quotidienne de son petit espace de malade. Il y corrige une idée héroïque de la sagesse : l’enjeu n’est pas d’affronter la fin sans trembler, mais de vivre chaque jour, même entravé, avec calme. Venant d’un homme qui souffrait beaucoup, la phrase n’a rien d’une formule facile : c’est une acceptation conquise jour après jour.","Dans une situation qui t’entrave, cherche une seule façon de vivre ce jour-ci un peu plus calmement.",[10,11]],["129o26",1,"Les mois et les jours sont les voyageurs de l’éternité ; les années qui vont et viennent sont elles aussi des voyageurs.","","Matsuo Bashō","Poète, maître du haïku, Japon, XVIIe s.","La Sente étroite du Bout-du-Monde (Oku no hosomichi), 1689",0,"Ainsi s’ouvre le journal du grand voyage de Bashō vers le nord du Japon, entrepris après avoir vendu sa cabane. Le poète ne voit pas le temps comme une possession qui s’épuise, mais comme un compagnon de route qui passe. Cette image change le rapport à la perte : on ne retient pas un voyageur, on chemine avec lui un moment. Bashō en tire une manière de vivre légère, sans demeure fixe, qu’on peut transposer sans tout quitter.","Pense à une année difficile de ta vie comme à un voyageur venu puis reparti, et note ce qu’il t’a laissé.",[9]],["14frb2f",1,"Notre affaire n’est peut-être pas de percer le secret de la rose ; notre affaire est peut-être de flotter dans l’enchantement de la rose.","","Sohrab Sepehri","Poète et peintre, Iran, XXe s.","« Le Bruit des pas de l’eau », 1965",0,"Le poète iranien prend le contre-pied d’une soif de maîtrise intellectuelle : vouloir tout comprendre, tout expliquer, y compris ce qui nous fait du bien. Le « peut-être » répété est délicat ; il propose sans imposer. Certaines expériences, l’amour, la beauté, le deuil, se vivent mieux qu’elles ne s’analysent. Lâcher l’exigence d’explication laisse l’expérience nous porter, comme une eau sur laquelle on flotte.","Choisis une chose belle aujourd’hui et abstiens-toi de l’analyser : laisse-toi simplement porter par elle une minute.",[1,3,5]],["xr1qb",1,"Avoir quelque chose, c’est, en même temps, être lié par cette chose.","","Beopjeong","Moine bouddhiste et essayiste, Corée du Sud, XXe s.","Non-possession (Musoyu), 1976",0,"Le moine coréen raconte avoir passé des années à soigner une orchidée offerte, au point de s’inquiéter pour elle dès qu’il s’absentait ; il finit par la donner et se sent délivré. Son essai, devenu un classique en Corée, ne condamne pas la possession, mais l’attachement qu’elle crée. Chaque bien nous possède un peu. Lâcher un objet, c’est parfois retrouver une liberté qu’on ignorait avoir perdue.","Choisis un objet qui t’inquiète plus qu’il ne te réjouit, et demande-toi s’il serait mieux entre d’autres mains.",[12,1,2]],["ylb66a",1,"Celui qui attache à lui une joie détruit la vie ailée.","He who binds to himself a joy / Does the winged life destroy","William Blake","Poète et graveur, Angleterre, XVIIIe-XIXe s.","« Eternity », carnet de notes, vers 1793",0,"Le court poème de Blake se poursuit : celui qui embrasse la joie au vol vit dans le lever du soleil de l’éternité. L’image de l’oiseau est parlante : capturé, il cesse d’être ce qu’on aimait en lui. Vouloir retenir un bonheur, une relation, un moment, revient souvent à l’étouffer. Le lâcher-prise n’y est pas renoncement à la joie, mais la seule manière de la garder vivante.","Lors d’un bon moment aujourd’hui, savoure-le pleinement, puis laisse-le s’envoler sans chercher à le prolonger.",[3,10]],["1d4edpt",1,"Marche selon l’Ordre de Sa volonté, ô Nanak, ainsi qu’il est inscrit.","","Guru Nanak","Fondateur du sikhisme, Inde, XVe-XVIe s.","Japji Sahib, 1",0,"Ce vers conclut la première strophe du Japji, prière récitée chaque matin par les sikhs. Il répond à la question posée juste avant : comment devenir vrai, comment abattre le mur du mensonge ? Non par la pensée, le silence forcé ou l’accumulation des biens, dit Nanak, mais en accordant sa marche au hukam, l’ordre divin qui régit toute chose. L’acceptation y est active : marcher, et non s’asseoir, au rythme de ce qui est.","Ce matin, demande-toi : à quel rythme la vie m’invite-t-elle à marcher aujourd’hui, et comment m’y accorder ?",[11,3,6]],["p4kzal",1,"Parmi les choses, les unes dépendent de nous, les autres n’en dépendent pas.","","Épictète","Philosophe stoïcien, Grèce, Ier-IIe s.","Manuel, 1",0,"Première ligne du Manuel, et tout le stoïcisme en découle : nos jugements, nos désirs et nos actes relèvent de nous ; le corps, la réputation, les autres et les événements, non. Ancien esclave, Épictète savait de quoi il parlait. Le tri n’invite pas à la passivité : il concentre l’effort là où il a prise, et retire l’angoisse de ce qui n’en a aucune.","Prends un souci actuel et répartis-le en deux colonnes : ce qui dépend de moi, ce qui n’en dépend pas.",[9,12]],["2uf07i",1,"Le changement se produit lorsqu’on devient ce que l’on est, et non lorsqu’on essaie de devenir ce que l’on n’est pas.","change occurs when one becomes what he is, not when he tries to become what he is not.","Arnold Beisser","Psychiatre et gestalt-thérapeute, États-Unis, XXe s.","« The Paradoxical Theory of Change », 1970",0,"Ancien champion de tennis paralysé par la poliomyélite, Beisser a formulé cette « théorie paradoxale du changement », pilier de la Gestalt-thérapie. Lutter contre ce qu’on est entretient un tiraillement entre une part qui exige et une part qui résiste. Habiter pleinement sa situation présente libère l’énergie gelée dans ce conflit. Le paradoxe n’interdit pas les objectifs : il change seulement le point de départ.","Remplace aujourd’hui « je devrais être… » par une description exacte de ce que tu es en ce moment.",[10,11]],["z0adcw",1,"Quand vous vous disputez avec la réalité, vous perdez, mais seulement dans cent pour cent des cas.","When you argue with reality, you lose—but only 100% of the time.","Byron Katie","Autrice et formatrice, États-Unis, née en 1942","Aimer ce qui est (Loving What Is), 2002",0,"L’humour désamorce le tranchant. Katie vise les pensées du type « il ne devrait pas » ou « cela n’aurait pas dû arriver », qui opposent au réel une version idéale et produisent colère et impuissance. Sa méthode consiste à interroger ces pensées plutôt que les faits. Accepter la réalité n’implique pas d’approuver ce qui arrive : c’est partir de ce qui est pour agir, au lieu de s’épuiser contre.","Repère une pensée en « il ou elle devrait », et demande-toi : comment je réagis quand je crois cette pensée ?",[1,4]],["1p1b8je",1,"La seule chose qui rende la vie possible, c’est l’incertitude permanente et intolérable : ne pas savoir ce qui vient ensuite.","The only thing that makes life possible is permanent, intolerable uncertainty: not knowing what comes next.","Ursula K. Le Guin","Romancière, États-Unis, XXe-XXIe s.","La Main gauche de la nuit, 1969",0,"Dans le roman, la phrase vient d’une société qui a développé l’art de prédire l’avenir et en a mesuré le prix : connaître la réponse tue la question. Le Guin, nourrie de taoïsme, retourne notre angoisse habituelle. L’incertitude n’est pas seulement un fardeau ; elle est la condition de la liberté, du désir et de la surprise. La tolérer demande un travail, mais c’est elle qui laisse de l’avenir possible.","Choisis une inconnue de ta vie et énumère trois possibilités qu’elle laisse ouvertes, pas seulement trois dangers.",[2,5]],["38hnm1",1,"On ne peut pas ramasser tous les beaux coquillages de la plage. On ne peut en ramasser que quelques-uns, et ils sont plus beaux s’ils sont peu nombreux.","One cannot collect all the beautiful shells on the beach. One can collect only a few, and they are more beautiful if they are few.","Anne Morrow Lindbergh","Écrivaine et aviatrice, États-Unis, XXe s.","Solitude face à la mer (Gift from the Sea), 1955",0,"Pendant un séjour solitaire sur une île de Floride, l’aviatrice et écrivaine médite sur les coquillages ramassés au bord de l’eau. Elle découvre que l’accumulation abîme la beauté : un coquillage seul sur l’appui de la fenêtre se voit, cent se perdent. Le renoncement devient une condition de la présence. Choisir, c’est accepter de laisser des merveilles sur le sable, sans en faire un deuil.","Choisis un domaine de ta vie trop rempli, et repose délibérément un « coquillage », même beau.",[3,11]],["1jv5y7z",1,"La grâce comble, mais elle ne peut entrer que là où il y a un vide pour la recevoir.","","Simone Weil","Philosophe, France, XXe s.","La Pesanteur et la grâce, 1947",0,"Philosophe engagée jusqu’à l’épuisement, Simone Weil décrit dans ses cahiers un mouvement contre-intuitif : on ne reçoit qu’en renonçant à combler soi-même tous les vides. Nos stratégies pour éviter le manque, l’activité, la distraction, les certitudes, occupent la place où quelque chose de neuf pourrait entrer. Le vide n’est pas ici une dépression ; c’est un espace consenti, une attente sans objet qu’on accepte de laisser ouverte.","Laisse un vide aujourd’hui : dix minutes sans rien remplir, ni écran, ni tâche, ni projet.",[3,10]],["185oxq4",1,"Pour vivre en ce monde, il faut être capable de trois choses : aimer ce qui est mortel ; le serrer contre ses os en sachant que sa propre vie en dépend ; et, quand vient le moment de le laisser partir, le laisser partir.","","Mary Oliver","Poétesse, États-Unis, XXe-XXIe s.","« In Blackwater Woods », American Primitive, 1983",0,"Le poème naît d’une promenade d’automne, au milieu d’arbres qui se défont de leurs feuilles. Mary Oliver ne propose pas le détachement comme un idéal froid : la deuxième des trois choses exige au contraire d’aimer de toutes ses forces. C’est la tenue des deux qui fait la difficulté et la beauté : serrer ce qui est mortel, puis, le moment venu, ouvrir les mains. L’un ne vaut rien sans l’autre.","Pense à quelqu’un ou à quelque chose que tu aimes et qui passera : savoure-le aujourd’hui en le sachant.",[3,10]],["1ck1v4h",1,"La Voie suprême n’est pas difficile, elle évite seulement de choisir. Sans amour ni haine, elle apparaît clairement.","","Sengcan","Troisième patriarche du chan, Chine, VIe s.","Xinxin ming (Inscription sur la foi en l’esprit)",0,"Ainsi s’ouvre l’un des plus anciens poèmes chan, attribué au troisième patriarche. « Choisir » désigne ici la préférence crispée : vouloir ceci, refuser cela, avant même de voir ce qui est. Le texte ne prône pas l’indifférence morale ; il observe que la souffrance naît souvent de l’écart entre la réalité et nos préférences. Moins on s’y accroche, plus le réel apparaît tel qu’il est.","Aujourd’hui, devant un petit imprévu, suspends trois secondes ton « j’aime ou je n’aime pas » et regarde simplement.",[4,10]],["c9q8hh",1,"Sans accepter le fait que tout change, nous ne pouvons trouver une parfaite sérénité.","","Shunryu Suzuki","Moine zen japonais, fondateur à San Francisco, XXe s.","Esprit zen, esprit neuf (Zen Mind, Beginner’s Mind), 1970",0,"Moine japonais installé à San Francisco, Shunryu Suzuki a enseigné le zen à des Américains pressés d’obtenir des résultats. Sa phrase inverse la recherche habituelle : on cherche la sérénité dans la stabilité, alors qu’elle naît de l’acceptation du changement. Le mot anglais, composure, évoque une tenue intérieure plutôt qu’une absence de trouble. La sérénité n’est pas l’arrêt du mouvement, c’est l’accord avec lui.","Nomme une chose qui change dans ta vie en ce moment, et dis-lui intérieurement : « Je te vois changer. »",[2,6]],["djp161",1,"Pour contrôler votre mouton ou votre vache, donnez-lui une vaste prairie.","","Shunryu Suzuki","Moine zen japonais, fondateur à San Francisco, XXe s.","Esprit zen, esprit neuf (Zen Mind, Beginner’s Mind), 1970",0,"Suzuki applique l’image à l’esprit pendant la méditation : vouloir arrêter les pensées les agite davantage ; leur laisser de l’espace les apaise. Le paradoxe vaut au-delà du zazen. Avec soi-même comme avec les autres, le contrôle serré produit souvent la résistance qu’il prétend empêcher. Une prairie vaste n’est pas une absence de cadre ; c’est un cadre assez large pour que la liberté y soit possible.","Pendant cinq minutes, laisse tes pensées aller où elles veulent, comme un troupeau dans un grand pré, sans les rappeler.",[1,2,3]],["9mfqrr",1,"Repose-toi du souci de diriger tes affaires : ce dont un autre s’est chargé pour toi, ne t’en charge pas toi-même.","","Ibn Ata Allah d’Alexandrie","Maître soufi, Égypte, XIIIe-XIVe s.","Hikam (Aphorismes), 4",0,"Maître de la confrérie chadhilie à Alexandrie, Ibn Ata Allah vise ici le tadbîr, cette planification anxieuse par laquelle on veut tout prévoir et tout maîtriser. Pour le croyant, Dieu s’est déjà chargé de l’essentiel ; vouloir le faire à sa place épuise. Le texte n’invite pas à la passivité, puisque le soufisme valorise l’effort ; il dénonce l’inquiétude qui prétend porter ce qui ne nous revient pas.","Fais deux listes : ce que je dois faire aujourd’hui, et ce que je prétends porter sans le pouvoir. Repose la seconde.",[1,3,6]],["1btpbx8",1,"Attache ton chameau, puis remets-t’en à Dieu.","","Hadith (rapporté par at-Tirmidhî)","Tradition prophétique de l’islam","",1,"Selon la tradition rapportée par at-Tirmidhî, un bédouin demande au Prophète s’il doit laisser sa chamelle libre en se fiant à Dieu ; la réponse remet les choses dans l’ordre : d’abord l’attacher, ensuite s’en remettre. Le hadith est un garde-fou précieux contre un contresens fréquent sur le lâcher-prise. Accepter ce qui ne dépend pas de nous n’a de sens qu’après avoir fait ce qui en dépend.","Avant de lâcher un souci, vérifie que ton « chameau » est attaché : as-tu fait la part qui te revient ?",[3]],["1on8xgh",1,"Toute fortune doit être surmontée en la supportant.","Superanda omnis fortuna ferendo est.","Virgile","Poète latin, Rome, Ier s. av. J.-C.","Énéide, V, 710",0,"Le vieux Nautès console Énée après l’incendie d’une partie de sa flotte : ce n’est pas en luttant contre le sort qu’on le vainc, mais en l’endurant. Le verbe latin ferre signifie porter : la victoire passe par la capacité de porter ce qui arrive. On aurait tort d’y voir une résignation, car Énée repart aussitôt ; l’endurance n’est pas l’immobilité, c’est l’art de continuer avec le poids.","Pour une épreuve en cours, demande-toi : comment la porter un peu mieux aujourd’hui ?",[8,9,10]],["1bp4nqa",1,"En trois mots, je peux résumer tout ce que j’ai appris sur la vie : elle continue.","","Robert Frost","Poète, États-Unis, XXe s.","",0,"Le poète américain, qui avait perdu son épouse et plusieurs de ses enfants, prononce ces mots lors d’un entretien, à près de quatre-vingts ans. Leur sobriété fait leur force : ni consolation, ni sens caché, seulement le constat que la vie poursuit sa course après les catastrophes. Pour qui est figé dans un deuil ou une crise, ce mouvement peut paraître indécent ; il devient avec le temps un appui. Continuer n’oblige pas à oublier.","Après une journée difficile, note un signe que la vie a continué : un repas, une rencontre, un rayon de soleil.",[1]],["1eduure",1,"En fin de compte, seules trois choses comptent : à quel point nous avons bien vécu, à quel point nous avons bien aimé, à quel point nous avons appris à lâcher prise.","","Jack Kornfield","Enseignant de méditation, États-Unis, né en 1945","",0,"Formé en Thaïlande auprès d’Ajahn Chah, Jack Kornfield a contribué à faire connaître la méditation vipassana en Occident. Une version déformée de sa phrase circule sous le nom du Bouddha. Le lâcher-prise y figure à égalité avec la vie et l’amour, comme une compétence de même valeur. L’ordre est parlant : on lâche d’autant mieux qu’on a vraiment vécu et aimé. Il ne s’agit pas de tenir moins, mais de savoir ouvrir la main.","Ce soir, fais le bilan de ta journée avec trois questions : ai-je bien vécu, bien aimé, bien lâché ?",[3,10,11]],["j53gb1",2,"La bienveillance n’est pas seulement pour les autres.","","Proverbe japonais","Sagesse populaire, Japon","",1,"Ce proverbe, nasake wa hito no tame narazu, est souvent mal compris, y compris au Japon, où on le lit parfois comme « aider autrui ne lui rend pas service ». Son sens traditionnel est inverse : la bienveillance accordée aux autres finit par revenir vers soi, par des chemins imprévus. Il ne prône pas un calcul intéressé ; il décrit la circulation de l’entraide dans une communauté où les gestes de soin se répondent avec le temps.","Fais aujourd’hui un geste bienveillant sans rien attendre, et laisse-le circuler sans en suivre la trace.",[12,2,10]],["ckxvzo",2,"La main droite lave la main gauche, et la main gauche lave la main droite.","Aka nri kwọọ aka ekpe, aka ekpe akwọọ aka nri.","Proverbe igbo","Sagesse populaire, Nigeria","",1,"Ce proverbe igbo décrit la réciprocité dans un geste quotidien : aucune main ne se lave seule, chacune a besoin de l’autre. Il ne s’agit pas d’un troc calculé mais d’une interdépendance naturelle. Dans les sociétés igbo, il rappelle les obligations mutuelles entre parents et voisins. Pour nous, il invite à sortir du rôle figé de l’aidant perpétuel ou de l’éternel aidé.","Dans une relation déséquilibrée, propose d’échanger un service plutôt que de toujours donner ou toujours recevoir.",[12,2,6]],["jm4u19",2,"Demander de l’aide n’est pas un signe de faiblesse, c’est un signe de force.","","Barack Obama","Président des États-Unis, XXIe s.","Discours aux écoliers américains, 8 septembre 2009",0,"Obama glisse cette phrase dans un discours de rentrée adressé aux élèves, en précisant qu’il demande lui-même de l’aide chaque jour. Le message vise un public précis : ceux qui préfèrent échouer en silence plutôt que d’avouer qu’ils ne comprennent pas. Venant d’un président, l’aveu désamorce le préjugé selon lequel les personnes fortes se débrouilleraient seules, sans jamais rien devoir à personne.","Pose aujourd’hui une question que tu n’oses pas poser, à un collègue, un professeur ou un proche.",[10,5,7]],["xl9fy9",2,"N’aie pas honte d’être aidé. Tu as à accomplir ta tâche comme un soldat à l’assaut d’un rempart. Que ferais-tu si, boiteux, tu ne pouvais monter seul sur le créneau, mais que cela te devenait possible avec l’aide d’un autre ?","","Marc Aurèle","Empereur romain et philosophe stoïcien, IIe s.","Pensées, VII, 7",0,"Que l’homme le plus puissant de son temps s’adresse cette consigne en dit long : la honte de demander n’épargne personne. Le stoïcien déplace la question du prestige vers la tâche : ce qui compte est d’atteindre le créneau, non d’y grimper seul. L’autonomie véritable consiste à mobiliser les bonnes ressources, humaines comprises, et non à refuser toute béquille par orgueil.","Identifie ton « créneau » actuel et la personne qui pourrait te faire la courte échelle. Envoie-lui un message.",[7,2,5]],["11sswtk",2,"Tant que nous ne savons pas recevoir le cœur ouvert, nous ne donnons jamais vraiment le cœur ouvert. Quand nous associons un jugement au fait de recevoir de l’aide, nous associons, sciemment ou non, un jugement au fait d’en donner.","","Brené Brown","Chercheuse en travail social, États-Unis","The Gifts of Imperfection, 2010",0,"Brown démasque l’asymétrie secrète de nombreux aidants : fiers de soutenir, honteux d’être soutenus. Or mépriser sa propre demande revient à mépriser, en creux, celle des autres, que l’on regarde alors depuis une position de supériorité. Recevoir n’est pas une dette humiliante mais l’autre moitié de l’échange. L’idée éclaire l’épuisement de ceux qui donnent sans jamais se laisser aider.","La prochaine fois qu’on te propose de l’aide, réponds « merci, volontiers » au lieu de « ça va, je gère ».",[12,5,2]],["1s9m8wg",2,"Quelle est la chose la plus courageuse que tu aies jamais dite ? demanda l’enfant. — À l’aide, répondit le cheval.","“What is the bravest thing you’ve ever said?” asked the boy. “Help,” said the horse.","Charlie Mackesy","Illustrateur et auteur, Royaume-Uni","L’Enfant, la Taupe, le Renard et le Cheval, 2019",0,"Le livre de Mackesy, né de dessins partagés en ligne, a touché un vaste public par cette inversion : le courage n’est pas l’exploit mais l’aveu du besoin. Demander de l’aide expose au refus, à la dépendance, au regard d’autrui ; c’est un acte de vulnérabilité au sens fort. Que la réponse vienne du cheval, figure de puissance tranquille, rend cet aveu d’autant plus légitime.","Écris le mot « aide » suivi du prénom de la personne à qui tu pourrais le dire cette semaine.",[5,4,7]],["14n1pig",2,"Demander de l’aide avec honte revient à dire : tu as du pouvoir sur moi. La demander avec condescendance : j’ai du pouvoir sur toi. Mais demander de l’aide avec gratitude dit : nous avons le pouvoir de nous aider les uns les autres.","Asking for help with shame says: You have the power over me. Asking with condescension says: I have the power over you. But asking for help with gratitude says: We have the power to help each other.","Amanda Palmer","Musicienne et autrice, États-Unis","The Art of Asking, 2014",0,"Palmer, qui a financé sa musique en sollicitant directement son public, analyse la demande comme une relation de pouvoir. Le même geste peut humilier, dominer ou relier selon l’état intérieur qui l’accompagne. La gratitude transforme la requête en invitation à un échange entre égaux. Utile pour qui croit devoir choisir entre fierté et besoin : il existe une troisième posture, ni soumise ni hautaine.","Avant ta prochaine demande, commence-la par « merci de considérer… » plutôt que par une excuse.",[5,7,12]],["l5jzdv",2,"Il faut, autant qu’on peut, obliger tout le monde : on a souvent besoin d’un plus petit que soi.","","Jean de La Fontaine","Poète et fabuliste, France, XVIIe s.","Fables, II, 11, « Le Lion et le Rat »",0,"Le lion épargne un rat, puis, pris dans un filet, est délivré par ce même rat qui en ronge les mailles. La Fontaine renverse la hiérarchie : la force ne protège pas de la dépendance, et la générosité envers plus faible que soi n’a rien d’un luxe. La morale démonte aussi l’idée qu’on ne pourrait recevoir d’aide que de plus puissant que soi.","Remercie aujourd’hui quelqu’un que tu places bas dans ta hiérarchie : un enfant, un stagiaire, un inconnu.",[10]],["1hesmgt",2,"Les attachements intimes à d’autres êtres humains sont le pivot autour duquel tourne la vie d’une personne, non seulement dans la petite enfance, mais tout au long de l’adolescence, de l’âge mûr et jusqu’à la vieillesse.","","John Bowlby","Psychiatre et psychanalyste, Royaume-Uni, XXe s.","Attachement et perte, vol. 3 : La Perte, 1980",0,"Bowlby écrit cette phrase au terme de sa grande trilogie, dont le dernier volume est consacré au deuil. Il voulait combattre l’idée, alors répandue, que la dépendance affective serait une immaturité à dépasser. L’adulte en bonne santé n’est pas celui qui n’a besoin de personne, mais celui qui sait s’appuyer sur d’autres et leur offrir un appui. Une réhabilitation scientifique du besoin de lien.","Remplace aujourd’hui « je ne veux déranger personne » par une demande simple à quelqu’un de proche.",[10,12]],["1jpqskp",2,"Le lien est la raison pour laquelle nous sommes ici ; c’est ce qui donne un but et un sens à nos vies.","","Brené Brown","Chercheuse en travail social, États-Unis","Conférence TED, « Le pouvoir de la vulnérabilité », 2010",0,"Brown raconte avoir commencé ses recherches pour étudier le lien et s’être heurtée à son contraire : la honte, cette peur d’être indigne de connexion. Sa conférence, l’une des plus vues au monde, montre que les personnes qui se sentent dignes d’amour acceptent d’être vues dans leur vulnérabilité. Le lien n’est donc pas un supplément d’âme : il suppose le risque de se montrer tel qu’on est.","Partage aujourd’hui avec quelqu’un de confiance une chose vraie que tu caches d’habitude, même petite.",[5,2,3]],["1vilm6t",2,"La solitude requiert d’être seul, alors que la désolation se manifeste le plus nettement en compagnie des autres.","","Hannah Arendt","Philosophe politique, Allemagne et États-Unis","Les Origines du totalitarisme, 1951",0,"Arendt distingue la solitude, où l’on reste en dialogue avec soi-même, et la désolation, loneliness en anglais, où l’on se sent abandonné de tous et de soi. Elle y voit le terreau des totalitarismes, qui prospèrent sur des masses isolées. Nuance utile aujourd’hui : on peut être entouré et désolé, ou seul et serein. Le nombre de contacts ne mesure pas la qualité du lien.","Distingue cette semaine tes moments de solitude féconde et ceux de désolation. Qu’est-ce qui les différencie ?",[3,10,12]],["1k4dw84",2,"Mes amis ont fait l’histoire de ma vie : de mille manières, ils ont transformé mes limites en de beaux privilèges.","","Helen Keller","Écrivaine et militante, États-Unis, XXe s.","",0,"Keller écrit ces mots avec une reconnaissance lucide : elle ne nie ni ses limites ni l’aide reçue, elle les tient ensemble. La phrase renverse le récit héroïque de l’individu qui triomphe seul de l’adversité. Pour beaucoup de personnes malades ou handicapées, accepter que leur histoire soit coécrite par d’autres est à la fois une blessure d’orgueil et une libération.","Écris en trois lignes l’histoire d’une limite que quelqu’un t’a aidé à transformer.",[12,2,6]],["ahafj7",2,"La société humaine est une nécessité. Les philosophes l’expriment en disant que l’homme est politique par nature.","","Ibn Khaldûn","Historien et penseur, Tunis, XIVe s.","Al-Muqaddima, livre I, 1377",0,"Ibn Khaldûn ouvre sa Muqaddima en reprenant la formule d’Aristote pour l’appuyer sur un argument concret : un homme seul ne peut ni produire sa nourriture ni se défendre ; il lui faut la coopération de beaucoup d’autres. Il forge ensuite le concept d’asabiyya, la solidarité de groupe, moteur selon lui de l’essor et du déclin des sociétés. La dépendance mutuelle fonde la civilisation.","Compte les personnes dont dépend ton repas d’aujourd’hui. Remercie l’une de celles que tu croises.",[10,12]],["1pdqfm4",2,"Ce n’est pas tant l’aide de nos amis qui nous aide que la confiance que nous avons en leur aide.","","Épicure","Philosophe grec, IVe-IIIe s. av. J.-C.","Sentences vaticanes, 34",0,"Épicure pointe un mécanisme que la recherche sur le soutien social retrouvera sous le nom de soutien perçu : savoir qu’on peut compter sur quelqu’un modifie déjà notre rapport au danger, avant tout appel. La sécurité naît de la disponibilité, pas seulement de l’intervention. Corollaire discret : être fiable pour un ami, c’est lui offrir un appui permanent, même s’il ne le sollicite jamais.","Dis aujourd’hui à quelqu’un, sans attendre qu’il le demande : « Si un jour tu as besoin, je suis là. »",[3,10]],["xm553j",2,"Mon humanité est prise, inextricablement liée, dans la vôtre.","My humanity is caught up, is inextricably bound up, in yours.","Desmond Tutu","Archevêque anglican, Afrique du Sud, XXe s.","Il n’y a pas d’avenir sans pardon (No Future Without Forgiveness), 1999",0,"Tutu traduit l’ubuntu pour un public occidental après avoir présidé la Commission vérité et réconciliation. L’enjeu dépasse la gentillesse : si mon humanité dépend de la tienne, te déshumaniser me dégrade aussi. Le lien devient une interdépendance morale, pas seulement affective. C’est ce qui lui permettait de tenir ensemble l’exigence de vérité sur les crimes et le refus de la haine.","Face à quelqu’un qui t’agace, demande-toi ce que ta façon de le traiter dit de ta propre humanité.",[1,9,12]],["1oanfud",2,"L’ami qui peut rester silencieux avec nous dans un moment de désespoir ou de confusion […], qui peut tolérer de ne pas savoir, de ne pas soigner, de ne pas guérir […], voilà un ami qui prend soin de nous.","","Henri Nouwen","Prêtre et psychologue, Pays-Bas, XXe s.","Out of Solitude, 1974",0,"Nouwen renverse l’idée que soutenir, c’est résoudre. Face à la souffrance, l’envie de conseiller ou de réparer apaise souvent l’angoisse de l’aidant plus que la peine de l’aidé. Ce qu’il décrit relève de la présence pure, celle qu’on retrouve dans l’accompagnement des malades et des endeuillés. Tolérer l’impuissance devient alors une compétence relationnelle à part entière, et non un échec.","Lors de ta prochaine conversation difficile, retiens tout conseil pendant dix minutes. Écoute, reformule, reste.",[1,2,9]],["1v3dtp8",2,"Quand la source tarit, les poissons se retrouvent ensemble sur la terre sèche ; ils s’humectent de leur haleine et se mouillent de leur écume. Mieux vaudrait qu’ils s’oublient les uns les autres dans les fleuves et les lacs.","","Zhuangzi","Penseur taoïste, Chine, IVe s. av. J.-C.","Zhuangzi, chapitre 6",0,"L’image a donné en chinois une expression célèbre pour l’entraide dans la détresse. Zhuangzi y ajoute une pointe inattendue : cette solidarité héroïque naît d’un milieu asséché. Mieux vaut un monde où l’on n’a pas besoin de se sauver mutuellement. Leçon subtile pour les liens nés du malheur : précieux, ils gagnent à évoluer vers une relation plus libre, hors du seul registre de la crise.","Pense à un lien né d’une épreuve commune. Propose à cette personne un moment heureux, sans rapport avec la crise.",[12]],["1s1uf79",2,"Il faut vivre pour autrui si tu veux vivre pour toi.","Alteri vivas oportet, si vis tibi vivere.","Sénèque","Philosophe stoïcien romain, Ier s.","Lettres à Lucilius, 48, 2",0,"Sénèque répond à Lucilius sur l’amitié et montre qu’on ne peut séparer son propre intérêt de celui des autres. Pour les stoïciens, l’être humain est fait pour la communauté ; se replier sur soi le diminue. Contresens à éviter : il ne prône pas le sacrifice de soi, mais une vie orientée vers autrui qui, par effet secondaire, se révèle plus pleine et plus libre.","Choisis une petite action utile à quelqu’un aujourd’hui, puis note ce que tu ressens après l’avoir faite.",[10,12]],["1ctuvwl",2,"Personne n’est libre tant que tout le monde n’est pa

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fox Bank">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Fox Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Mise en page : une colonne façon appli bancaire (max 560 px), barre d'onglets fixée en bas.
   Le solde vit dans une « carte » encre, seul objet appuyé ; le reste est posé à plat sur le fond. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#E9EBF0; --ink:#111723; --muted:#5B6474; --line:#DDE1E8;
  --fox:#D9531E; --fox-ink:#FFFFFF; --fox-soft:#FBE7DD;
  --card:#121926; --card-ink:#F5F7FB; --card-muted:#A9B2C3;
  --good:#0E7A3E; --bad:#C2352F;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --tabs-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F17; --surface:#141A25; --sunk:#1B2230; --ink:#EDF0F6; --muted:#9AA3B5; --line:#252E3E;
  --fox:#F07A42; --fox-ink:#1A0D06; --fox-soft:#3A2218;
  --card:#1B2333; --card-ink:#F5F7FB; --card-muted:#A9B2C3;
  --good:#3FC57E; --bad:#F06B63;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F17; --surface:#141A25; --sunk:#1B2230; --ink:#EDF0F6; --muted:#9AA3B5; --line:#252E3E;
  --fox:#F07A42; --fox-ink:#1A0D06; --fox-soft:#3A2218;
  --card:#1B2333; --card-ink:#F5F7FB; --card-muted:#A9B2C3;
  --good:#3FC57E; --bad:#F06B63;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--fox);outline-offset:2px}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabs-h) + 28px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:9px;font:700 19px/1 var(--display);letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.brand small{display:block;font:500 11.5px/1.2 var(--body);color:var(--muted);letter-spacing:0;margin-top:3px}
.top .clock{margin-left:auto;font:700 15px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--muted)}
.view{display:grid;gap:18px;padding-top:4px}

/* accueil */
.hello{display:grid;gap:4px;padding-top:6px}
.eyebrow{font:600 12.5px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hello h1{font-size:32px;line-height:1.08;font-weight:700}
.wx{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:14.5px;flex-wrap:wrap}
.wx .t{font:700 22px/1 var(--display);color:var(--ink)}
.wx svg.i{width:26px;height:26px;color:var(--fox)}

.cardbal{background:var(--card);color:var(--card-ink);border-radius:24px;padding:22px 20px 18px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(17,23,35,.18)}
.cardbal::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--fox) 45%,transparent),transparent);pointer-events:none}
.cardbal .lbl{font:600 12.5px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--card-muted);position:relative}
.cardbal .amt{font:800 clamp(34px,10vw,44px)/1.05 var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:8px;position:relative}
.cardbal .sub{font-size:13.5px;color:var(--card-muted);margin-top:8px;position:relative}
.cardbal .sub b{color:var(--card-ink);font-weight:700}
.cardbal .acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px;position:relative}
.cardbal .acts a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.08);color:var(--card-ink);text-decoration:none;font:600 13px/1.2 var(--body);text-align:center}
.cardbal .acts a svg.i{width:22px;height:22px;color:var(--fox)}
.cardbal .acts a:active{background:rgba(255,255,255,.14)}
.cardbal .head{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;position:relative}
.cardbal .chip{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--card-muted);border:1px solid rgba(255,255,255,.18);padding:6px 8px;border-radius:999px;white-space:nowrap}

.sec{display:grid;gap:12px}
.sec>h2{font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.sec>h2 .more{margin-left:auto;font:600 14px/1 var(--body);color:var(--fox);text-decoration:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font:800 26px/1.1 var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:12px}
.track i{display:block;height:100%;border-radius:5px;background:var(--fox)}
.track.thin{height:8px;border-radius:4px;margin-top:8px}
.track.thin i{border-radius:4px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.split div{background:var(--sunk);border-radius:14px;padding:10px 12px}
.split b{display:block;font:700 17px/1.2 var(--body);font-variant-numeric:tabular-nums;margin-top:2px}

.quote{border-radius:20px;padding:20px;background:var(--fox-soft);display:grid;gap:10px}
.quote blockquote{margin:0;font:600 19px/1.4 var(--display);letter-spacing:-.005em}
.quote cite{font-style:normal;font-size:14px;color:var(--muted)}
.quote .row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.tip .ico{width:40px;height:40px;border-radius:12px;background:var(--fox-soft);display:grid;place-items:center;color:var(--fox)}
.tip b{display:block;font:700 15px/1.3 var(--display);margin-bottom:2px}
.tip p{color:var(--muted);font-size:15px}

/* listes d'opérations */
.ops{display:grid}
.op{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.op:last-child{border-bottom:0}
.op .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.op .ico svg.i{width:20px;height:20px}
.op .t{min-width:0}
.op .t b{display:block;font-weight:650;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .t span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .a{font:700 15.5px/1.2 var(--body);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.op .a.in{color:var(--good)}
.op .a small{display:block;margin-top:4px}
.del{appearance:none;border:0;background:none;color:var(--muted);font:600 12.5px/1 var(--body);padding:4px 0;cursor:pointer}
.del.arm{color:var(--bad)}
.dayh{display:flex;justify-content:space-between;gap:10px;font:700 13px/1.2 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:16px 0 4px}
.dayh:first-child{padding-top:0}
.empty{color:var(--muted);text-align:center;padding:26px 12px;font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--ink);font:700 17px/1.3 var(--display);margin-bottom:4px}

/* formulaires */
.title{font-size:30px;font-weight:700;padding-top:6px}
.form{display:grid;gap:14px}
.money{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.money:focus-within{border-color:var(--fox)}
.money input{appearance:none;border:0;background:transparent;font:800 40px/1.1 var(--body);font-variant-numeric:tabular-nums;width:100%;min-width:0;outline:none;padding:0;letter-spacing:-.02em}
.money span{font:700 26px/1 var(--body);color:var(--muted)}
.lab{font:600 13px/1.2 var(--body);color:var(--muted);letter-spacing:.02em}
.field{display:grid;gap:6px;min-width:0}
.inp{appearance:none;width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px}
.inp:focus{outline:none;border-color:var(--fox)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border:0;margin:0;padding:0;min-width:0}
.cats legend{padding:0;margin-bottom:8px}
.cat{position:relative}
.cat input{position:absolute;opacity:0;pointer-events:none}
.cat label{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font:600 11.5px/1.2 var(--body);text-align:center;cursor:pointer;min-height:76px;justify-content:center}
.cat label .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff}
.cat label .dot svg.i{width:17px;height:17px}
.cat input:checked+label{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--ink)}
.cat input:focus-visible+label{outline:3px solid var(--fox);outline-offset:2px}
.btn{appearance:none;border:0;border-radius:14px;min-height:52px;padding:0 20px;font:700 16.5px/1 var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--fox);color:var(--fox-ink);width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14.5px;border-radius:12px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.hint{font-size:14px;color:var(--muted)}
.hint b{color:var(--ink)}
.preview{background:var(--sunk);border-radius:14px;padding:12px 14px;font-size:14.5px;color:var(--muted)}
.preview b{color:var(--ink);font-variant-numeric:tabular-nums}

/* mois */
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar h2{font-size:20px;font-weight:700;flex:1;text-align:center;text-transform:capitalize}
.nav-btn{appearance:none;border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.nav-btn[disabled]{opacity:.35;cursor:default}

/* budget par catégorie */
.bud{display:grid;gap:16px}
.brow{display:grid;gap:2px}
.brow .h{display:flex;align-items:center;gap:10px}
.brow .h .sw{width:12px;height:12px;border-radius:4px;flex:none}
.brow .h b{font-weight:650;font-size:15.5px;flex:1;min-width:0}
.brow .h span{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.brow .h span em{font-style:normal;color:var(--muted)}
.over{display:flex;align-items:center;gap:6px;color:var(--bad);font:600 13px/1.3 var(--body);margin-top:6px}
.over svg.i{width:16px;height:16px}
.left{font-size:13px;color:var(--muted);margin-top:6px}

/* graphique jour par jour */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .ax{font:500 10px var(--body);fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--fox)}
.chart .bar.today{fill:var(--ink)}
.chart .hit{fill:transparent}
.tipbox{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:10px;font:600 12.5px/1.3 var(--body);white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}

details.set{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 18px}
details.set summary{cursor:pointer;font:700 16px/1.3 var(--display);padding:14px 0;list-style:none;display:flex;align-items:center;gap:10px}
details.set summary::-webkit-details-marker{display:none}
details.set summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.set[open] summary::after{transform:rotate(-135deg)}
details.set .in{display:grid;gap:12px;padding-bottom:18px}
.budin{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:center}
.budin label{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;min-width:0}
.budin .sw{width:12px;height:12px;border-radius:4px;flex:none}
.eurin{position:relative}
.eurin input{padding-right:30px;text-align:right;font-variant-numeric:tabular-nums}
.eurin span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}

table.bd{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.bd td{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
table.bd td:last-child{text-align:right;font-weight:700;white-space:nowrap}
table.bd tr.tot td{border-bottom:0;font:800 18px/1.3 var(--body);padding-top:14px}
.toggle{display:flex;align-items:center;gap:12px;justify-content:space-between}
.toggle input{appearance:none;width:52px;height:32px;border-radius:16px;background:var(--sunk);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked{background:var(--fox);border-color:var(--fox)}
.toggle input:checked::after{transform:translateX(20px)}
textarea.inp{min-height:120px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.results{display:grid;gap:6px}
.results button{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer}
.results button small{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;text-decoration:none;color:var(--muted);font:600 11px/1.1 var(--body);border-radius:12px}
.tabs a svg.i{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--fox)}

#toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + 20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font:600 14.5px/1.35 var(--body);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(92vw,480px);z-index:30;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){.hello h1{font-size:36px}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="var(--fox)" d="M4 3 12 10h8l8-7 1 14-13 12L3 17Z"/><path fill="var(--surface)" d="M3 17 16 29l13-12-8 1.5-5 4.5-5-4.5Z"/><path fill="var(--ink)" d="M14.4 26.6 16 28.4l1.6-1.8Z"/><ellipse cx="11.6" cy="15" rx="1.3" ry="1.6" fill="var(--ink)"/><ellipse cx="20.4" cy="15" rx="1.3" ry="1.6" fill="var(--ink)"/></svg>
      <div>Fox Bank<small>Rusé avec ton argent</small></div>
    </div>
    <span class="clock" id="clock"></span>
  </header>
  <main class="view" id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Onglets"><div class="in" id="tabs"></div></nav>
<div id="toast" role="status"></div>

<script>
(() => {
'use strict';
/* ================= données de base ================= */
const CATS = [
  { k: 'courses', n: 'Courses', i: 'basket', b: 30000 },
  { k: 'logement', n: 'Logement', i: 'home', b: 60000 },
  { k: 'transport', n: 'Transport', i: 'car', b: 12000 },
  { k: 'sorties', n: 'Sorties & restos', i: 'fork', b: 12000 },
  { k: 'shopping', n: 'Shopping', i: 'bag', b: 10000 },
  { k: 'abonnements', n: 'Abonnements', i: 'repeat', b: 5000 },
  { k: 'sante', n: 'Santé & bien-être', i: 'heart', b: 5000 },
  { k: 'autres', n: 'Autres', i: 'dots', b: 6000 },
];
const CAT = Object.fromEntries(CATS.map((c, i) => [c.k, { ...c, col: `var(--c${i + 1})` }]));
const QUOTES = [
  ['Méfie-toi des petites dépenses : une petite fuite suffit à couler un grand navire.', 'Benjamin Franklin'],
  ["Apprenez que tout flatteur vit aux dépens de celui qui l'écoute.", 'Jean de La Fontaine, Le Corbeau et le Renard'],
  ["Ce n'est pas celui qui a trop peu qui est pauvre, mais celui qui désire davantage.", 'Sénèque'],
  ["N'épargne pas ce qui reste après avoir dépensé : dépense ce qui reste après avoir épargné.", 'Attribuée à Warren Buffett'],
  ['Les petits ruisseaux font les grandes rivières.', 'Proverbe français'],
  ["La Fourmi n'est pas prêteuse : c'est là son moindre défaut.", 'Jean de La Fontaine, La Cigale et la Fourmi'],
  ["Il ne faut pas vendre la peau de l'ours avant de l'avoir tué.", 'Proverbe, d’après La Fontaine'],

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const isoDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDay(new Date());

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const eur = (c) => (c / 100).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const eur0 = (c) => (c / 100).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 0, maximumFractionDigits: 0 });
const signed = (c) => (c > 0 ? '+' : c < 0 ? '−' : '') + eur(Math.abs(c));
const parseAmt = (s) => {
  const x = parseFloat(String(s).replace(/[\s  €]/g, '').replace(',', '.'));
  return Number.isFinite(x) && x > 0 && x < 1e8 ? Math.round(x * 100) : null;
};
const monthName = (ym) => new Date(+ym.slice(0, 4), +ym.slice(5) - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
const shiftYm = (ym, k) => { const d = new Date(+ym.slice(0, 4), +ym.slice(5) - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const dayName = (iso) => cap(new Date(iso + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
const shortDay = (iso) => new Date(iso + 'T12:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 16);
const clone = (o) => JSON.parse(JSON.stringify(o));
const dayOfYear = () => { const n = new Date(); return Math.floor((n - new Date(n.getFullYear(), 0, 0)) / 864e5); };
let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3400); }
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },

const defaultCfg = () => ({
  v: 1, name: 'Pierre', debit: true,
  anchor: { amount: 0, at: 0, set: false }, history: [],
  budgets: Object.fromEntries(CATS.map((c) => [c.k, c.b])),
  city: { name: 'Saint-Georges-sur-Loire', lat: 47.4069, lon: -0.7631 },
});
const S = { tab: 'terrier', month: ymNow(), cfg: defaultCfg(), months: {}, ready: false, quote: 0, wx: null, wxState: 'idle', arm: null };
const mergeCfg = (d) => { const c = { ...defaultCfg(), ...(d || {}) }; c.budgets = { ...defaultCfg().budgets, ...(d && d.budgets || {}) }; c.anchor = { ...defaultCfg().anchor, ...(d && d.anchor || {}) }; return c; };
const month = (ym) => S.months[ym] || { e: [], v: [] };
const spentOf = (ym) => month(ym).e.reduce((a, e) => a + e.a, 0);
const recvOf = (ym) => month(ym).v.reduce((a, v) => a + v.a, 0);
const budgetTotal = () => CATS.reduce((a, c) => a + (S.cfg.budgets[c.k] || 0), 0);
function byCat(ym) { const o = Object.fromEntries(CATS.map((c) => [c.k, 0])); for (const e of month(ym).e) o[CAT[e.c] ? e.c : 'autres'] += e.a; return o; }
/* solde actuel = dernier solde saisi + virements ajoutés depuis − dépenses ajoutées depuis */
function balance() {
  const a = S.cfg.anchor; let tin = 0, tout = 0;
  for (const m of Object.values(S.months)) {
    for (const v of m.v || []) if (v.t > a.at) tin += v.a;
    if (S.cfg.debit) for (const e of m.e || []) if (e.t > a.at) tout += e.a;
  }
  return { start: a.amount, tin, tout, now: a.amount + tin - tout };
}

/* ================= stockage : stockage privé de l'artefact (Claude) ou ce téléphone (appli) ================= */
const LS_KEY = 'foxbank-v1';
const Store = {
  mode: 'local', cfgRef: null, monthsCol: null, chain: {}, got: { cfg: false, months: false },
  async start() {
    const cl = window.claude;
    if (cl && typeof cl.use === 'function') {
      S.ready = false; render();
      let db = null, user = null;
      try { [db, user] = await Promise.all([cl.use('db'), cl.use('user')]); } catch {}
      let id = null; try { id = user ? await user.id() : null; } catch {}
      if (db && id) return this.attach(db, id);
      S.localNote = true;
    }
    this.loadLocal(); S.ready = true; render();
  },
  loadLocal() {
    try { const j = JSON.parse(ls.get(LS_KEY) || 'null'); if (j) { S.cfg = mergeCfg(j.cfg); S.months = j.months || {}; } } catch {}
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  },
  saveLocal() { if (!ls.set(LS_KEY, JSON.stringify({ cfg: S.cfg, months: S.months }))) toast("Enregistrement impossible : la mémoire de ce navigateur est pleine ou bloquée."); },
  attach(db, id) {
    this.mode = 'db';
    this.cfgRef = db.doc(`data/users/${id}/foxbank`);
    this.monthsCol = this.cfgRef.collection('months');
    const done = () => { if (this.got.cfg && this.got.months && !S.ready) { S.ready = true; } render(); };
    this.cfgRef.onSnapshot((s) => { S.cfg = mergeCfg(s.exists ? clone(s.data()) : null); this.got.cfg = true; done(); }, (e) => this.fail(e));
    this.monthsCol.onSnapshot((q) => { const m = {}; q.docs.forEach((d) => { m[d.id] = clone(d.data()); }); S.months = m; this.got.months = true; done(); }, (e) => this.fail(e));
  },
  fail() { toast('La synchronisation est interrompue : recharge la page.'); },
  write(key, ref, body) {
    const run = () => ref.set(body).catch((e) => {
      if (e && e.code === 'unavailable') return new Promise((r) => setTimeout(r, 600 + Math.random() * 600)).then(() => ref.set(body));
      throw e;
    }).catch((e) => toast(e && e.code === 'quota_exceeded' ? 'Stockage plein : supprime de vieilles opérations.' : "L'enregistrement a échoué. Réessaie."));
    this.chain[key] = (this.chain[key] || Promise.resolve()).then(run);
    return this.chain[key];
  },
  saveCfg() { if (this.mode === 'db') return this.write('cfg', this.cfgRef, clone(S.cfg)); this.saveLocal(); return Promise.resolve(); },
  saveMonth(ym) { if (this.mode === 'db') return this.write(ym, this.monthsCol.doc(ym), clone(month(ym))); this.saveLocal(); return Promise.resolve(); },
  async replaceAll(cfg, months) {
    const old = Object.keys(S.months);
    S.cfg = mergeCfg(cfg); S.months = months;
    if (this.mode !== 'db') { this.saveLocal(); return; }
    await this.saveCfg();
    for (const k of Object.keys(months)) await this.saveMonth(k);
    for (const k of old) if (!months[k]) await this.monthsCol.doc(k).delete().catch(() => {});
  },
};

/* ================= opérations ================= */
function addExpense(a, c, d, n) {
  const ym = d.slice(0, 7), m = clone(month(ym));
  m.e.push({ id: uid(), a, c, d, n: n.slice(0, 80), t: Date.now() });
  S.months[ym] = m; Store.saveMonth(ym);
}
function addTransfer(a, f, d, n) {
  const ym = d.slice(0, 7), m = clone(month(ym));
  m.v.push({ id: uid(), a, f: f.slice(0, 60), d, n: n.slice(0, 80), t: Date.now() });
  S.months[ym] = m; Store.saveMonth(ym);
}
function removeOp(kind, ym, id) {
  const m = clone(month(ym)); m[kind] = m[kind].filter((x) => x.id !== id);
  S.months[ym] = m; Store.saveMonth(ym);
}
function setBalance(a) {
  const prev = balance().now;
  S.cfg.anchor = { amount: a, at: Date.now(), set: true };
  S.cfg.history = [{ a, at: S.cfg.anchor.at, prev }, ...(S.cfg.history || [])].slice(0, 12);
  Store.saveCfg();
}

/* ================= météo (Open-Meteo, sans clé) ================= */
const WMO = (c) => c === 0 ? ['Ciel dégagé', 'sun'] : c <= 2 ? ['Éclaircies', 'csun'] : c === 3 ? ['Couvert', 'cloud'] : c <= 48 ? ['Brouillard', 'fog']
  : c <= 57 ? ['Bruine', 'rain'] : c <= 67 ? ['Pluie', 'rain'] : c <= 77 ? ['Neige', 'snow'] : c <= 82 ? ['Averses', 'rain'] : c <= 86 ? ['Averses de neige', 'snow'] : ['Orage', 'storm'];
async function loadWeather(force) {
  const city = S.cfg.city, key = `foxbank-wx:${city.lat},${city.lon}`;
  try { const c = JSON.parse(ls.get(key) || 'null'); if (c && !force && Date.now() - c.at < 30 * 60e3) { S.wx = c.w; S.wxState = 'ok'; updateWx(); return; } } catch {}
  S.wxState = 'loading';
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`;
    const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw 0;
    const j = await r.json();
    S.wx = { t: j.current.temperature_2m, code: j.current.weather_code, day: j.current.is_day, max: j.daily.temperature_2m_max[0], min: j.daily.temperature_2m_min[0], rain: j.daily.precipitation_probability_max[0] };
    S.wxState = 'ok'; ls.set(key, JSON.stringify({ at: Date.now(), w: S.wx }));
  } catch { S.wxState = 'off'; }
  updateWx();
}
function wxHtml() {
  const c = S.cfg.city.name;
  if (S.wxState === 'ok' && S.wx) {
    const [lab, icn] = WMO(S.wx.code), icon = !S.wx.day && (icn === 'sun' || icn === 'csun') ? 'moon' : icn;
    return `${ic(icon)}<span class="t num">${Math.round(S.wx.t)}°</span><span>${lab} · ${Math.round(S.wx.min)}° / ${Math.round(S.wx.max)}°${S.wx.rain != null ? ` · pluie ${S.wx.rain} %` : ''}<br>${esc(c)}</span>`;
  }
  if (S.wxState === 'off') return `${ic('cloud')}<span>Météo indisponible ici${window.claude ? ' : elle s’affiche dans l’appli Fox Bank de ton écran d’accueil' : ' pour le moment'}.</span>`;
  return `${ic('cloud')}<span>Météo de ${esc(c)}…</span>`;
}
function updateWx() { const el = $('#wx'); if (el) el.innerHTML = wxHtml(); }

function niceMax(v) { if (v <= 0) return 1000; const e = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= v) return m * e; return 10 * e; }
function dayChart(ym) {

  const max = niceMax(Math.max(...per)), W = 340, H = 160, L = 40, R = 6, T = 10, B = 22, cw = (W - L - R) / n, bw = Math.max(3, cw - 2), ih = H - T - B;

  per.forEach((v, i) => {

  per.forEach((v, i) => { g += `<rect class="hit" x="${L + i * cw}" y="${T}" width="${cw}" height="${ih}" data-day="${i + 1}" data-v="${v}"/>`; });

  else if (a === 'del') {
    const id = t.dataset.id;
    if (S.arm !== id) { S.arm = id; clearTimeout(armT); armT = setTimeout(() => { S.arm = null; render(); }, 3500); render(); return; }
    S.arm = null; removeOp(t.dataset.k, t.dataset.ym, id); toast(t.dataset.k === 'e' ? 'Dépense supprimée.' : 'Virement supprimé.'); render();
  } else if (a === 'city') {
    const x = (S.cityRes || [])[+t.dataset.i]; if (!x) return;
    S.cfg.city = { name: x.name, lat: x.latitude, lon: x.longitude }; Store.saveCfg(); $('#cityres').innerHTML = ''; $('#scity').value = '';
    toast(`Météo : ${x.name}`); loadWeather(true);
  } else if (a === 'export') {
    const txt = JSON.stringify({ foxbank: 1, at: new Date().toISOString(), cfg: S.cfg, months: S.months });
    try { await navigator.clipboard.writeText(txt); toast('Données copiées. Colle-les dans l’autre Fox Bank (Réglages › Coller des données).'); }
    catch { const x = $('#expText'); x.hidden = false; x.value = txt; x.select(); toast('Copie automatique impossible : sélectionne le texte affiché et copie-le.'); }
  } else if (a === 'importOpen') { const b = $('#imp'); b.hidden = !b.hidden; }
  else if (a === 'import') {
    let j = null; try { j = JSON.parse($('#impText').value); } catch {}
    if (!j || j.foxbank !== 1 || !j.cfg || typeof j.months !== 'object') { toast('Ce texte ne vient pas de Fox Bank. Copie-le avec « Copier mes données ».'); return; }
    if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Toucher encore pour confirmer'; setTimeout(() => { delete t.dataset.armed; t.textContent = 'Remplacer mes données par celles-ci'; }, 4000); return; }
    await Store.replaceAll(j.cfg, j.months); $('#impText').value = ''; $('#imp').hidden = true; toast('Données importées.'); render();
  } else if (a === 'wipe') {
    if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Toucher encore pour tout effacer'; setTimeout(() => { delete t.dataset.armed; t.textContent = 'Tout effacer'; }, 4000); return; }
    await Store.replaceAll(defaultCfg(), {}); toast('Toutes les données ont été effacées.'); render();
  }
});

/* ================= démarrage ================= */
route();
setInterval(tick, 10000); tick();
Store.start().then(() => loadWeather(false));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); loadWeather(false); } });
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
